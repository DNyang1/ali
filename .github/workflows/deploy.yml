name: Deploy with Docker

on:
  push:
    branches: [ "main", "ci_cd" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: JDK 21 설치
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 빌드
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      # 1. 도커 이미지 빌드 & 푸시
      - name: Docker Hub 로그인 (GitHub Actions)
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 도커 이미지 빌드 및 푸시
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ali-project:latest

      # 2. 서버에서 실행 (SSH)
      - name: 서버 배포
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            # 기존 서비스 중지
            sudo systemctl stop ali || true
            sudo systemctl disable ali || true
            
            # Docker Hub 로그인
            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # 최신 이미지 다운로드
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/ali-project:latest
            
            # 기존 컨테이너 삭제
            sudo docker stop ali-server || true
            sudo docker rm ali-server || true
            
            # 폴더가 없으면 미리 생성 (권한 문제 방지)
            mkdir -p /home/ubuntu/app/uploads
            chmod 777 /home/ubuntu/app/uploads
            
            # 컨테이너 실행
            sudo docker run -d \
              --name ali-server \
              --net=host \ 
              -v /home/ubuntu/app/application-dev.properties:/app/application-dev.properties \
              -v /home/ubuntu/app/uploads:/home/ubuntu/app/uploads \
              ${{ secrets.DOCKER_USERNAME }}/ali-project:latest \
              --spring.profiles.active=dev
            
            # 이미지 정리
            sudo docker image prune -f