name: Deploy to EC2

on:
  push:
    branches: [ "main", "feature/login_admin" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: JDK 21 설치
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: Gradle 빌드 (테스트 제외)
        run: ./gradlew build -x test

      - name: EC2로 파일 전송 (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "./build/libs/*.jar"
          target: "/home/ubuntu/app"
          strip_components: 2

      - name: 서버 통합 실행 (SSH)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            # 1. 기존 8080 포트 프로세스 종료
            sudo fuser -k 8080/tcp || true
            sleep 2
            
            # 2. 파일 위치로 이동 (strip_components: 2 설정 기준)
            cd /home/ubuntu/app
            
            # 3. 새 서버 실행
            nohup java -jar *.jar > nohup.out 2>&1 &
            
            # 4. 실행 확인을 위한 대기
            sleep 5