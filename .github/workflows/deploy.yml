name: Deploy with Docker

on:
  push:
    branches: [ "main", "feature/login_admin" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: JDK 21 설치
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 빌드
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      # 1. 도커 이미지 빌드 & 푸시
      - name: Docker Hub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 도커 이미지 빌드 및 푸시
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ali-project:latest

      # 2. 서버에서 실행 (SSH)
      - name: 서버 배포
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            # (중요) 기존 Systemd 서비스 끄기 (충돌 방지)
            sudo systemctl stop ali || true
            sudo systemctl disable ali || true
            
            # 최신 이미지 다운로드
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/ali-project:latest
            
            # 기존 컨테이너 삭제 (없으면 패스)
            sudo docker stop ali-server || true
            sudo docker rm ali-server || true
            
            # [핵심] 컨테이너 실행
            # --net=host: DB(localhost) 접속을 위해 서버 네트워크 공유
            # -v (설정파일): 서버에 있는 설정 파일을 컨테이너가 빌려 씀
            # -v (업로드): 서버의 업로드 폴더를 컨테이너랑 연결 (사진 안 깨지게)
            sudo docker run -d \
              --name ali-server \
              --net=host \
              -v /home/ubuntu/app/application-dev.properties:/app/application-dev.properties \
              -v /home/ubuntu/uploads:/home/ubuntu/uploads \
              ${{ secrets.DOCKER_USERNAME }}/ali-project:latest \
              --spring.profiles.active=dev
            
            # 안 쓰는 구버전 이미지 정리
            sudo docker image prune -f