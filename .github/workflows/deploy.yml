name: Deploy to EC2

on:
  push:
    branches: [ "main","feature/login_admin" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: JDK 21 설치
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: Gradle 빌드 (테스트 제외)
        run: ./gradlew build -x test

      - name: EC2로 파일 전송 (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "./build/libs/*.jar"
          target: "/home/ubuntu/app"
          strip_components: 2

      - name: 배포 스크립트 실행 (SSH)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            # 1. 실행 중인 자바 프로세스 종료
            pid=$(pgrep -f ali)
            if [ -n "$pid" ]; then
              kill -15 $pid
              sleep 10
            fi
            
            # 2. 새 파일 실행 (prod 프로필 적용)
            # nohup: 백그라운드 실행, logs: 로그 저장
            nohup java -jar -Dspring.profiles.active=prod /home/ubuntu/app/finalProject-0.0.1-SNAPSHOT.jar > /home/ubuntu/app/nohup.out 2>&1 &