name: Deploy to EC2

on:
  push:
    branches: [ "main", "feature/login_admin" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: JDK 21 설치
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: Gradle 빌드 (테스트 제외)
        run: ./gradlew build -x test

      - name: EC2로 파일 전송 (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "./build/libs/*.jar"
          target: "/home/ubuntu/app"
          strip_components: 2

      - name: 서버 통합 실행 (SSH)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            # 1. 파일 위치로 이동
            cd /home/ubuntu/app

            # 2. 기존 JAR 파일이 있다면 백업하거나 정리 (선택사항, 덮어쓰기 되므로 생략 가능)
            
            # 3. [핵심] Systemd를 이용해 서버 재시작
            # (이제 nohup 대신 이 명령어가 알아서 다 해줍니다)
            sudo systemctl restart ali
            
            # 4. 잘 켜졌는지 상태 확인 (로그 10줄 출력)
            sleep 5
            sudo systemctl status ali --no-pager