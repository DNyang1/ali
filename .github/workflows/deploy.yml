name: Deploy to EC2

on:
  push:
    branches: [ "main","feature/login_admin" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: JDK 21 설치
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: Gradle 빌드 (테스트 제외)
        run: ./gradlew build -x test

      - name: EC2로 파일 전송 (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "./build/libs/*.jar"
          target: "/home/ubuntu/app"
          strip_components: 2

      - name: 서버 통합 실행 (SSH)
          uses: appleboy/ssh-action@master
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ubuntu
            key: ${{ secrets.EC2_KEY }}
            script: |
              # 1. 기존 8080 포트 프로세스 종료
              sudo fuser -k 8080/tcp || true
              sleep 2
              
              # 2. 파일 위치 확인 및 정리 (strip_components: 2 설정으로 인해 /home/ubuntu/app 바로 아래에 jar가 있음)
              cd /home/ubuntu/app
              
              # 3. 새 서버 실행 (가장 최근에 생성된 jar 파일 실행)
              # -Dspring.profiles.active=prod 설정이 필요 없다면 빼셔도 됩니다.
              nohup java -jar *.jar > nohup.out 2>&1 &
              
              # 4. 실행 확인을 위해 5초 대기
              sleep 5