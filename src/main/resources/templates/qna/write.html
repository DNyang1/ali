<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문의 작성</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">

<header class="border-b border-slate-200 bg-gradient-to-r from-teal-500 to-sky-500 text-white">
  <div class="mx-auto max-w-[1200px] px-4 py-8 lg:px-6">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight sm:text-3xl">✏️ 문의 작성</h1>
        <p class="mt-2 text-sm/6 text-white/90">
          문의 내용을 남겨주시면 빠르게 확인 후 답변드릴게요.
        </p>
      </div>

    </div>
  </div>
</header>

<main class="mx-auto max-w-[1200px] px-4 py-8 lg:px-6">
  <section class="grid gap-6 lg:grid-cols-[1fr_360px]">

    <div class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
      <div class="border-b border-slate-100 px-5 py-4">
        <h2 class="text-base font-extrabold text-slate-900">문의 정보</h2>
        <p class="mt-1 text-sm text-slate-500">제목과 내용을 입력해 주세요.</p>
      </div>

      <form class="px-5 py-5 space-y-5" th:action="@{/qna/write}" method="post">

        <div>
          <label for="title" class="mb-1 block text-xs font-semibold text-slate-600">제목</label>
          <input type="text" id="title" name="title" required
                 placeholder="제목을 입력하세요"
                 class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-800
                          placeholder:text-slate-400 outline-none transition
                          focus:border-teal-300 focus:ring-4 focus:ring-teal-100" />
        </div>

        <div>
          <label for="content" class="mb-1 block text-xs font-semibold text-slate-600">내용</label>
          <textarea id="content" name="content" rows="10" required
                    placeholder="문의 내용을 자세히 적어주세요"
                    class="w-full resize-y rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-800
                             placeholder:text-slate-400 outline-none transition
                             focus:border-sky-300 focus:ring-4 focus:ring-sky-100"></textarea>
          <p class="mt-2 text-xs text-slate-500">
            개인정보(주민번호/카드번호 등)는 입력하지 마세요.
          </p>
        </div>

        <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-end">
          <a th:href="@{/qna/list}"
             class="inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white px-4 py-3
                      text-sm font-extrabold text-slate-700 hover:bg-slate-50 transition">
            목록으로
          </a>

          <button type="submit"
                  class="inline-flex items-center justify-center rounded-xl bg-gradient-to-r from-teal-500 to-sky-500 px-5 py-3
                           text-sm font-extrabold text-white shadow-sm transition
                           hover:from-teal-600 hover:to-sky-600 active:scale-[0.99]">
            등록하기
          </button>
        </div>

      </form>
    </div>

    <aside class="space-y-4">
      <div class="rounded-2xl border border-slate-200 bg-white shadow-sm p-5">
        <h3 class="text-sm font-extrabold text-slate-900">작성 팁</h3>
        <ul class="mt-3 space-y-2 text-sm text-slate-600">
          <li class="flex gap-2">
            <span class="mt-0.5 grid h-6 w-6 place-items-center rounded-lg bg-teal-50 text-teal-700 font-bold">1</span>
            어떤 문제가 발생했는지 상황을 구체적으로 적어주세요.
          </li>
          <li class="flex gap-2">
            <span class="mt-0.5 grid h-6 w-6 place-items-center rounded-lg bg-sky-50 text-sky-700 font-bold">2</span>
            주문번호/상품명/날짜 등 관련 정보를 함께 적으면 더 빨라요.
          </li>
          <li class="flex gap-2">
            <span class="mt-0.5 grid h-6 w-6 place-items-center rounded-lg bg-slate-100 text-slate-700 font-bold">3</span>
            개인정보는 적지 말고, 필요 시 고객센터가 별도로 안내해요.
          </li>
        </ul>
      </div>

      <div class="rounded-2xl border border-slate-200 bg-gradient-to-br from-teal-50 to-sky-50 p-5">
        <h3 class="text-sm font-extrabold text-slate-900">처리 시간 안내</h3>
        <p class="mt-2 text-sm text-slate-600">
          보통 영업일 기준 <span class="font-extrabold text-slate-900">1~2일</span> 내 답변드립니다.
        </p>
      </div>
    </aside>

  </section>
</main>

</body>
</html>
