<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>QnA 상세</title>
  <link rel="stylesheet" href="/qna/css/qna.css">
</head>
<body>

<div class="help-header">
  <h1>📄 문의 상세</h1>
  <a th:href="@{/qna/list}" class="btn-close">목록으로</a>
</div>

<div class="container">
  <div class="content-box">
    <div class="qna-title" th:text="${qna.title}">제목</div>
    <div class="qna-meta" th:text="${#temporals.format(qna.createdAt, 'yyyy.MM.dd HH:mm')}">날짜</div>
    <div class="qna-body" th:text="${qna.content}">내용</div>
  </div>

  <div class="answer-box" th:if="${qna.answer != null}">
    <div class="answer-header">
      <span class="answer-badge">답변완료</span>
      <span style="font-weight: bold;">관리자</span>
      <span class="answer-date" th:text="${#temporals.format(qna.answeredAt, 'yyyy.MM.dd HH:mm')}"></span>
    </div>
    <div class="answer-content" th:text="${qna.answer}">
      관리자 답변 내용...
    </div>
  </div>

  <div class="waiting-msg" th:if="${qna.answer == null}">
    🕰️ 관리자가 확인 후 답변을 드릴 예정입니다.
  </div>
</div>

</body>
</html>
