<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QnA 상세</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">

<header class="border-b border-slate-200 bg-gradient-to-r from-teal-500 to-sky-500 text-white">
  <div class="mx-auto max-w-[1200px] px-4 py-8 lg:px-6">
    <div>
      <h1 class="text-2xl font-extrabold tracking-tight sm:text-3xl">📄 문의 상세</h1>
      <p class="mt-2 text-sm/6 text-white/90">
        문의 내용과 답변 상태를 확인할 수 있어요.
      </p>
    </div>
  </div>
</header>

<main class="mx-auto max-w-[1200px] px-4 py-8 lg:px-6">
  <section class="grid gap-6 lg:grid-cols-[1fr_360px]">

    <!-- QnA Content -->
    <article class="relative rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden pb-20">
      <div class="border-b border-slate-100 px-5 py-4">
        <div class="flex items-start justify-between gap-4">
          <div class="min-w-0">
            <h2 class="truncate text-lg font-extrabold text-slate-900"
                th:text="${qna.title}">제목</h2>
            <p class="mt-1 text-sm font-semibold text-slate-500"
               th:text="${#temporals.format(qna.createdAt, 'yyyy.MM.dd HH:mm')}">날짜</p>
          </div>

          <div class="shrink-0">
            <span th:if="${qna.answer == null}"
                  class="inline-flex items-center rounded-full border border-amber-200 bg-amber-50 px-3 py-1 text-xs font-extrabold text-amber-700">
              대기중
            </span>
            <span th:if="${qna.answer != null}"
                  class="inline-flex items-center rounded-full border border-emerald-200 bg-emerald-50 px-3 py-1 text-xs font-extrabold text-emerald-700">
              답변완료
            </span>
          </div>
        </div>
      </div>

      <div class="px-5 py-5">
        <div class="whitespace-pre-wrap text-sm font-semibold leading-7 text-slate-800"
             th:text="${qna.content}">
          내용
        </div>
      </div>

      <a th:href="@{/qna/list}"
         class="absolute bottom-5 right-5 inline-flex items-center justify-center gap-2
          rounded-xl border border-slate-200 bg-white px-5 py-2.5
          text-sm font-extrabold text-slate-700 shadow-sm
          hover:bg-slate-50 hover:text-slate-900 hover:border-slate-300
          active:scale-[0.99] transition">
        <span class="text-base leading-none">↩</span>
        목록으로
      </a>
    </article>

    <!-- Right Column -->
    <aside class="space-y-4">

      <!-- Answer Box -->
      <section th:if="${qna.answer != null}"
               class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
        <div class="border-b border-slate-100 px-5 py-4">
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-2">
              <span class="inline-flex items-center rounded-full border border-emerald-200 bg-emerald-50 px-3 py-1 text-xs font-extrabold text-emerald-700">
                답변완료
              </span>
              <span class="text-sm font-extrabold text-slate-900">관리자</span>
            </div>
            <span class="text-xs font-semibold text-slate-500"
                  th:text="${#temporals.format(qna.answeredAt, 'yyyy.MM.dd HH:mm')}">답변 날짜</span>
          </div>
        </div>

        <div class="px-5 py-5">
          <div class="whitespace-pre-wrap text-sm font-semibold leading-7 text-slate-800"
               th:text="${qna.answer}">
            관리자 답변 내용...
          </div>
        </div>
      </section>

      <!-- Waiting Msg -->
      <section th:if="${qna.answer == null}"
               class="rounded-2xl border border-amber-200 bg-amber-50 p-5">
        <div class="flex items-start gap-3">
          <div class="grid h-10 w-10 place-items-center rounded-2xl bg-amber-100 text-amber-700">
            🕰️
          </div>
          <div>
            <h3 class="text-sm font-extrabold text-slate-900">답변 대기중</h3>
            <p class="mt-1 text-sm font-semibold text-amber-800">
              관리자가 확인 후 답변을 드릴 예정입니다.
            </p>
            <p class="mt-2 text-xs font-semibold text-slate-600">
              보통 영업일 기준 1~2일 내 답변됩니다.
            </p>
          </div>
        </div>
      </section>

      <!-- Helper -->
      <section class="rounded-2xl border border-slate-200 bg-gradient-to-br from-teal-50 to-sky-50 p-5">
        <h3 class="text-sm font-extrabold text-slate-900">도움이 더 필요하신가요?</h3>
        <p class="mt-2 text-sm text-slate-600">
          추가 문의가 있다면 새 문의를 작성해 주세요.
        </p>
        <a th:href="@{/qna/write}"
           class="mt-4 inline-flex w-full items-center justify-center rounded-xl bg-gradient-to-r from-teal-500 to-sky-500 px-4 py-3
                  text-sm font-extrabold text-white shadow-sm transition
                  hover:from-teal-600 hover:to-sky-600">
          ✏️ 새 문의 작성
        </a>
      </section>

    </aside>

  </section>
</main>

</body>
</html>
