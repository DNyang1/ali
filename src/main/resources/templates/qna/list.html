<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>고객센터</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">

<header class="border-b border-slate-200 bg-gradient-to-r from-teal-500 to-sky-500 text-white">
  <div class="mx-auto max-w-[1200px] px-4 py-8 lg:px-6">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight sm:text-3xl">🛍️ 고객센터</h1>
        <p class="mt-2 text-sm/6 text-white/90">
          안녕하세요! 무엇을 도와드릴까요?
        </p>
      </div>

    </div>


</header>

<main class="mx-auto max-w-[1200px] px-4 py-8 lg:px-6">
  <section class="mb-5 flex items-center justify-between gap-3">
    <div class="inline-flex rounded-2xl border border-slate-200 bg-white p-1 shadow-sm">
      <a th:href="@{/qna/list(showAll=true)}"
         class="rounded-xl px-4 py-2 text-sm font-extrabold transition"
         th:classappend="${showAll} ? ' bg-gradient-to-r from-teal-500 to-sky-500 text-white shadow-sm' : ' text-slate-600 hover:bg-slate-50'">
        전체 문의
      </a>

      <a th:href="@{/qna/list(showAll=false)}"
         class="rounded-xl px-4 py-2 text-sm font-extrabold transition"
         th:classappend="${!showAll} ? ' bg-gradient-to-r from-teal-500 to-sky-500 text-white shadow-sm' : ' text-slate-600 hover:bg-slate-50'">
        내 문의만
      </a>
    </div>

    <a th:href="@{/}"
       class="inline-flex items-center justify-center rounded-xl bg-gradient-to-r from-teal-500 to-sky-500 px-4 py-2
                    text-sm font-extrabold text-white shadow-sm transition
                    hover:from-teal-600 hover:to-sky-600">
      메인으로
    </a>
  </section>

  <section class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
    <div class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
      <div>
        <h2 class="text-base font-extrabold text-slate-900">문의 목록</h2>
        <p class="mt-1 text-sm text-slate-500">클릭하면 상세 페이지로 이동합니다.</p>
      </div>
    </div>

    <div class="divide-y divide-slate-100">
      <div th:if="${qnaList.isEmpty()}" class="px-5 py-10 text-center">
        <div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-slate-100 text-slate-600">💬</div>
        <p class="mt-3 text-sm font-bold text-slate-700">등록된 문의가 없습니다.</p>
        <a th:href="@{/qna/write}"
           class="mt-4 inline-flex items-center justify-center rounded-xl bg-gradient-to-r from-teal-500 to-sky-500 px-4 py-2 text-sm font-extrabold text-white hover:from-teal-600 hover:to-sky-600 transition">
          ✏️ 첫 문의 남기기
        </a>
      </div>

      <div th:each="qna : ${qnaList}"
           class="group cursor-pointer px-5 py-4 hover:bg-slate-50 transition"
           th:onclick="|location.href='@{/qna/detail/{id}(id=${qna.qnaId})}'|">

        <div class="flex items-start justify-between gap-4">
          <div class="min-w-0">
            <div class="truncate text-sm font-extrabold text-slate-900 group-hover:text-slate-950"
                 th:text="${qna.title}">제목</div>

            <div class="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1 text-xs font-semibold text-slate-500">
                <span class="rounded-full bg-slate-100 px-2 py-1 text-slate-600"
                      th:text="${qna.writerId}">작성자</span>
              <span th:text="${#temporals.format(qna.createdAt, 'yyyy.MM.dd')}">날짜</span>
            </div>
          </div>

          <div class="shrink-0">
              <span th:if="${qna.status == 'WAITING'}"
                    class="inline-flex items-center rounded-full border border-amber-200 bg-amber-50 px-3 py-1 text-xs font-extrabold text-amber-700">
                대기중
              </span>
            <span th:if="${qna.status == 'COMPLETED'}"
                  class="inline-flex items-center rounded-full border border-emerald-200 bg-emerald-50 px-3 py-1 text-xs font-extrabold text-emerald-700">
                답변완료
              </span>
          </div>
        </div>

      </div>
    </div>
  </section>
</main>

<a th:href="@{/qna/write}"
   class="fixed bottom-6 right-6 z-50 inline-flex items-center gap-2 rounded-full
            bg-gradient-to-r from-teal-500 to-sky-500 px-5 py-3 text-sm font-extrabold text-white
            shadow-lg shadow-slate-300/60 hover:from-teal-600 hover:to-sky-600 transition">
  ✏️ 문의하기
</a>

</body>
</html>
