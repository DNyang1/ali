<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="mypage/supplier/layout/base :: layout(~{::content}, null)">

    <th:block th:fragment="content">

        <section class="space-y-6">

            <section>
                <h1 class="text-2xl font-bold text-slate-900">공급자 주문 상세</h1>
                <p class="mt-1 text-sm text-slate-500">
                    주문 정보 확인 및 배송 처리를 진행하세요.
                </p>
            </section>

            <div id="detail">불러오는 중...</div>

            <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                <header class="flex items-center justify-between">
                    <h2 class="text-base font-bold text-slate-900">배송 처리</h2>
                    <span class="text-xs text-slate-500">송장 입력 후 배송 완료 처리</span>
                </header>

                <div class="mt-4 grid grid-cols-1 gap-3 md:grid-cols-2">
                    <label class="block">
                        <span class="text-sm font-semibold text-slate-700">택배사</span>
                        <input type="text" id="carrier" placeholder="예: CJ대한통운"
                               class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm
                          outline-none focus:border-blue-500">
                    </label>

                    <label class="block">
                        <span class="text-sm font-semibold text-slate-700">송장번호</span>
                        <input type="text" id="trackingNo" placeholder="예: 1234-5678-9012"
                               class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm
                          outline-none focus:border-blue-500">
                    </label>
                </div>

                <div class="mt-4 flex justify-end">
                    <button type="button" onclick="ship()"
                            class="rounded-lg bg-blue-600 px-5 py-2 text-sm font-bold text-white hover:bg-blue-700">
                        배송 완료 처리
                    </button>
                </div>
            </section>

        </section>

<script th:inline="javascript">
    const orderItemId = [[${orderItemId}]];
</script>

<script>
    // 1) 상세 조회
    fetch(`/api/order/sup/${orderItemId}`)
        .then(res => {
            if (!res.ok) throw new Error('상세 조회 실패');
            return res.json();
        })
        .then(data => {
            render(data);
            // 기존 값 있으면 입력칸에 세팅
            document.getElementById('carrier').value = data.carrier || '';
            document.getElementById('trackingNo').value = data.trackingNo || '';
        })
        .catch(err => {
            console.error(err);
            document.getElementById('detail').innerText = '상세 정보를 불러오지 못했습니다.';
        });

    function render(d) {
        const el = document.getElementById('detail');

        el.innerHTML = `
    <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <div class="flex items-start justify-between gap-4">
        <div>
          <h2 class="text-lg font-bold text-slate-900">주문 상세</h2>
          <p class="mt-1 text-xs text-slate-500">orderItemId: ${d.orderItemId}</p>
        </div>

        <div class="flex flex-col items-end gap-2">
          <span class="inline-flex rounded-full bg-slate-100 px-2 py-1 text-xs font-semibold text-slate-700">
            주문상태: ${d.orderStatus}
          </span>
          <span class="inline-flex rounded-full bg-slate-100 px-2 py-1 text-xs font-semibold text-slate-700">
            공급자상태: ${d.supplierStatus || '-'}
          </span>
        </div>
      </div>

      <div class="mt-4 grid grid-cols-1 gap-3 md:grid-cols-2">
        <div class="rounded-xl border border-slate-100 p-4">
          <div class="text-xs font-semibold text-slate-500">주문정보</div>
          <dl class="mt-2 space-y-1 text-sm">
            <div class="flex justify-between gap-3">
              <dt class="text-slate-500">orderId</dt>
              <dd class="font-semibold text-slate-900">${d.orderId}</dd>
            </div>
            <div class="flex justify-between gap-3">
              <dt class="text-slate-500">주문일</dt>
              <dd class="text-slate-800">${d.orderedAt}</dd>
            </div>
            <div class="flex justify-between gap-3">
              <dt class="text-slate-500">구매자</dt>
              <dd class="text-slate-800">${d.buyerId}</dd>
            </div>
          </dl>
        </div>

        <div class="rounded-xl border border-slate-100 p-4">
          <div class="text-xs font-semibold text-slate-500">상품정보</div>
          <dl class="mt-2 space-y-1 text-sm">
            <div class="flex justify-between gap-3">
              <dt class="text-slate-500">상품명</dt>
              <dd class="font-semibold text-slate-900">${d.productName}</dd>
            </div>
            <div class="flex justify-between gap-3">
              <dt class="text-slate-500">옵션</dt>
              <dd class="text-slate-800">${d.optionSummary || '-'}</dd>
            </div>
            <div class="flex justify-between gap-3">
              <dt class="text-slate-500">수량</dt>
              <dd class="text-slate-800">${d.quantity}</dd>
            </div>
            <div class="flex justify-between gap-3">
              <dt class="text-slate-500">단가</dt>
              <dd class="text-slate-800">${Number(d.unitPrice).toLocaleString()}원</dd>
            </div>
          </dl>
        </div>
      </div>

      <div class="mt-4 rounded-xl border border-slate-100 p-4">
        <div class="text-xs font-semibold text-slate-500">배송정보</div>
        <dl class="mt-2 space-y-1 text-sm">
          <div class="flex justify-between gap-3">
            <dt class="text-slate-500">택배사</dt>
            <dd class="text-slate-800">${d.carrier || '-'}</dd>
          </div>
          <div class="flex justify-between gap-3">
            <dt class="text-slate-500">송장번호</dt>
            <dd class="text-slate-800">${d.trackingNo || '-'}</dd>
          </div>
        </dl>
      </div>
    </section>
  `;
    }

    // 2) 배송 처리(송장 저장 + 상태 변경)
    async function ship() {
        const carrier = document.getElementById('carrier').value.trim();
        const trackingNo = document.getElementById('trackingNo').value.trim();

        if (!carrier || !trackingNo) {
            alert('택배사와 송장번호를 입력해주세요.');
            return;
        }

        try {
            const res = await fetch(`/api/order/sup/${orderItemId}/ship`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ carrier, trackingNo })
            });

            if (!res.ok) throw new Error('배송 처리 실패');

            alert('배송 처리 완료');

            // 갱신
            const detailRes = await fetch(`/api/order/sup/${orderItemId}`);
            const data = await detailRes.json();
            render(data);

        } catch (e) {
            console.error(e);
            alert('배송 처리 중 오류가 발생했습니다.');
        }
    }
</script>

    </th:block>
</th:block>
