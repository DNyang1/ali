<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="mypage/supplier/layout/base :: layout(~{::content}, null)">

    <th:block th:fragment="content">

<section class="space-y-4">
    <header>
        <h1 class="text-2xl font-bold text-slate-900">공급자 주문 관리</h1>
        <p class="text-sm text-slate-500">접수된 주문을 확인하고 처리하세요.</p>
    </header>

    <div id="supplier-order-list"
         class="space-y-4">
        주문을 불러오는 중...
    </div>
</section>

        <script>
            fetch('/api/order/sup')
                .then(res => {
                    if (!res.ok) throw new Error('주문 조회 실패');
                    return res.json();
                })
                .then(list => {
                    if (!Array.isArray(list)) list = [];

                    const params = new URLSearchParams(location.search);

                    // ✅ 기존 기능: 상태 필터 유지
                    const status = norm(params.get('supplierStatus')); // READY
                    const filtered = status
                        ? list.filter(o => norm(o.supplierStatus) === status)
                        : list;

                    // ✅ 추가 기능: 프론트 페이징(10개씩)
                    const size = 10;
                    const page = Math.max(1, parseInt(params.get('page') || '1', 10) || 1);
                    const totalPages = Math.max(1, Math.ceil(filtered.length / size));
                    const safePage = Math.min(page, totalPages);

                    const start = (safePage - 1) * size;
                    const sliced = filtered.slice(start, start + size);

                    render(sliced);
                    renderPager(safePage, totalPages, status);

                    // page가 범위를 벗어나면(예: 필터 적용 후 페이지가 줄어듦) URL 정리
                    if (safePage !== page) {
                        const next = new URLSearchParams(location.search);
                        next.set('page', String(safePage));
                        if (status) next.set('supplierStatus', status);
                        history.replaceState(null, '', `${location.pathname}?${next.toString()}`);
                    }
                })
                .catch(err => {
                    console.error(err);
                    const el = document.getElementById('supplier-order-list');
                    if (el) el.innerText = '주문 정보를 불러오지 못했습니다.';
                });

            function norm(v) {
                return (v || '').toString().trim().toUpperCase();
            }

            function render(list) {
                const el = document.getElementById('supplier-order-list');
                if (!el) return;
                el.innerHTML = '';

                if (!list || list.length === 0) {
                    el.innerText = '접수된 주문이 없습니다.';
                    return;
                }

                list.forEach(o => {
                    const div = document.createElement('div');
                    const orderItemId = (o.orderItemId ?? '').toString().replace(/'/g, "\\'");

                    div.innerHTML = `
<div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm space-y-1">
  <div class="flex items-center justify-between">
    <div class="text-sm font-bold text-slate-900">주문 #${o.orderId ?? '-'}</div>
    <span class="text-xs font-semibold px-2 py-1 rounded-full bg-slate-100 text-slate-600">
      ${o.orderStatus ?? '-'}
    </span>
    <span class="text-xs font-semibold px-2 py-1 rounded-full bg-slate-100 text-slate-600">
      ${o.supplierStatus ?? '-'}
    </span>
  </div>

  <div class="text-xs text-slate-500">${o.orderedAt ?? '-'}</div>

  <div class="pt-2 grid grid-cols-2 gap-x-4 gap-y-1 text-sm">
    <div><span class="text-slate-500">구매자</span> ${o.buyerId ?? '-'}</div>
    <div><span class="text-slate-500">상품</span> ${o.productName ?? '-'}</div>
    <div><span class="text-slate-500">옵션</span> ${o.optionSummary || '-'}</div>
    <div><span class="text-slate-500">수량</span> ${o.quantity ?? '-'}</div>
    <div><span class="text-slate-500">단가</span> ${Number(o.unitPrice || 0).toLocaleString()}원</div>
  </div>

  <div class="pt-3 text-right">
    <button onclick="goDetail('${orderItemId}')"
      class="rounded-lg bg-blue-600 px-3 py-1.5 text-xs font-bold text-white hover:bg-blue-700">
      상세보기
    </button>
  </div>
</div>
`;
                    el.appendChild(div);
                });
            }

            // ✅ 추가: 페이지네이션 UI
            function renderPager(page, totalPages, status) {
                // 기존 pager 있으면 제거(필터 변경/재렌더 대응)
                const old = document.getElementById('supplier-order-pager');
                if (old) old.remove();

                // 주문이 0개거나 1페이지면 pager 숨김
                if (!totalPages || totalPages <= 1) return;

                const pager = document.createElement('div');
                pager.id = 'supplier-order-pager';
                pager.className = 'mt-6 flex flex-wrap items-center justify-center gap-2';

                // 링크 생성(필터 유지 + page만 변경)
                const makeHref = (p) => {
                    const qs = new URLSearchParams(location.search);
                    qs.set('page', String(p));
                    if (status) qs.set('supplierStatus', status); // ✅ 필터 유지
                    else qs.delete('supplierStatus');
                    return `${location.pathname}?${qs.toString()}`;
                };

                // 이전
                if (page > 1) {
                    pager.appendChild(pageBtn('이전', makeHref(page - 1), false));
                }

                // 페이지 번호 (너무 많으면 1~N 전부 말고 범위로 줄임)
                const windowSize = 7; // 1..7 정도만 보이게
                let start = Math.max(1, page - Math.floor(windowSize / 2));
                let end = Math.min(totalPages, start + windowSize - 1);
                start = Math.max(1, end - windowSize + 1);

                if (start > 1) {
                    pager.appendChild(pageBtn('1', makeHref(1), page === 1));
                    if (start > 2) pager.appendChild(ellipsis());
                }

                for (let p = start; p <= end; p++) {
                    pager.appendChild(pageBtn(String(p), makeHref(p), p === page));
                }

                if (end < totalPages) {
                    if (end < totalPages - 1) pager.appendChild(ellipsis());
                    pager.appendChild(pageBtn(String(totalPages), makeHref(totalPages), page === totalPages));
                }

                // 다음
                if (page < totalPages) {
                    pager.appendChild(pageBtn('다음', makeHref(page + 1), false));
                }

                const listEl = document.getElementById('supplier-order-list');
                listEl.after(pager);
            }

            function pageBtn(text, href, active) {
                const a = document.createElement('a');
                a.href = href;
                a.textContent = text;
                a.className =
                    'rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm font-semibold hover:bg-slate-50 ' +
                    (active ? 'border-blue-600 bg-blue-600 text-white hover:bg-blue-600' : 'text-slate-700');
                return a;
            }

            function ellipsis() {
                const span = document.createElement('span');
                span.textContent = '...';
                span.className = 'px-2 text-sm text-slate-400';
                return span;
            }

            // ✅ 기존 기능 유지
            window.goDetail = function(orderId) {
                location.href = `/mypage/supplier/order/${orderId}`;
            }
        </script>



    </th:block>
</th:block>
