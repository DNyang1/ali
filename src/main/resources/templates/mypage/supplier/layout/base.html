<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content, extraCss)">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle} ?: '공급자 마이페이지'">공급자 마이페이지</title>

    <!-- Tailwind (DEV용: CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">
<div class="min-h-screen">

    <!-- Header -->
    <div th:replace="mypage/supplier/partials/header :: header"></div>

    <!-- Layout -->
    <div class="mx-auto max-w-[1400px] px-4 py-6 lg:px-6">
        <div class="grid grid-cols-1 gap-6 lg:grid-cols-[260px_1fr]">

            <!-- Sidebar -->
            <aside class="lg:sticky lg:top-6 lg:h-[calc(100vh-3rem)]">
                <div th:replace="mypage/supplier/partials/sidebar :: sidebar"></div>
            </aside>

            <!-- Content -->
            <main class="min-w-0">
                <th:block th:replace="${content}"></th:block>
            </main>

        </div>
    </div>

    <!-- Footer -->
    <footer th:replace="layout/footer :: footer"></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script src="/common/js/header-unread.js"></script>
</body>
</html>
