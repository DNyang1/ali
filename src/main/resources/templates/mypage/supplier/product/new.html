<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="mypage/supplier/layout/base :: layout(~{::body}, ~{::head/link})">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle} ?: '상품 등록'">상품 등록</title>
    <link rel="stylesheet" href="/mypage/supplier/css/product.css">

</head>

<body>

    <section class="panel">
        <header class="panel-head">
            <h2 class="panel-title">상품 등록</h2>
            <a class="panel-link" th:href="@{/mypage/supplier/product}">목록</a>
        </header>

        <div class="panel-body">
            <form th:action="@{/mypage/supplier/product}" method="post" th:object="${form}">
                <label>카테고리 ID</label>
                <input type="text" th:field="*{categoryId}"/><br/><br/>

                <label>상품명</label>
                <input type="text" th:field="*{productName}" required/><br/><br/>

                <label>설명</label>
                <textarea th:field="*{description}"></textarea><br/><br/>

                <label>MOQ</label>
                <input type="number" th:field="*{moq}"/><br/><br/>

                <label>커스터마이즈</label>
                <select th:field="*{isCustomizable}">
                    <option value="0">불가</option>
                    <option value="1">가능</option>
                </select><br/><br/>

                <button type="submit">등록</button>
            </form>
        </div>
    </section>

</body>
</html>
