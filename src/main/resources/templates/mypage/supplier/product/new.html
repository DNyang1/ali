<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="mypage/supplier/layout/base :: layout(~{::content}, null)">

    <th:block th:fragment="content">

        <section class="rounded-2xl border border-slate-200 bg-white shadow-sm">

            <!-- 헤더 -->
            <header class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
                <div>
                    <h2 class="text-base font-bold text-slate-900">상품 등록</h2>
                    <p class="mt-1 text-sm text-slate-500">카테고리/상품 기본 정보를 입력해 주세요.</p>
                </div>

                <a th:href="@{/mypage/supplier/product}"
                   class="inline-flex items-center rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 hover:bg-slate-50">
                    목록
                </a>
            </header>

            <!-- 폼 -->
            <div class="px-5 py-6">
                <form th:action="@{/mypage/supplier/product}"
                      method="post"
                      th:object="${form}"
                      class="space-y-6">

                    <!-- 카테고리 -->
                    <div>
                        <label class="block text-sm font-bold text-slate-900">카테고리</label>
                        <p class="mt-1 text-sm text-slate-500">대분류 → 중분류 → 소분류 순서로 선택하세요.</p>

                        <div class="mt-3 grid grid-cols-1 gap-3 md:grid-cols-3">
                            <!-- ✅ JS hook 유지: id=cat1 -->
                            <select id="cat1"
                                    class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-blue-500">
                                <option value="">대분류 선택</option>
                                <option th:each="c : ${rootCategories}"
                                        th:value="${c.categoryId}"
                                        th:text="${c.categoryName}">
                                </option>
                            </select>

                            <!-- ✅ JS hook 유지: id=cat2 -->
                            <select id="cat2" disabled
                                    class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none disabled:bg-slate-50 disabled:text-slate-400 focus:border-blue-500">
                                <option value="">중분류 선택</option>
                            </select>

                            <!-- ✅ JS hook 유지: id=cat3 -->
                            <select id="cat3" disabled
                                    class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none disabled:bg-slate-50 disabled:text-slate-400 focus:border-blue-500">
                                <option value="">소분류 선택</option>
                            </select>
                        </div>

                        <!-- ✅ JS hook 유지: hidden + id=categoryId + th:field 그대로 -->
                        <input type="hidden" th:field="*{categoryId}" id="categoryId"/>
                    </div>

                    <!-- 상품명 -->
                    <div>
                        <label class="block text-sm font-bold text-slate-900">상품명</label>
                        <input type="text"
                               th:field="*{productName}"
                               required
                               class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none placeholder:text-slate-400 focus:border-blue-500"
                               placeholder="예) 나이키 에어맥스"/>
                        <p class="mt-1 text-xs text-slate-500">구매자가 알아보기 쉽게 입력해 주세요.</p>
                    </div>

                    <!-- 설명 -->
                    <div>
                        <label class="block text-sm font-bold text-slate-900">설명</label>
                        <textarea th:field="*{description}"
                                  rows="6"
                                  class="mt-2 w-full resize-y rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none placeholder:text-slate-400 focus:border-blue-500"
                                  placeholder="상품 특징, 구성, 주의사항 등을 입력하세요."></textarea>
                    </div>

                    <!-- 커스터마이즈 -->
                    <div>
                        <label class="block text-sm font-bold text-slate-900">커스터마이즈</label>
                        <select th:field="*{isCustomizable}"
                                class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-blue-500 md:w-64">
                            <option value="0">불가</option>
                            <option value="1">가능</option>
                        </select>
                        <p class="mt-1 text-xs text-slate-500">견적/주문서 기반 커스터마이즈를 허용할지 설정합니다.</p>
                    </div>

                    <!-- 버튼 -->
                    <div class="flex items-center justify-end gap-2 pt-2">
                        <a th:href="@{/mypage/supplier/product}"
                           class="inline-flex items-center rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 hover:bg-slate-50">
                            취소
                        </a>

                        <button type="submit"
                                class="inline-flex items-center rounded-xl bg-blue-600 px-5 py-2 text-sm font-bold text-white hover:bg-blue-700">
                            등록
                        </button>
                    </div>

                </form>
            </div>
        </section>

        <!-- ✅ 기존 JS 유지 -->
        <script src="/mypage/supplier/js/category-select.js"></script>

    </th:block>
</th:block>
