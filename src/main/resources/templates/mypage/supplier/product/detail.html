<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="mypage/supplier/layout/base :: layout(~{::body}, ~{::head/link})">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${pageTitle} ?: '상품 상세'">상품 상세</title>
  <link rel="stylesheet" href="/mypage/supplier/css/product.css">


</head>

<body>


  <section class="panel">
    <header class="panel-head">
      <h2 class="panel-title">상품 상세</h2>

      <div>
        <a class="panel-link"
           th:href="@{/mypage/supplier/product/{id}/edit(id=${product.productId})}">
          수정
        </a>
        <span> | </span>
        <a class="panel-link" th:href="@{/mypage/supplier/product}">
          목록
        </a>
      </div>

      <div>
        <a class="panel-link"
           th:href="@{/mypage/supplier/product/{id}/option(id=${product.productId})}">
          옵션 관리
        </a>
        <span> | </span>
        <a class="panel-link"
           th:href="@{/mypage/supplier/product/{id}/sku(id=${product.productId})}">
          SKU 관리
        </a>
      </div>
    </header>

    <div class="panel-body">
      <p><b>ID</b> : <span th:text="${product.productId}">1</span></p>
      <p><b>카테고리 ID</b> : <span th:text="${product.categoryId}">CAT-001</span></p>
      <hr style="margin:16px 0;">

      <div class="image-section">
        <h3>이미지</h3>

        <div style="margin-bottom:16px;">
          <p><b>대표 이미지</b></p>
          <img th:if="${thumbImagePath != null}"
               th:src="${thumbImagePath}"
               style="width:220px; height:220px; object-fit:cover; border:1px solid #ddd; border-radius:8px;">
        </div>

        <div>
          <p><b>상세 이미지</b></p>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <img th:each="img : ${detailImages}"
                 th:src="${img.imagePath}"
                 style="width:140px; height:140px; object-fit:cover; border:1px solid #ddd; border-radius:8px;">
          </div>
        </div>
      </div>

      <p><b>상품명</b> : <span th:text="${product.productName}">상품명</span></p>
      <p>
        <b>커스터마이즈</b> :
        <span th:text="${product.isCustomizable == 1 ? '가능' : '불가'}">
          가능
        </span>
      </p>
      <p><b>설명</b></p>
      <pre th:text="${product.description}">설명</pre>
    </div>
  </section>

</body>
</html>
