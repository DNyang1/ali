<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="mypage/supplier/layout/base :: layout(~{::content}, null)">

  <th:block th:fragment="content">

    <section class="rounded-2xl border border-slate-200 bg-white shadow-sm">

      <!-- 헤더 -->
      <header class="flex flex-col gap-3 border-b border-slate-100 px-5 py-4 md:flex-row md:items-center md:justify-between">
        <div>
          <h2 class="text-base font-bold text-slate-900">상품 상세</h2>
          <p class="mt-1 text-sm text-slate-500">
            상품 기본 정보와 이미지를 확인하고 옵션/SKU를 관리하세요.
          </p>
        </div>

        <!-- 우측 액션들 -->
        <div class="flex flex-wrap items-center gap-2">

          <a th:href="@{/mypage/supplier/product/{id}/edit(id=${product.productId})}"
             class="inline-flex items-center rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 hover:bg-slate-50">
            수정
          </a>

          <a th:href="@{/mypage/supplier/product}"
             class="inline-flex items-center rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 hover:bg-slate-50">
            목록
          </a>

          <span class="mx-1 hidden h-6 w-px bg-slate-200 md:inline-block"></span>

          <a th:href="@{/mypage/supplier/product/{id}/option(id=${product.productId})}"
             class="inline-flex items-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-bold text-white hover:bg-slate-800">
            옵션 관리
          </a>

          <a th:href="@{/mypage/supplier/product/{id}/sku(id=${product.productId})}"
             class="inline-flex items-center rounded-xl bg-blue-600 px-4 py-2 text-sm font-bold text-white hover:bg-blue-700">
            SKU 관리
          </a>
        </div>
      </header>

      <div class="px-5 py-6 space-y-8">

        <!-- 메타 정보 -->
        <section class="grid grid-cols-1 gap-4 md:grid-cols-3">
          <div class="rounded-2xl border border-slate-200 bg-white p-5">
            <div class="text-xs font-semibold text-slate-500">상품 ID</div>
            <div class="mt-2 text-lg font-extrabold text-slate-900" th:text="${product.productId}">1</div>
          </div>

          <div class="rounded-2xl border border-slate-200 bg-white p-5">
            <div class="text-xs font-semibold text-slate-500">카테고리 ID</div>
            <div class="mt-2 text-lg font-bold text-slate-900" th:text="${product.categoryId}">CAT-001</div>
          </div>

          <div class="rounded-2xl border border-slate-200 bg-white p-5">
            <div class="text-xs font-semibold text-slate-500">커스터마이즈</div>
            <div class="mt-2">
              <span class="inline-flex items-center rounded-full px-2 py-1 text-xs font-bold"
                    th:classappend="${product.isCustomizable == 1
                      ? ' bg-emerald-100 text-emerald-700'
                      : ' bg-slate-100 text-slate-700'}"
                    th:text="${product.isCustomizable == 1 ? '가능' : '불가'}">
                가능
              </span>
            </div>
          </div>
        </section>

        <!-- 이미지 섹션 -->
        <section class="rounded-2xl border border-slate-200 bg-white p-5">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-bold text-slate-900">이미지</h3>
            <span class="text-xs text-slate-500">대표/상세 이미지를 확인합니다.</span>
          </div>

          <div class="mt-4 grid grid-cols-1 gap-6 lg:grid-cols-2">

            <!-- 대표 이미지 -->
            <div>
              <p class="text-sm font-semibold text-slate-700">대표 이미지</p>

              <div class="mt-3 flex items-center justify-center rounded-2xl border border-slate-200 bg-slate-50 p-4">
                <img th:if="${thumbImagePath != null}"
                     th:src="${thumbImagePath}"
                     class="h-56 w-56 rounded-xl object-cover shadow-sm"
                     alt="대표 이미지"/>

                <div th:if="${thumbImagePath == null}" class="text-sm text-slate-500">
                  대표 이미지가 없습니다.
                </div>
              </div>
            </div>

            <!-- 상세 이미지 -->
            <div>
              <p class="text-sm font-semibold text-slate-700">상세 이미지</p>

              <div class="mt-3 rounded-2xl border border-slate-200 bg-white p-4">
                <div th:if="${#lists.isEmpty(detailImages)}"
                     class="text-sm text-slate-500">
                  상세 이미지가 없습니다.
                </div>

                <div th:if="${!#lists.isEmpty(detailImages)}"
                     class="grid grid-cols-2 gap-3 sm:grid-cols-3">
                  <img th:each="img : ${detailImages}"
                       th:src="${img.imagePath}"
                       class="h-28 w-full rounded-xl object-cover border border-slate-200"
                       alt="상세 이미지"/>
                </div>
              </div>
            </div>

          </div>
        </section>

        <!-- 기본 정보 -->
        <section class="rounded-2xl border border-slate-200 bg-white p-5">
          <h3 class="text-sm font-bold text-slate-900">기본 정보</h3>

          <dl class="mt-4 grid grid-cols-1 gap-4 md:grid-cols-2">
            <div>
              <dt class="text-xs font-semibold text-slate-500">상품명</dt>
              <dd class="mt-1 text-sm font-semibold text-slate-900"
                  th:text="${product.productName}">상품명</dd>
            </div>

            <div>
              <dt class="text-xs font-semibold text-slate-500">커스터마이즈</dt>
              <dd class="mt-1 text-sm text-slate-900"
                  th:text="${product.isCustomizable == 1 ? '가능' : '불가'}">가능</dd>
            </div>
          </dl>

          <div class="mt-6">
            <div class="text-xs font-semibold text-slate-500">설명</div>
            <pre class="mt-2 whitespace-pre-wrap rounded-2xl border border-slate-200 bg-slate-50 p-4 text-sm text-slate-800"
                 th:text="${product.description}">설명</pre>
          </div>
        </section>

      </div>
    </section>

  </th:block>
</th:block>
