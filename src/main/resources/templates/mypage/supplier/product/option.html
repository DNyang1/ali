<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${pageTitle}">옵션 관리</title>
    <link rel="stylesheet" href="/mypage/supplier/css/layout.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar" th:replace="mypage/supplier/partials/sidebar :: sidebar"></aside>
    <div class="main">
        <header class="topbar" th:replace="mypage/supplier/partials/topbar :: topbar"></header>

        <main class="content">
            <section class="panel">
                <header class="panel-head">
                    <h2 class="panel-title">옵션 관리</h2>
                    <a class="panel-link" th:href="@{/mypage/supplier/product/{id}(id=${productId})}">상품 상세</a>
                </header>

                <div class="panel-body">
                    <form th:action="@{/mypage/supplier/product/{id}/option(id=${productId})}"
                          method="post" th:object="${form}">
                        <input type="text" th:field="*{optionName}" placeholder="예: Color" required/>
                        <input type="text" th:field="*{optionValue}" placeholder="예: Red" required/>
                        <button type="submit">옵션 추가</button>
                    </form>

                    <hr/>

                    <table class="table">
                        <thead>
                        <tr>
                            <th>optionId</th>
                            <th>name</th>
                            <th>value</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(options)}">
                            <td colspan="3">옵션이 없습니다.</td>
                        </tr>
                        <tr th:each="o : ${options}">
                            <td th:text="${o.optionId}">id</td>
                            <td th:text="${o.optionName}">Color</td>
                            <td th:text="${o.optionValue}">Red</td>
                        </tr>
                        </tbody>
                    </table>

                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
