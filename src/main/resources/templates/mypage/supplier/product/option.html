<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="mypage/supplier/layout/base :: layout(~{::body}, ~{::head/link})">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle} ?: '옵션 관리'">옵션 관리</title>
    <link rel="stylesheet" href="/mypage/supplier/css/product.css">
</head>

<body>

<section class="panel">
    <header class="panel-head">
        <h2 class="panel-title">옵션 관리</h2>
        <a class="panel-link" th:href="@{/mypage/supplier/product/{id}(id=${productId})}">상품 상세</a>
    </header>

    <div class="panel-body">
        <p style="font-size:12px; opacity:.8; margin:0 0 12px;">
            * SKU가 등록되기 전까지만 옵션을 비활성화할 수 있습니다.
        </p>

        <table class="table">
            <thead>
            <tr>
                <th>optionId</th>
                <th>name</th>
                <th>value</th>
                <th>status</th>
                <th>토글</th>
            </tr>
            </thead>

            <tbody>
            <tr th:if="${#lists.isEmpty(options)}">
                <td colspan="5">옵션이 없습니다.</td>
            </tr>

            <tr th:each="o : ${options}">
                <td th:text="${o.optionId}">id</td>
                <td th:text="${o.optionName}">Color</td>
                <td th:text="${o.optionValue}">RED</td>

                <td>
                    <span class="status"
                          th:classappend="${o.status == 'ACTIVE'} ? ' ok' : ' off'"
                          th:text="${o.status}">
                        ACTIVE
                    </span>
                </td>

                <td>
                    <form th:action="@{/mypage/supplier/product/{pid}/option-values/{ovid}/toggle(pid=${productId}, ovid=${o.optionValueId})}"
                          method="post" class="inline-form">
                        <button type="submit"
                                th:classappend="${o.status == 'ACTIVE'} ? ' danger' : ' primary'"
                                th:text="${o.status == 'ACTIVE' ? '비활성화' : '활성화'}">
                            토글
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
<script th:if="${param.error != null}">
    alert('이미 SKU에 사용된 옵션은 비활성화할 수 없습니다.');
</script>
</body>
</html>
