<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="mypage/supplier/layout/base :: layout(~{::body}, ~{::head/link})">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle} ?: '옵션 관리'">옵션 관리</title>
    <link rel="stylesheet" href="/mypage/supplier/css/product.css">
</head>

<body>

<section class="panel">
    <header class="panel-head">
        <h2 class="panel-title">옵션 관리</h2>
        <a class="panel-link" th:href="@{/mypage/supplier/product/{id}(id=${productId})}">상품 상세</a>
    </header>

    <div class="panel-body">

        <p style="font-size:12px; opacity:.8; margin:0 0 12px;">
            * 옵션은 카테고리 기준으로 자동 생성되며, 여기서는 이름(표시)만 수정할 수 있습니다.
        </p>

        <table class="table">
            <thead>
            <tr>
                <th>optionId</th>
                <th>name</th>
                <th>value</th>
                <th>수정</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(options)}">
                <td colspan="4">옵션이 없습니다.</td>
            </tr>

            <tr th:each="o : ${options}">
                <td th:text="${o.optionId}">id</td>
                <td th:text="${o.optionName}">Color</td>
                <td>
                    <form th:action="@{/mypage/supplier/product/option/{optionId}/update(optionId=${o.optionId})}"
                          method="post" class="inline-form">
                        <input type="hidden" name="productId" th:value="${productId}">
                        <input type="text" name="optionValue"
                               th:value="${o.optionValue}" required style="width:220px;">

                </td>
                <td>
                    <button type="submit" class="primary">저장</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>


    </div>
</section>

</body>
</html>
