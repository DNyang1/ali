<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="mypage/supplier/layout/base :: layout(~{::content}, null)">

    <th:block th:fragment="content">

        <section class="rounded-2xl border border-slate-200 bg-white shadow-sm">

            <!-- 헤더 -->
            <header class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
                <div>
                    <h2 class="text-base font-bold text-slate-900">상품 목록</h2>
                    <p class="mt-1 text-sm text-slate-500">등록된 상품을 관리하고 상태를 변경할 수 있어요.</p>
                </div>

                <a href="/mypage/supplier/product/new"
                   class="inline-flex items-center rounded-xl bg-blue-600 px-4 py-2 text-sm font-bold text-white hover:bg-blue-700">
                    상품 등록
                </a>
            </header>

            <!-- 테이블 -->
            <div class="px-5 py-4">
                <div class="overflow-x-auto">
                    <table id="product-table" class="min-w-full text-sm">
                    <thead>
                        <tr class="text-left text-slate-500">
                            <th class="py-2 font-semibold">ID</th>
                            <th class="py-2 font-semibold">상품명</th>
                            <th class="py-2 font-semibold">커스터마이즈</th>
                            <th class="py-2 font-semibold">상태</th>
                            <th class="py-2 font-semibold text-right">액션</th>
                        </tr>
                        </thead>

                        <tbody class="divide-y divide-slate-100">

                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="5" class="py-6 text-center text-slate-500">
                                등록된 상품이 없습니다.
                            </td>
                        </tr>

                        <tr th:each="p : ${products}" class="hover:bg-slate-50">
                            <!-- ID -->
                            <td class="py-3 text-slate-800" th:text="${p != null ? p.productId : '-'}">1</td>

                            <!-- 상품명 -->
                            <td class="py-3">
                                <a th:if="${p != null}"
                                   th:href="@{/mypage/supplier/product/{id}(id=${p.productId})}"
                                   th:text="${p.productName}"
                                   class="font-semibold text-slate-900 hover:underline">
                                    상품명
                                </a>
                                <span th:if="${p == null}" class="text-slate-400">-</span>
                            </td>

                            <!-- 커스터마이즈 -->
                            <td class="py-3 text-slate-800"
                                th:text="${p != null ? (p.isCustomizable == 1 ? '가능' : '불가') : '-'}">
                                가능
                            </td>

                            <!-- 상태 -->
                            <td class="py-3">
                <span class="inline-flex items-center rounded-full px-2 py-1 text-xs font-bold"
                      th:classappend="${p.status == 'ACTIVE'
                        ? ' bg-emerald-100 text-emerald-700'
                        : ' bg-slate-100 text-slate-700'}">
                  <span th:text="${p.status}">ACTIVE</span>
                </span>
                            </td>

                            <!-- 액션 -->
                            <td class="py-3 text-right">
                                <form th:if="${p != null}"
                                      th:action="@{/mypage/supplier/product/{id}/toggle(id=${p.productId})}"
                                      method="post"
                                      class="inline">

                                    <button type="submit"
                                            class="inline-flex items-center rounded-xl px-3 py-2 text-xs font-bold text-white"
                                            th:classappend="${p.status == 'ACTIVE'
                            ? ' bg-rose-600 hover:bg-rose-700'
                            : ' bg-slate-900 hover:bg-slate-800'}"
                                            th:text="${p.status == 'ACTIVE' ? '비활성화' : '활성화'}">
                                        비활성화
                                    </button>

                                </form>
                            </td>
                        </tr>

                        </tbody>
                    </table>
                </div>
            </div>
            <div id="product-pager" class="mt-6 flex justify-center"></div>
        </section>
        <script>
            (function () {
                const PAGE_SIZE = 10;

                const table = document.getElementById('product-table');
                const pagerHost = document.getElementById('product-pager');

                // ✅ 여기서 return 해도 안전 (IIFE 안이라서)
                if (!table || !pagerHost) {
                    console.log('[pager] not found', { table, pagerHost });
                    return;
                }

                const tbody = table.querySelector('tbody');
                if (!tbody) {
                    console.log('[pager] tbody not found');
                    return;
                }

                // ✅ tbody 안의 모든 tr 중에서, colspan(= "등록된 상품이 없습니다" 같은 빈 row) 제외
                const allRows = Array.from(tbody.querySelectorAll('tr'));
                const rows = allRows.filter(tr => !tr.querySelector('td[colspan]'));

                console.log('[pager] rows=', rows.length);

                // 데이터가 없으면 페이저 숨김
                if (rows.length === 0) {
                    pagerHost.innerHTML = '';
                    return;
                }

                const qs = new URLSearchParams(location.search);
                const page = Math.max(1, parseInt(qs.get('page') || '1', 10) || 1);
                const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
                const safePage = Math.min(page, totalPages);

                renderPage(safePage);
                renderPager(safePage, totalPages);

                function renderPage(p) {
                    const start = (p - 1) * PAGE_SIZE;
                    const end = start + PAGE_SIZE;

                    rows.forEach((tr, idx) => {
                        tr.style.display = (idx >= start && idx < end) ? '' : 'none';
                    });
                }

                function renderPager(p, total) {
                    pagerHost.innerHTML = '';
                    if (total <= 1) return;

                    const wrap = document.createElement('div');
                    wrap.className = 'flex flex-wrap items-center justify-center gap-2';

                    const makeHref = (nextPage) => {
                        const next = new URLSearchParams(location.search);
                        next.set('page', String(nextPage));
                        return `${location.pathname}?${next.toString()}`;
                    };

                    if (p > 1) wrap.appendChild(pageBtn('이전', makeHref(p - 1), false));

                    const windowSize = 7;
                    let start = Math.max(1, p - Math.floor(windowSize / 2));
                    let end = Math.min(total, start + windowSize - 1);
                    start = Math.max(1, end - windowSize + 1);

                    if (start > 1) {
                        wrap.appendChild(pageBtn('1', makeHref(1), p === 1));
                        if (start > 2) wrap.appendChild(dots());
                    }

                    for (let i = start; i <= end; i++) {
                        wrap.appendChild(pageBtn(String(i), makeHref(i), i === p));
                    }

                    if (end < total) {
                        if (end < total - 1) wrap.appendChild(dots());
                        wrap.appendChild(pageBtn(String(total), makeHref(total), p === total));
                    }

                    if (p < total) wrap.appendChild(pageBtn('다음', makeHref(p + 1), false));

                    pagerHost.appendChild(wrap);
                }

                function pageBtn(text, href, active) {
                    const a = document.createElement('a');
                    a.href = href;
                    a.textContent = text;

                    a.className =
                        'rounded-lg border border-slate-200 bg-blue px-3 py-1.5 text-sm font-semibold hover:bg-slate-50 ' +
                        (active ? 'border-blue-600 bg-blue-600 hover:bg-blue-600' : '');

                    a.style.setProperty('color', active ? '#ffffff' : '#334155', 'important'); // slate-700
                    return a;
                }

                function dots() {
                    const s = document.createElement('span');
                    s.textContent = '...';
                    s.className = 'px-2 text-sm';
                    s.style.setProperty('color', '#94a3b8', 'important'); // slate-400
                    return s;
                }


            })();
        </script>



    </th:block>
</th:block>
