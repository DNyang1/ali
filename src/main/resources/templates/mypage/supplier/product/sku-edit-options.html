<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="mypage/supplier/layout/base :: layout(~{::content}, null)">

    <th:block th:fragment="content">

        <!-- Header -->
        <section class="mb-6">
            <div class="flex items-start justify-between gap-3">
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">SKU 옵션 수정</h1>
                    <p class="mt-1 text-sm text-slate-500">
                        SKU에 연결된 옵션 조합을 변경합니다. (주문된 SKU는 수정 제한일 수 있어요)
                    </p>
                </div>

                <a class="inline-flex items-center rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-bold text-slate-700 hover:bg-slate-50"
                   th:href="@{/mypage/supplier/product/{id}/sku(id=${productId})}">
                    SKU 목록
                </a>
            </div>
        </section>

        <!-- Card -->
        <section class="rounded-2xl border border-slate-200 bg-white shadow-sm">
            <header class="border-b border-slate-100 px-5 py-4">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="text-sm text-slate-700">
                        <span class="font-bold text-slate-900">SKU</span>
                        <span class="mx-2 text-slate-300">·</span>
                        <span class="font-semibold text-slate-700" th:text="${skuId}">sku</span>
                    </div>
                </div>
            </header>

            <div class="px-5 py-5">

                <form th:action="@{/mypage/supplier/product/{pid}/sku/{sid}/edit-options(pid=${productId}, sid=${skuId})}"
                      method="post"
                      class="space-y-5">

                    <!-- No options -->
                    <div th:if="${#lists.isEmpty(options)}"
                         class="rounded-xl border border-slate-200 bg-slate-50 p-4 text-sm text-slate-600">
                        이 상품에 등록된 옵션이 없습니다. 먼저 옵션을 등록하세요.
                    </div>

                    <!-- Option groups -->
                    <div th:if="${!#maps.isEmpty(optionGroups)}"
                         class="grid grid-cols-1 gap-4 lg:grid-cols-2">

                        <section th:each="entry : ${optionGroups}"
                                 class="rounded-2xl border border-slate-200 bg-white p-4">
                            <div class="mb-3 flex items-center justify-between">
                                <h2 class="text-sm font-extrabold text-slate-900" th:text="${entry.key}">옵션명</h2>
                                <span class="text-xs text-slate-500">하나 선택</span>
                            </div>

                            <div class="flex flex-wrap gap-2">
                                <label th:each="o : ${entry.value}"
                                       class="group inline-flex cursor-pointer items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-700 hover:bg-slate-50">
                                    <input type="radio"
                                           class="h-4 w-4 accent-blue-600"
                                           th:name="'selected[' + ${entry.key} + ']'"
                                           th:value="${o.optionValueId}"
                                           th:checked="${selectedMap != null and selectedMap[entry.key] == o.optionValueId}"
                                           required />
                                    <span class="font-semibold text-slate-800" th:text="${o.optionValue}">Red</span>
                                </label>
                            </div>
                        </section>

                    </div>

                    <!-- Actions -->
                    <div class="flex items-center justify-end gap-2 pt-2">
                        <a class="inline-flex items-center rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 hover:bg-slate-50"
                           th:href="@{/mypage/supplier/product/{id}/sku(id=${productId})}">
                            취소
                        </a>

                        <button type="submit"
                                class="inline-flex items-center rounded-xl bg-blue-600 px-4 py-2 text-sm font-extrabold text-white hover:bg-blue-700">
                            저장
                        </button>
                    </div>

                </form>
            </div>
        </section>

        <!-- (선택) alert 처리 -->
        <script th:if="${param.error != null}">
            alert('이미 동일한 옵션 조합 SKU가 존재합니다.');
        </script>

    </th:block>
</th:block>
