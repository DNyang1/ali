<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${pageTitle}">SKU 관리</title>
  <link rel="stylesheet" href="/mypage/supplier/css/layout.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" th:replace="mypage/supplier/partials/sidebar :: sidebar"></aside>
  <div class="main">
    <header class="topbar" th:replace="mypage/supplier/partials/topbar :: topbar"></header>

    <main class="content">
      <section class="panel">
        <header class="panel-head">
          <h2 class="panel-title">SKU 관리</h2>
          <a class="panel-link" th:href="@{/mypage/supplier/product/{id}(id=${productId})}">상품 상세</a>
        </header>

        <div class="panel-body">
          <div th:if="${param.error != null}">
            <p th:if="${param.error[0] == 'sold'}">이미 주문된 SKU는 옵션을 수정할 수 없습니다.</p>
          </div>

          <div th:if="${param.updated != null}">
            <p>옵션이 저장되었습니다.</p>
          </div>


          <form th:action="@{/mypage/supplier/product/{id}/sku(id=${productId})}"
                method="post" th:object="${skuForm}">
            <div>
              <label>재고</label>
              <input type="number" th:field="*{stockQuantity}" min="0"/>
            </div>
            <div>
              <label>가격</label>
              <input type="number" step="0.01" th:field="*{priceAtSku}"/>
            </div>

            <div style="margin-top:10px;">
              <label>연결할 옵션(체크)</label><br/>
              <div th:if="${#lists.isEmpty(options)}">옵션을 먼저 등록하세요.</div>
              <label th:each="o : ${options}" style="display:inline-block; margin-right:10px;">
                <input type="checkbox" name="optionIds" th:value="${o.optionId}"/>
                <span th:text="${o.optionName + ':' + o.optionValue}">Color:Red</span>
              </label>
            </div>

            <div style="margin-top:10px;">
              <button type="submit">SKU 추가</button>
            </div>
          </form>

          <hr/>

          <table class="table">
            <thead>
            <tr>
              <th>skuId</th>
              <th>옵션 조합</th>
              <th>재고</th>
              <th>가격</th>
              <th>생성일</th>
              <th>액션</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(skus)}">
              <td colspan="6">SKU가 없습니다. (옵션과 연결된 SKU만 목록에 나타납니다)</td>
            </tr>
            <tr th:each="s : ${skus}">
              <td title="전체 skuId" th:text="${#strings.substring(s.skuId,0,8)} + '...'"></td>
              <td th:text="${s.optionSummary}">사이즈:95, 색상:빨강</td>
              <td th:text="${s.stockQuantity}">0</td>
              <td th:text="${s.priceAtSku}">0</td>
              <td th:text="${s.createdAt}">2025-12-28</td>
              <td>
                <a th:if="${s.editable}"
                   th:href="@{/mypage/supplier/product/{pid}/sku/{sid}/edit-options(pid=${productId}, sid=${s.skuId})}">
                  옵션 수정
                </a>
                <span th:if="${!s.editable}">수정 불가(주문됨)</span>
              </td>

            </tr>
            </tbody>
          </table>

        </div>
      </section>
    </main>
  </div>
</div>
</body>
</html>
