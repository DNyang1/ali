<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="mypage/supplier/layout/base :: layout(~{::content}, null)">

  <th:block th:fragment="content">

    <section class="rounded-2xl border border-slate-200 bg-white shadow-sm">

      <!-- 헤더 -->
      <header class="flex flex-col gap-3 border-b border-slate-100 px-5 py-4 md:flex-row md:items-center md:justify-between">
        <div>
          <h2 class="text-base font-bold text-slate-900">SKU 관리</h2>
          <p class="mt-1 text-sm text-slate-500">재고/MOQ/단가 및 옵션 조합 SKU를 관리합니다.</p>
        </div>

        <a th:href="@{/mypage/supplier/product/{id}(id=${productId})}"
           class="inline-flex items-center rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 hover:bg-slate-50">
          상품 상세
        </a>
      </header>

      <div class="px-5 py-6 space-y-6">

        <!-- 메시지 영역 -->
        <div th:if="${param.error != null}" class="rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700">
          <p th:if="${param.error[0] == 'sold'}" class="font-semibold">
            이미 주문된 SKU는 옵션을 수정할 수 없습니다.
          </p>
        </div>

        <div th:if="${param.updated != null}" class="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700">
          옵션이 저장되었습니다.
        </div>

        <!-- SKU 추가 폼 -->
        <section class="rounded-2xl border border-slate-200 bg-white p-5">
          <h3 class="text-sm font-bold text-slate-900">SKU 추가</h3>

          <form th:action="@{/mypage/supplier/product/{id}/sku(id=${productId})}"
                method="post"
                th:object="${skuForm}"
                class="mt-4 space-y-5">

            <!-- 기본 입력 -->
            <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
              <div>
                <label class="block text-sm font-bold text-slate-900">재고</label>
                <input type="number" min="0" th:field="*{stock}"
                       class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-blue-500"/>
              </div>

              <div>
                <label class="block text-sm font-bold text-slate-900">MOQ</label>
                <input type="number" min="1" step="1" th:field="*{moq}"
                       class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-blue-500"/>
              </div>

              <div>
                <label class="block text-sm font-bold text-slate-900">기본 단가(디폴트)</label>
                <input type="number" min="0" step="1" th:field="*{basePrice}"
                       class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-blue-500"/>
              </div>
            </div>

            <!-- 구간별 단가 -->
            <div>
              <label class="block text-sm font-bold text-slate-900">구간별 단가</label>

              <!-- ✅ JS hook 유지 -->
              <div id="rangeWrap" class="mt-3 space-y-2"></div>

              <button type="button"
                      class="mt-3 inline-flex items-center rounded-xl border border-slate-200 bg-white px-4 py-2 text-xs font-bold text-slate-700 hover:bg-slate-50"
                      onclick="addRangeRow()">
                + 구간 추가
              </button>

              <p class="mt-2 text-xs text-slate-500">
                * 기본 단가는 항상 저장되고, 구간가는 필요할 때만 추가하세요.
              </p>
            </div>

            <!-- 옵션 선택 -->
            <div>
              <!-- ✅ JS hook 유지: optToggleBar/Btn -->
              <div class="flex items-center justify-between rounded-xl border border-slate-200 bg-slate-50 px-4 py-3"
                   id="optToggleBar">
                <span class="text-sm font-bold text-slate-900">연결할 옵션 (선택)</span>
                <button type="button"
                        class="inline-flex items-center rounded-xl bg-slate-900 px-4 py-2 text-xs font-bold text-white hover:bg-slate-800"
                        id="optToggleBtn">
                  옵션 펼치기
                </button>
              </div>

              <div th:if="${#lists.isEmpty(options)}"
                   class="mt-3 rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-600">
                옵션을 먼저 등록하세요.
              </div>

              <!-- ✅ JS hook 유지: optSection -->
              <div id="optSection" class="mt-3 hidden">
                <div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3">
                  <div class="rounded-2xl border border-slate-200 bg-white p-4"
                       th:each="group : ${optionGroups}">
                    <div class="text-sm font-bold text-slate-900" th:text="${group.key}">색상</div>

                    <div class="mt-3 flex flex-wrap gap-2">
                      <label th:each="o : ${group.value}"
                             class="inline-flex cursor-pointer items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-800 hover:bg-slate-50">
                        <input type="radio"
                               class="h-4 w-4"
                               th:name="'selected[' + ${group.key} + ']'"
                               th:value="${o.optionValueId}"
                               required>
                        <span th:text="${o.optionValue}"></span>
                      </label>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- 제출 -->
            <div class="pt-2">
              <button type="submit"
                      class="inline-flex items-center rounded-xl bg-blue-600 px-5 py-2 text-sm font-bold text-white hover:bg-blue-700">
                SKU 추가
              </button>
            </div>

          </form>
        </section>

        <div class="h-px w-full bg-slate-100"></div>

        <!-- SKU 목록 -->
        <section class="space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-bold text-slate-900">SKU 목록</h3>
            <p class="text-xs text-slate-500">재고 저장/옵션 수정</p>
          </div>

          <div class="overflow-x-auto rounded-2xl border border-slate-200">
            <table class="min-w-full text-sm bg-white">
              <thead>
              <tr class="text-left text-slate-500">
                <th class="px-4 py-3 font-semibold">skuId</th>
                <th class="px-4 py-3 font-semibold">옵션 조합</th>
                <th class="px-4 py-3 font-semibold">재고</th>
                <th class="px-4 py-3 font-semibold">MOQ</th>
                <th class="px-4 py-3 font-semibold">기본단가</th>
                <th class="px-4 py-3 font-semibold">생성일</th>
                <th class="px-4 py-3 font-semibold">구간단가</th>
                <th class="px-4 py-3 font-semibold">상태</th>
                <th class="px-4 py-3 font-semibold">옵션</th>
              </tr>
              </thead>

              <tbody class="divide-y divide-slate-100">
              <tr th:if="${#lists.isEmpty(skus)}">
                <td colspan="9" class="px-4 py-5 text-slate-500">SKU가 없습니다.</td>
              </tr>

              <tr th:each="s : ${skus}" class="align-middle">
                <td class="px-4 py-3 text-slate-900 font-medium"
                    title="전체 skuId"
                    th:text="${#strings.length(s.skuId) > 12 ? (#strings.substring(s.skuId,0,12) + '...') : s.skuId}">
                </td>

                <td class="px-4 py-3 text-slate-800"
                    th:text="${#strings.isEmpty(s.optionSummary) ? '-' : s.optionSummary}">
                </td>

                <!-- 재고 수정 -->
                <td class="px-4 py-3">
                  <form th:action="@{/mypage/supplier/sku/{skuId}/stock(skuId=${s.skuId})}"
                        method="post"
                        class="flex items-center gap-2">
                    <input type="hidden" name="productId" th:value="${productId}">
                    <input type="number" name="stock" min="0" step="1"
                           th:value="${s.stockQuantity}"
                           class="w-28 rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-blue-500">
                    <button type="submit"
                            class="inline-flex items-center rounded-xl bg-blue-600 px-3 py-2 text-xs font-bold text-white hover:bg-blue-700">
                      저장
                    </button>
                  </form>
                </td>

                <td class="px-4 py-3 text-slate-800" th:text="${s.moq}">1</td>
                <td class="px-4 py-3 text-slate-800" th:text="${s.basePrice}">0</td>
                <td class="px-4 py-3 text-slate-600" th:text="${s.createdAt}">2025-12-28</td>

                <!-- 구간단가 보기 -->
                <td class="px-4 py-3">
                  <!-- ✅ class tier-btn 유지 + data-* 유지 -->
                  <button type="button"
                          class="tier-btn inline-flex items-center rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-bold text-slate-700 hover:bg-slate-50"
                          th:attr="data-sku-id=${s.skuId}, data-moq=${s.moq}">
                    구간단가 보기
                  </button>
                </td>

                <!-- 상태 표시 (ACTIVE/INACTIVE만) -->
                <td class="px-4 py-3">
                  <span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs font-bold
                               bg-slate-100 text-slate-700 ring-1 ring-slate-200"
                        th:classappend="${s.status == 'ACTIVE'} ? ' bg-emerald-50 text-emerald-700 ring-emerald-200'
                          : (${s.status == 'INACTIVE'} ? ' bg-slate-200 text-slate-800 ring-slate-200' : '')"
                        th:text="${s.status == 'ACTIVE' ? '판매중'
                           : (s.status == 'INACTIVE' ? '판매중지' : s.status)}">
                  </span>
                </td>

                <!-- 옵션 수정 -->
                <td class="px-4 py-3">
                  <a th:if="${s.editable}"
                     th:href="@{/mypage/supplier/product/{pid}/sku/{sid}/edit-options(pid=${productId}, sid=${s.skuId})}"
                     class="text-sm font-bold text-blue-600 hover:underline">
                    옵션 수정
                  </a>
                  <span th:if="${!s.editable}" class="text-sm text-slate-500">
                    수정 불가(주문됨)
                  </span>
                </td>

              </tr>
              </tbody>
            </table>
          </div>
        </section>

      </div>
    </section>

    <!-- ✅ 기존 JS 유지 -->
    <script src="/mypage/supplier/js/sku.js"></script>

  </th:block>
</th:block>
