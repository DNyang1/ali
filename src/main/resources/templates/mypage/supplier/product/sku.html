<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="mypage/supplier/layout/base :: layout(~{::body}, ~{::head/link})">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${pageTitle} ?: 'SKU 관리'">SKU 관리</title>
  <link rel="stylesheet" href="/mypage/supplier/css/product.css">
</head>

<body>

<section class="panel">
  <header class="panel-head">
    <h2 class="panel-title">SKU 관리</h2>
    <a class="panel-link"
       th:href="@{/mypage/supplier/product/{id}(id=${productId})}">
      상품 상세
    </a>
  </header>

  <div class="panel-body">

    <div th:if="${param.error != null}">
      <p th:if="${param.error[0] == 'sold'}">
        이미 주문된 SKU는 옵션을 수정할 수 없습니다.
      </p>
    </div>

    <div th:if="${param.updated != null}">
      <p>옵션이 저장되었습니다.</p>
    </div>

    <form th:action="@{/mypage/supplier/product/{id}/sku(id=${productId})}"
          method="post" th:object="${skuForm}">

      <div style="display:flex; gap:30px; flex-wrap:wrap;">
        <div>
          <label>재고</label>
          <input type="number" min="0" th:field="*{stock}" />
        </div>

        <div>
          <label>MOQ</label>
          <input type="number" min="1" step="1" th:field="*{moq}" />
        </div>

        <div>
          <label>기본 단가(디폴트)</label>
          <input type="number" min="0" step="1" th:field="*{basePrice}" />
        </div>
      </div>

      <div style="margin-top:12px;">
        <label>구간별 단가</label>

        <div id="rangeWrap" style="margin-top:8px;"></div>
        <button type="button" style="margin-top:6px;" onclick="addRangeRow()">+ 구간 추가</button>

        <p style="margin-top:6px; font-size:12px; opacity:.8;">
          * 기본 단가는 항상 저장되고, 구간가는 필요할 때만 추가하세요.
        </p>
      </div>

      <div style="margin-top:12px;">
        <div class="opt-toggle-bar" id="optToggleBar">
          <label style="margin:0;">연결할 옵션 (선택)</label>
          <button type="button" class="opt-toggle-btn" id="optToggleBtn">옵션 펼치기</button>
        </div>

        <div th:if="${#lists.isEmpty(options)}">
          옵션을 먼저 등록하세요.
        </div>

        <div id="optSection" class="opt-section is-collapsed">
          <div class="sku-options-group">
            <div class="opt-group" th:each="group : ${optionGroups}">
              <div class="opt-title" th:text="${group.key}">색상</div>

              <div class="opt-items">
                <label th:each="o : ${group.value}">
                  <input type="radio"
                         th:name="'selected[' + ${group.key} + ']'"
                         th:value="${o.optionValueId}"
                         required>
                  <span th:text="${o.optionValue}"></span>
                </label>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div style="margin-top:12px;">
        <button type="submit">SKU 추가</button>
      </div>
    </form>

    <hr/>

    <table class="table tier-table">
      <thead>
      <tr>
        <th>skuId</th>
        <th>옵션 조합</th>
        <th>재고</th>
        <th>MOQ</th>
        <th>기본단가</th>
        <th>생성일</th>
        <th>구간단가</th>
        <th>상태</th>
        <th>상태 변경</th>
        <th>옵션</th>
      </tr>
      </thead>

      <tbody>
      <tr th:if="${#lists.isEmpty(skus)}">
        <td colspan="10">SKU가 없습니다.</td>
      </tr>

      <tr th:each="s : ${skus}">
        <td title="전체 skuId"
            th:text="${#strings.length(s.skuId) > 12 ? (#strings.substring(s.skuId,0,12) + '...') : s.skuId}">
        </td>

        <td th:text="${#strings.isEmpty(s.optionSummary) ? '-' : s.optionSummary}"></td>
        <td>
          <form th:action="@{/mypage/supplier/sku/{skuId}/stock(skuId=${s.skuId})}"
                method="post"
                class="inline-form">
            <input type="hidden" name="productId" th:value="${productId}">
            <input type="number" name="stock" min="0" step="1"
                   th:value="${s.stockQuantity}"
                   style="width:100px;">
            <button type="submit" class="primary">저장</button>
          </form>
        </td>
        <td th:text="${s.moq}">1</td>
        <td th:text="${s.basePrice}">0</td>
        <td th:text="${s.createdAt}">2025-12-28</td>

        <td>
          <button type="button"
                  class="tier-btn"
                  th:attr="data-sku-id=${s.skuId}, data-moq=${s.moq}">
            구간단가 보기
          </button>
        </td>

        <td>
    <span class="status-badge"
          th:classappend="${s.displayStatus}"
          th:text="${s.displayStatus == 'ACTIVE' ? '판매중'
             : (s.displayStatus == 'INACTIVE' ? '판매중지'
             : (s.displayStatus == 'ENDED' ? '판매종료'
             : (s.displayStatus == 'SOLD_OUT' ? '재고없음' : s.displayStatus)))}">
</span>
        </td>

        <td>
          <form th:action="@{/mypage/supplier/sku/{skuId}/status(skuId=${s.skuId})}"
                method="post" class="inline-form">
            <input type="hidden" name="productId" th:value="${productId}">

            <select name="status" th:disabled="${s.displayStatus == 'SOLD_OUT'}">
            <option value="ACTIVE" th:selected="${s.status == 'ACTIVE'}">판매중</option>
              <option value="INACTIVE" th:selected="${s.status == 'INACTIVE'}">판매중지</option>
              <option value="ENDED" th:selected="${s.status == 'ENDED'}">판매종료</option>
            </select>

            <button type="submit" class="primary">저장</button>
          </form>

          <small th:if="${s.displayStatus == 'SOLD_OUT'}" class="hint">
            재고가 0이라 ‘재고없음’으로 표시됩니다. 재고를 올린 뒤 판매중으로 변경하세요.
          </small>
        </td>

        <td>
          <a th:if="${s.editable}"
             th:href="@{/mypage/supplier/product/{pid}/sku/{sid}/edit-options(pid=${productId}, sid=${s.skuId})}">
            옵션 수정
          </a>
          <span th:if="${!s.editable}">
      수정 불가(주문됨)
    </span>
        </td>
      </tr>

      </tbody>
    </table>



  </div>
</section>
<script src="/mypage/supplier/js/sku.js"></script>

</body>
</html>
