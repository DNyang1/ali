
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="mypage/supplier/layout/base :: layout(~{::body}, ~{::head/link})">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle} ?: '상품 수정'">상품 수정</title>
    <link rel="stylesheet" href="/mypage/supplier/css/product.css">

    

</head>
<body>

<section class="panel">
    <header class="panel-head">
        <h2 class="panel-title">상품 수정</h2>
        <a class="panel-link" th:href="@{/mypage/supplier/product/{id}(id=${form.productId})}">상세</a>
    </header>

    <div class="panel-body">
        <form th:action="@{/mypage/supplier/product/{id}/edit(id=${form.productId})}"
              method="post" th:object="${form}">

            <label>카테고리</label>

            <select id="cat1">
                <option value="">대분류 선택</option>
                <option th:each="c : ${rootCategories}"
                        th:value="${c.categoryId}"
                        th:text="${c.categoryName}"
                        th:selected="${cat1Selected != null and c.categoryId == cat1Selected}">
                </option>
            </select>

            <select id="cat2" th:disabled="${cat2Options == null}">
                <option value="">중분류 선택</option>
                <option th:if="${cat2Options != null}"
                        th:each="c : ${cat2Options}"
                        th:value="${c.categoryId}"
                        th:text="${c.categoryName}"
                        th:selected="${cat2Selected != null and c.categoryId == cat2Selected}">
                </option>
            </select>

            <select id="cat3" th:disabled="${cat3Options == null}">
                <option value="">소분류 선택</option>
                <option th:if="${cat3Options != null}"
                        th:each="c : ${cat3Options}"
                        th:value="${c.categoryId}"
                        th:text="${c.categoryName}"
                        th:selected="${cat3Selected != null and c.categoryId == cat3Selected}">
                </option>
            </select>
            <input type="hidden" th:field="*{categoryId}" id="categoryId"/>

            <hr style="margin:16px 0;">

            <div class="image-section">
                <h3>이미지 관리</h3>

                <div style="margin-bottom:16px;">
                    <p><b>대표 이미지</b></p>
                    <img id="thumbPreview"
                         th:src="${thumbImagePath ?: ''}"
                         th:style="${thumbImagePath != null} ? 'display:block; width:180px; height:180px; object-fit:cover; border:1px solid #ddd; border-radius:8px;' : 'display:none;'"
                         style="display:none; width:180px; height:180px; object-fit:cover; border:1px solid #ddd; border-radius:8px;">
                    <input type="file" id="thumbFile" accept="image/*" onchange="previewThumb(this)">
                    <button type="button" class="primary"
                            th:attr="onclick=|uploadThumb(${form.productId})|">대표 저장</button>
                </div>

                <div>
                    <p><b>상세 이미지</b></p>
                    <input type="file" id="detailFile" accept="image/*" multiple onchange="onSelectDetailFiles(this)">
                    <button type="button" class="primary"
                            th:attr="onclick=|uploadDetails(${form.productId})|">상세 추가</button>

                    <div id="detailServerImages" style="display:flex; gap:10px; flex-wrap:wrap;">
                        <div th:each="img : ${detailImages}" style="display:flex; flex-direction:column; align-items:center; gap:6px;">
                            <img th:src="${img.imagePath}"
                                 style="width:120px; height:120px; object-fit:cover; border:1px solid #ddd; border-radius:8px;">
                            <button type="button" class="danger"
                                    th:attr="onclick=|deleteDetailImage(${img.imageId})|">삭제</button>
                        </div>
                    </div>

                    <div id="detailPreview" style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;"></div>

                </div>
            </div>

            <label>상품명</label>
            <input type="text" th:field="*{productName}" required/><br/><br/>

            <label>설명</label>
            <textarea th:field="*{description}" rows="5"></textarea><br/><br/>


            <label>커스터마이즈</label>
            <select th:field="*{isCustomizable}">
                <option value="0">불가</option>
                <option value="1">가능</option>
            </select><br/><br/>

            <button type="submit">저장</button>
        </form>
    </div>
</section>

<script src="/mypage/supplier/js/category-select.js"></script>
<script src="/mypage/supplier/js/product_images.js"></script>
</body>
</html>
