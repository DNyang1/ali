<header th:fragment="header" class="topbar">
    <div class="topbar-left">
        <a th:href="@{/mypage/user/dashboard}" class="brand">ALI</a>
        <span class="page-title" th:text="${pageTitle} ?: '마이페이지'">마이페이지</span>
    </div>

    <div class="topbar-right">
        <a th:href="@{/mypage/user/cart}" class="pill">
            장바구니 <span th:text="${cartCount} ?: 0">0</span>
        </a>

        <a th:href="@{/mypage/user/chat}" class="pill">
            안읽은 메시지 <span th:text="${unreadChatCount} ?: 0">0</span>
        </a>

        <a th:href="@{/mypage/user/notification}" class="pill">
            알림 <span th:text="${notificationCount} ?: 0">0</span>
        </a>

        <div class="userbox">
            <span class="username" th:text="${loginUser?.name} ?: '사용자'">사용자</span>
            <a th:href="@{/logout}" class="logout">로그아웃</a>
        </div>
    </div>
</header>
