<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="mypage/user/layout/base :: layout(~{::content}, null)">

  <th:block th:fragment="content">

    <section class="space-y-6">

      <!-- Page Header -->
      <section class="mb-6">
        <h1 class="text-2xl font-bold text-slate-900">대시보드</h1>
        <p class="mt-1 text-sm text-slate-500">
          주문·문의·찜·내 정보를 한눈에 확인하고 빠르게 처리하세요.
        </p>
      </section>

      <!-- Profile Card -->
      <section class="rounded-2xl border border-slate-200 bg-white shadow-sm">
        <div class="flex flex-col gap-4 px-5 py-4 sm:flex-row sm:items-center sm:justify-between">

          <!-- Left -->
          <div class="flex min-w-0 items-center gap-4">

            <!-- Profile Image -->
            <!-- 일단 default 이미지로 무조건 표시 -->
            <img th:src="${(session.loginUser != null and session.loginUser.profileImg != null)
              ? session.loginUser.profileImg
              : '/images/default.png'}"
                 alt="profile"
                 class="h-28 w-28 rounded-xl object-cover border border-slate-200 shadow-sm">



            <div class="min-w-0">
              <!-- Name / Email -->
              <div class="flex items-center gap-2">
                <div class="truncate text-base font-bold text-slate-900"
                     th:text="${session.loginUser != null ? session.loginUser.name : ''}"></div>
                <span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-bold text-slate-600">USER</span>
              </div>

              <!-- compact info row -->
              <dl class="mt-3 space-y-3 text-sm">

                <!-- 아이디 -->
                <div class="flex flex-col gap-0.5">
                  <dt class="text-xs text-slate-400">아이디</dt>
                  <dd  class="font-semibold text-slate-800"
                      th:text="${session.loginUser != null ? session.loginUser.userId : ''}">
                  </dd>
                </div>

                <!-- 이메일 -->
                <div class="flex flex-col gap-0.5">
                  <dt class="text-xs text-slate-400">이메일</dt>
                  <dd class="break-words font-semibold text-slate-700"
                      th:text="${session.loginUser != null ? session.loginUser.email : ''}">
                  </dd>
                </div>

              </dl>

            </div>
          </div>

          <!-- Right -->
          <div class="flex w-full flex-col gap-2 sm:w-auto sm:flex-row sm:items-center sm:justify-end">
              <a th:href="@{/user/update}"
                 class="inline-flex w-full items-center justify-center rounded-xl bg-gradient-to-r from-brand-500 to-accent-500 px-4 py-2 text-sm font-bold text-white hover:from-brand-600 hover:to-accent-600 sm:w-auto">
                회원정보 수정
              </a>

            <a th:href="@{/user/update_password}"
               class="inline-flex w-full items-center justify-center rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 hover:bg-slate-50 sm:w-auto">
              비밀번호 변경
            </a>
          </div>

        </div>
      </section>



      <!-- Action Needed -->
      <section class="rounded-2xl border border-slate-200 bg-white shadow-sm">
        <header class="border-b border-slate-100 px-5 py-4">
          <h3 class="text-base font-bold text-slate-900">처리 필요</h3>
        </header>

        <div class="px-5 py-4">
          <ul class="divide-y divide-slate-100 text-sm">

            <li class="grid grid-cols-[1fr_auto_auto] items-center gap-6 py-3">
              <span class="font-semibold text-slate-700">배송 준비중</span>

              <span class="min-w-[56px] text-center rounded-full bg-slate-100 px-3 py-1 text-xs font-bold text-slate-700"
                    th:text="${summary != null ? summary.readyShippingCount : 0}">0</span>

              <a th:href="@{/mypage/user/order(shipStatus='READY')}"
                 class="inline-flex items-center justify-center h-8 min-w-[64px] px-4 rounded-xl border border-slate-200 bg-white
              text-sm font-bold text-teal-700 hover:bg-slate-50 transition">
                조회
              </a>
            </li>

            <li class="grid grid-cols-[1fr_auto_auto] items-center gap-6 py-3">
              <span class="font-semibold text-slate-700">배송중</span>

              <span class="min-w-[56px] text-center rounded-full bg-emerald-100 px-3 py-1 text-xs font-bold text-emerald-700"
                    th:text="${summary != null ? summary.shippingCount : 0}">0</span>

              <a th:href="@{/mypage/user/order(shipStatus='SHIPPED')}"
                 class="inline-flex items-center justify-center h-8 min-w-[64px] px-4 rounded-xl border border-slate-200 bg-white
              text-sm font-bold text-teal-700 hover:bg-slate-50 transition">
                조회
              </a>
            </li>

            <li class="grid grid-cols-[1fr_auto_auto] items-center gap-6 py-3">
              <span class="font-semibold text-slate-700">진행중인 문의</span>

              <span class="min-w-[56px] text-center rounded-full bg-slate-100 px-3 py-1 text-xs font-bold text-slate-700"
                    th:text="${summary != null ? summary.activeInquiryCount : 0}">0</span>

              <a th:href="@{/inquiry/user/list(status=1)}"
                 class="inline-flex items-center justify-center h-8 min-w-[64px] px-4 rounded-xl border border-slate-200 bg-white
              text-sm font-bold text-teal-700 hover:bg-slate-50 transition">
                확인
              </a>
            </li>
          </ul>
        </div>
      </section>




      <!-- Two Column Grid -->
      <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">

        <section class="rounded-2xl border border-slate-200 bg-white shadow-sm">
          <header class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
            <h3 class="text-base font-bold text-slate-900">최근 주문</h3>
            <a class="text-sm font-semibold text-brand-600 hover:underline"
               th:href="@{/mypage/user/order}">전체 보기</a>
          </header>

          <div class="px-5 py-4">
            <div class="overflow-x-auto">
              <table class="min-w-full text-sm">
                <thead class="bg-slate-50 text-left text-slate-500">
                <tr>
                  <th class="py-2 font-semibold">주문번호</th>
                  <th class="py-2 font-semibold">날짜</th>
                  <th class="py-2 font-semibold">상태</th>
                  <th class="py-2 text-right font-semibold">결제금액</th>
                  <th class="py-2"></th>
                </tr>
                </thead>

                <tbody id="recent-user-orders-body" class="divide-y divide-slate-100">
                <tr>
                  <td colspan="5" class="py-3 text-slate-500">불러오는 중...</td>
                </tr>
                </tbody>

              </table>
            </div>
          </div>
        </section>

        <!-- Recent Inquiries -->
        <section class="rounded-2xl border border-slate-200 bg-white shadow-sm">
          <header class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
            <div>
              <h3 class="text-base font-bold text-slate-900">최근 문의</h3>
            </div>
            <a class="text-sm font-semibold text-brand-600 hover:underline"
               th:href="@{/inquiry/user/list}">전체 보기</a>
          </header>

          <div class="px-5 py-4">
            <div class="overflow-x-auto">
              <table class="min-w-full text-sm">
                <thead class="bg-slate-50 text-left text-slate-500">
                <tr>
                  <th class="py-2 font-semibold">문의ID</th>
                  <th class="py-2 font-semibold">상품ID</th>
                  <th class="py-2 font-semibold">작성일</th>
                  <th class="py-2 font-semibold">상태</th>
                  <th class="py-2"></th>
                </tr>
                </thead>

                <tbody id="recent-user-inquiries-body" class="divide-y divide-slate-100">
                <tr>
                  <td colspan="5" class="py-3 text-slate-500">불러오는 중...</td>
                </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>

      </div>

      <section class="rounded-2xl border border-slate-200 bg-white shadow-sm">
        <header class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
          <h3 class="text-base font-bold text-slate-900">최근 본 상품</h3>
        </header>

        <div class="px-5 py-4">
          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">

            <div id="recently-viewed-host" class="contents"></div>

            <div id="recent-empty"
                 class="hidden rounded-2xl border-dashed border-slate-300 bg-slate-50 p-6 text-center text-sm text-slate-500 sm:col-span-2 lg:col-span-3">
              최근 본 상품이 없습니다.
            </div>

          </div>
        </div>
      </section>

      <script>
        fetch('/api/mypage/user/order/recent?limit=5')
                .then(res => {
                  if (!res.ok) throw new Error('최근 주문 조회 실패');
                  return res.json();
                })
                .then(list => {
                  if (!Array.isArray(list)) list = [];

                  const tbody = document.getElementById('recent-user-orders-body');
                  if (!tbody) return;

                  tbody.innerHTML = '';

                  if (list.length === 0) {
                    tbody.innerHTML = `
          <tr>
            <td colspan="5" class="py-8 text-center text-sm text-slate-500">
              최근 주문이 없습니다.
            </td>
          </tr>`;
                    return;
                  }

                  list.slice(0, 5).forEach(o => {
                    const orderId = o.orderId ?? '-';
                    const orderNo = o.orderNo ?? orderId ?? '-';
                    const status = o.status ?? '-';

                    // createdAt이 "2026-01-06T12:34:56" 형태라고 가정
                    const createdAt = (o.createdAt ?? '').toString();
                    const dateText = createdAt ? createdAt.substring(0, 10) : '-';

                    const totalAmount = Number(o.totalAmount ?? 0);

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
          <td class="py-3 font-semibold text-slate-700">${esc(orderNo)}</td>
          <td class="py-3 text-slate-600">${esc(dateText)}</td>
          <td class="py-3">
            <span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-bold text-slate-700">
              ${esc(status)}
            </span>
          </td>
          <td class="py-3 text-right font-semibold text-slate-700">
            ${totalAmount.toLocaleString()}
          </td>
          <td class="py-3 text-right">
            <a class="inline-flex items-center rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-xs font-bold text-slate-700 hover:bg-slate-50"
               href="/mypage/user/order/${encodeURIComponent(orderId)}">상세</a>
          </td>
        `;
                    tbody.appendChild(tr);
                  });
                })
                .catch(err => {
                  console.error(err);
                  const tbody = document.getElementById('recent-user-orders-body');
                  if (tbody) {
                    tbody.innerHTML = `
          <tr>
            <td colspan="5" class="py-8 text-center text-sm text-slate-500">
              주문 정보를 불러오지 못했습니다.
            </td>
          </tr>`;
                  }
                });

        function esc(s){
          return String(s ?? '')
                  .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
                  .replaceAll('"','&quot;').replaceAll("'","&#039;");
        }
      </script>

      <script>
        fetch('/api/inquiry/user/recent?limit=5')
                .then(res => {
                  if (!res.ok) throw new Error('최근 문의 조회 실패');
                  return res.json();
                })
                .then(list => {
                  if (!Array.isArray(list)) list = [];

                  const tbody = document.getElementById('recent-user-inquiries-body');
                  if (!tbody) return;

                  tbody.innerHTML = '';

                  if (list.length === 0) {
                    tbody.innerHTML = `
          <tr>
            <td colspan="5" class="py-8 text-center text-sm text-slate-500">
              최근 문의가 없습니다.
            </td>
          </tr>`;
                    return;
                  }

                  const statusLabel = (raw) => {
                    const n = Number(raw);
                    if (!Number.isNaN(n)) {
                      if (n === 0) return '답변대기';
                      if (n === 1) return '진행중';
                      if (n === 2) return '종료';
                    }
                    return raw ?? '-';
                  };

                  list.slice(0, 5).forEach(q => {
                    const inquiryId = q.inquiryId ?? q.id ?? '-';
                    const productId = q.productId ?? '-';
                    const status = statusLabel(q.status);
                    const createdAt = (q.createdAt ?? '').toString();
                    const mmdd = createdAt ? createdAt.substring(5, 10) : '-';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
          <td class="py-3 font-semibold text-slate-700">#${esc(inquiryId)}</td>
          <td class="py-3 text-slate-700">${esc(productId)}</td>
          <td class="py-3 text-slate-600">${esc(mmdd)}</td>
          <td class="py-3">
            <span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-bold text-slate-700">
              ${esc(status)}
            </span>
          </td>
          <td class="py-3 text-right">
            <a class="inline-flex items-center rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-xs font-bold text-slate-700 hover:bg-slate-50"
               href="/inquiry/user/detail/${encodeURIComponent(inquiryId)}">상세</a>
          </td>
        `;
                    tbody.appendChild(tr);
                  });
                })
                .catch(err => {
                  console.error(err);
                  const tbody = document.getElementById('recent-user-inquiries-body');
                  if (tbody) {
                    tbody.innerHTML = `
          <tr>
            <td colspan="5" class="py-8 text-center text-sm text-slate-500">
              문의 정보를 불러오지 못했습니다.
            </td>
          </tr>`;
                  }
                });

        function esc(s){
          return String(s ?? '')
                  .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
                  .replaceAll('"','&quot;').replaceAll("'","&#039;");
        }
      </script>
      <script>
        document.addEventListener('DOMContentLoaded', () => {
          const host = document.getElementById('recently-viewed-host');
          const emptyEl = document.getElementById('recent-empty');

          const recentlyViewed =
                  JSON.parse(localStorage.getItem('recentlyViewed')) || [];

          if (recentlyViewed.length === 0) {
            emptyEl.classList.remove('hidden');
            return;
          }

          emptyEl.classList.add('hidden');

          recentlyViewed.slice(0, 6).forEach(item => {
            const card = document.createElement('a');
            card.href = `/products/${item.id}`; // ⚠️ 라우팅 맞게 유지
            card.className =
                    'rounded-2xl border border-slate-200 bg-white p-4 shadow-sm hover:bg-slate-50';

            card.innerHTML = `
        <div class="aspect-[16/9] w-full overflow-hidden rounded-xl bg-slate-100">
          <img src="${item.thumbPath ? item.thumbPath : '/images/default-product.png'}"
               alt="${item.name}"
               class="h-full w-full object-cover">
        </div>
        <div class="mt-3 text-sm font-bold text-slate-900">${item.name}</div>
        <div class="mt-0.5 text-xs text-slate-500">최근 본 상품</div>
      `;

            host.appendChild(card);
          });
        });
      </script>



    </section>

  </th:block>
</th:block>
