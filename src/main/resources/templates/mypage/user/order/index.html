<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="mypage/user/layout/base :: layout(~{::content}, null)">

    <th:block th:fragment="content">

        <section class="space-y-4">
            <header>
                <h1 class="text-2xl font-bold text-slate-900">내 주문 내역</h1>
                <p class="text-sm text-slate-500">주문 내역을 확인하고 상세 정보를 볼 수 있어요.</p>
            </header>

            <div id="user-order-list" class="space-y-4">
                주문을 불러오는 중...
            </div>
        </section>

        <script>
            fetch('/api/order/my')
                .then(res => {
                    if (!res.ok) throw new Error('주문 조회 실패');
                    return res.json();
                })
                .then(list => {
                    if (!Array.isArray(list)) list = [];

                    const params = new URLSearchParams(location.search);

                    // ✅ 기존 필터(주문 상태): ?status=PAID 등
                    const status = norm(params.get('status'));

                    // ✅ 추가 필터(배송 상태): ?shipStatus=READY / SHIPPED
                    const shipStatus = norm(params.get('shipStatus'));

                    // ✅ 2필터 AND 적용
                    const filtered = list.filter(o => {
                        const okStatus = !status || norm(o.status) === status;
                        const okShip = !shipStatus || norm(o.shipStatus) === shipStatus;
                        return okStatus && okShip;
                    });

                    // ✅ 프론트 페이징(10개씩)
                    const size = 10;
                    const page = Math.max(1, parseInt(params.get('page') || '1', 10) || 1);
                    const totalPages = Math.max(1, Math.ceil(filtered.length / size));
                    const safePage = Math.min(page, totalPages);

                    const start = (safePage - 1) * size;
                    const sliced = filtered.slice(start, start + size);

                    render(sliced);
                    renderPager(safePage, totalPages, status, shipStatus);

                    // page가 범위를 벗어나면 URL 정리(필터 유지)
                    if (safePage !== page) {
                        const next = new URLSearchParams(location.search);
                        next.set('page', String(safePage));

                        if (status) next.set('status', status);
                        else next.delete('status');

                        if (shipStatus) next.set('shipStatus', shipStatus);
                        else next.delete('shipStatus');

                        history.replaceState(null, '', `${location.pathname}?${next.toString()}`);
                    }
                })
                .catch(err => {
                    console.error(err);
                    const el = document.getElementById('user-order-list');
                    if (el) el.innerText = '주문 정보를 불러오지 못했습니다.';
                });

            function norm(v) {
                return (v || '').toString().trim().toUpperCase();
            }

            function render(list) {
                const el = document.getElementById('user-order-list');
                if (!el) return;
                el.innerHTML = '';

                if (!list || list.length === 0) {
                    el.innerText = '주문 내역이 없습니다.';
                    return;
                }

                list.forEach(o => {
                    const div = document.createElement('div');
                    const extra = (o.itemCount || 0) - 1;

                    div.innerHTML = `
<div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm space-y-1">
  <div class="flex items-center justify-between gap-2">
    <div class="text-sm font-bold text-slate-900">주문 #${o.orderId ?? '-'}</div>

    <div class="flex items-center gap-2">
      <!-- 주문 상태 -->
      <span class="text-xs font-semibold px-2 py-1 rounded-full bg-slate-100 text-slate-600">
        ${o.status ?? '-'}
      </span>

      <!-- 배송 상태(없을 수도 있음) -->
      <span class="text-xs font-semibold px-2 py-1 rounded-full bg-slate-100 text-slate-600">
        ${o.shipStatus ?? '-'}
      </span>
    </div>
  </div>

  <div class="text-xs text-slate-500">${o.createdAt ?? '-'}</div>

  <div class="pt-2 space-y-1 text-sm">
    <div class="font-semibold text-slate-900">
      ${o.firstProductName ?? '-'}
      <span class="font-medium text-slate-500">${o.firstOptionSummary ?? ''}</span>
      ${extra > 0 ? `<span class="text-slate-500">외 ${extra}개 상품</span>` : ''}
    </div>
    <div class="text-slate-700">
      <span class="text-slate-500">총액</span>
      <b>${Number(o.totalAmount || 0).toLocaleString()}</b>원
    </div>
  </div>

  <div class="pt-3 text-right">
    <button onclick="goDetail(${Number(o.orderId)})"
      class="inline-flex items-center justify-center rounded-xl
             bg-gradient-to-r from-brand-500 to-accent-500
             px-4 py-2 text-xs font-bold text-white
             hover:from-brand-600 hover:to-accent-600">
      상세보기
    </button>
  </div>
</div>
`;
                    el.appendChild(div);
                });
            }

            // ✅ 페이지네이션 UI (status + shipStatus 둘 다 유지)
            function renderPager(page, totalPages, status, shipStatus) {
                const old = document.getElementById('user-order-pager');
                if (old) old.remove();

                if (!totalPages || totalPages <= 1) return;

                const pager = document.createElement('div');
                pager.id = 'user-order-pager';
                pager.className = 'mt-6 flex flex-wrap items-center justify-center gap-2';

                const makeHref = (p) => {
                    const qs = new URLSearchParams(location.search);
                    qs.set('page', String(p));

                    if (status) qs.set('status', status);
                    else qs.delete('status');

                    if (shipStatus) qs.set('shipStatus', shipStatus);
                    else qs.delete('shipStatus');

                    return `${location.pathname}?${qs.toString()}`;
                };

                if (page > 1) pager.appendChild(pageBtn('이전', makeHref(page - 1), false));

                const windowSize = 7;
                let start = Math.max(1, page - Math.floor(windowSize / 2));
                let end = Math.min(totalPages, start + windowSize - 1);
                start = Math.max(1, end - windowSize + 1);

                if (start > 1) {
                    pager.appendChild(pageBtn('1', makeHref(1), page === 1));
                    if (start > 2) pager.appendChild(ellipsis());
                }

                for (let p = start; p <= end; p++) {
                    pager.appendChild(pageBtn(String(p), makeHref(p), p === page));
                }

                if (end < totalPages) {
                    if (end < totalPages - 1) pager.appendChild(ellipsis());
                    pager.appendChild(pageBtn(String(totalPages), makeHref(totalPages), page === totalPages));
                }

                if (page < totalPages) pager.appendChild(pageBtn('다음', makeHref(page + 1), false));

                const listEl = document.getElementById('user-order-list');
                listEl.after(pager);
            }

            function pageBtn(text, href, active) {
                const a = document.createElement('a');
                a.href = href;
                a.textContent = text;

                const base = 'rounded-xl border px-3 py-1.5 text-sm font-semibold ';
                const normal = 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50';
                const activeCls =
                    'border-transparent text-white ' +
                    'bg-gradient-to-r from-brand-500 to-accent-500 ' +
                    'hover:from-brand-600 hover:to-accent-600';

                a.className = base + (active ? activeCls : normal);
                return a;
            }

            function ellipsis() {
                const span = document.createElement('span');
                span.textContent = '...';
                span.className = 'px-2 text-sm text-slate-400';
                return span;
            }

            window.goDetail = function(orderId) {
                location.href = `/mypage/user/order/${orderId}`;
            };
        </script>


    </th:block>
</th:block>
