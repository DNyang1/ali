<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="mypage/user/layout/base :: layout(~{::body}, ~{})">
<head>
    <meta charset="UTF-8">
    <title>order-list</title>
</head>
<body>
<div id="order-list"></div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        loadOrders();
    });

    function loadOrders() {
        fetch('/api/order/my')
            .then(res => res.json())
            .then(renderOrders)
            .catch(err => {
                console.error(err);
                alert('주문 내역을 불러오지 못했습니다.');
            });
    }

    function renderOrders(orders) {
        const container = document.getElementById('order-list');
        container.innerHTML = '';

        if (!orders || orders.length === 0) {
            container.innerHTML = '<p>주문 내역이 없습니다.</p>';
            return;
        }

        orders.forEach(o => {
            const extra = o.itemCount - 1;
            const div = document.createElement('div');
            div.className = 'order-card';

            div.innerHTML = `

            <div>
            ${o.firstProductName}
            ${o.firstOptionSummary}
              ${extra > 0 ? ` 외 ${extra}개 상품` : ''}
            </div>
            <div>주문번호: ${o.orderId}</div>
            <div>주문일: ${o.createdAt}</div>
            <div>금액: ${o.totalAmount}원</div>
            <div>상태: ${o.status}</div>
            <button onclick="goDetail(${o.orderId})">상세보기</button>


        `;

            container.appendChild(div);
        });
    }

    function goDetail(orderId) {
        location.href = `/mypage/user/order/${orderId}`;
    }
</script>

</body>
</html>
