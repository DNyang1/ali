<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>결제</title>

    <style>
        /* ===== 기본 ===== */
        body {
            margin: 0;
            padding: 40px 0;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        /* ===== 레이아웃 ===== */
        .checkout-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 16px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        /* ===== 카드 ===== */
        .card {
            background: #fff;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 6px 24px rgba(0,0,0,.08);
        }

        h2 {
            margin: 0 0 18px;
            font-size: 20px;
        }

        /* ===== 배송지 ===== */
        .address-card {
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            font-size: 14px;
        }

        .address-card.active {
            border-color: #ff6a00;
            background: #fff7f0;
        }

        /* ===== 주문 상품 ===== */
        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .item:last-child {
            border-bottom: none;
        }

        /* ===== 결제 요약 ===== */
        .summary {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: right;
        }

        .summary h1 {
            margin: 10px 0 20px;
            font-size: 26px;
        }

        .summary button {
            width: 100%;
            background: linear-gradient(135deg,#ff6a00,#ff8a00);
            border: none;
            color: #fff;
            padding: 14px;
            border-radius: 26px;
            font-size: 16px;
            cursor: pointer;
        }

        .back-btn {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 10px;
        }
    </style>
<link rel="stylesheet" href="/main/css/main-header.css">
<link rel="stylesheet" href="/main/css/common.css">
</head>
<body>
<div th:replace="layout/mainHeader :: mainHeader"></div>
<div class="checkout-page">

    <!-- ===== 좌측 영역 ===== -->
    <div class="left">

        <!-- 주문 상품 -->
        <div class="card" style="margin-top:24px;">
            <h2>🧾 주문 상품</h2>
            <div id="preview-items"></div>
        </div>

        <!-- 배송지 -->
        <div class="card">
            <h2>🚚 배송지 선택</h2>
            <div id="address-list">
                <p>배송지를 불러오는 중...</p>
            </div>
        </div>

    </div>

    <!-- ===== 우측 결제 요약 ===== -->
    <div class="card summary">
        <h2>💳 결제 요약</h2>

        <div>총 결제 금액</div>
        <h1><span id="total-amount">0</span> 원</h1>

        <button class="back-btn" onclick="location.href='/cart'">
            장바구니로
        </button>

        <button onclick="order()">결제하기</button>
    </div>

</div>

<script>
    /* =======================
       주문 미리보기
       ======================= */

    async function loadCheckout() {
        const items = JSON.parse(localStorage.getItem('checkoutItems'));

        if (!items || items.length === 0) {
            alert('결제 정보가 없습니다.');
            location.href = '/cart';
            return;
        }

        const res = await fetch('/api/checkout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                items: items,
                addressId: null
            })
        });

        const checkout = await res.json();
        renderPreview(checkout);
        window.currentCheckout = checkout; // 주문 생성용 보관
    }
    function renderPreview(data) {
        const container = document.getElementById('preview-items');
        container.innerHTML = '';

        if (!data.items || data.items.length === 0) {
            container.innerHTML = '<p>결제할 상품이 없습니다.</p>';
            return;
        }

        data.items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'item';

            div.innerHTML = `
                <span>
                    ${item.productName}
                    ${item.optionSummary}
                    (SKU: ${item.skuId}) × ${item.quantity}
                </span>
                <span>${item.lineAmount} 원</span>
            `;

            container.appendChild(div);
        });

        document.getElementById('total-amount').innerText = data.totalAmount;
    }

    /* =======================
       배송지
       ======================= */
    let selectedAddressId = null;

    function loadAddresses() {
        fetch('/address')
            .then(res => res.json())
            .then(renderAddresses);
    }

    function renderAddresses(addresses) {
        const container = document.getElementById('address-list');
        container.innerHTML = '';

        if (!addresses || addresses.length === 0) {
            container.innerHTML = '<p>등록된 배송지가 없습니다.</p>';
            return;
        }

        addresses.forEach(addr => {
            const div = document.createElement('div');
            div.className = 'address-card';

            if (addr.isDefault) {
                div.classList.add('active');
                selectedAddressId = addr.id;
            }

            div.onclick = () => selectAddress(div, addr.id);

            div.innerHTML = `
                <strong>${addr.rName}</strong> (${addr.rPhone || '-'})<br>
                [${addr.zipcode}] ${addr.address1} ${addr.address2 || ''}
            `;

            container.appendChild(div);
        });
    }

    function selectAddress(el, id) {
        document.querySelectorAll('.address-card')
            .forEach(a => a.classList.remove('active'));

        el.classList.add('active');
        selectedAddressId = id;
    }

    /* =======================
       주문 생성
       ======================= */
    async function order() {
        if (!selectedAddressId) {
            alert('배송지를 선택해주세요.');
            return;
        }

        try {
            // 1️⃣ 주문 생성
            const orderRes = await fetch('/api/order', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    ...window.currentCheckout,
                    addressId: selectedAddressId
                })
            });

            if (!orderRes.ok) {
                throw new Error('주문 생성 실패');
            }

            const orderData = await orderRes.json();

            // ✅ 개발 단계: 주문 생성 알림 유지
            alert('주문 생성 완료!\n주문번호: ' + orderData.orderId);

            // 2️⃣ 결제 시도 (Mock 결제)
            const paymentRes = await fetch('/api/payments', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    orderId: orderData.orderId,
                    method: 'MOCK'   // 나중에 CARD / BANK 로 확장 가능
                })
            });

            if (!paymentRes.ok) {
                throw new Error('결제 요청 실패');
            }

            const paymentData = await paymentRes.json();

            // 3️⃣ 결제 결과 분기
            if (paymentData.status === 'SUCCESS') {
                alert(
                    '결제 성공!\n' +
                    '주문번호: ' + orderData.orderId
                );
                location.href = `/order/complete?orderId=${orderData.orderId}`;
            } else {
                alert(
                    '결제 실패\n' +
                    '다시 시도해주세요.'
                );
            }

        } catch (error) {
            console.error(error);
            alert('주문/결제 처리 중 오류가 발생했습니다.');
        }
    }

    /* 초기 로딩 */
    loadCheckout();
    loadAddresses();
</script>

</body>
</html>
