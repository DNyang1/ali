<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ALI | 결제하기</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/main/css/main-header.css">
    <link rel="stylesheet" href="/main/css/common.css">
    <link rel="stylesheet" href="/mypage/common/css/layout.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        .loader {
            border: 4px solid #f3f3f3; /* Light grey */
            border-top: 4px solid #0d9488; /* Teal-600 */
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
<div th:replace="layout/mainHeader :: mainHeader"></div>

<main class="max-w-[1200px] mx-auto px-6 py-12">
    <h1 class="text-3xl font-extrabold mb-8 text-slate-800">🛍️ &nbsp;Checkout</h1>

    <div class="grid grid-cols-[1fr_380px] gap-12 items-start">
        <!-- Left Column -->
        <div class="space-y-8">
            <!-- 주문 상품 -->
            <div class="bg-white rounded-xl shadow-sm">
                <div class="p-6 border-b border-slate-200">
                    <h2 class="text-xl font-bold flex items-center gap-3"><i class="fas fa-shopping-bag text-teal-600"></i> 주문 상품</h2>
                </div>
                <div id="order-item-list" class="p-6">
                    <div class="loader"></div>
                </div>
            </div>

            <!-- 배송지 -->
            <div class="bg-white rounded-xl shadow-sm">
                <div class="p-6 border-b border-slate-200 flex justify-between items-center">
                    <h2 class="text-xl font-bold flex items-center gap-3"><i class="fas fa-truck text-teal-600"></i> 배송지 선택</h2>
                    <button class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 px-4 rounded-lg" onclick="addNewAddress()">+ 새 배송지 추가</button>
                </div>
                <div id="address-list" class="p-6 space-y-3">
                    <div class="loader"></div>
                </div>
            </div>

            <!-- 결제 수단 -->
            <div class="bg-white rounded-xl shadow-sm">
                <div class="p-6 border-b border-slate-200">
                    <h2 class="text-xl font-bold flex items-center gap-3"><i class="fas fa-credit-card text-teal-600"></i> 결제 수단</h2>
                </div>
                <div class="p-6">
                    <div class="payment-method-list grid grid-cols-2 gap-4">
                        <div class="payment-method p-4 border rounded-lg cursor-pointer hover:border-teal-500 flex items-center gap-4" data-method="MOCK">
                            <i class="fas fa-money-check-alt text-2xl text-slate-400"></i>
                            <span class="font-semibold">가상 결제</span>
                        </div>
                        <div class="payment-method p-4 border rounded-lg cursor-pointer hover:border-teal-500 flex items-center gap-4" data-method="TOSS">
                            <i class="fas fa-coins text-2xl text-slate-400"></i>
                            <span class="font-semibold">토스페이먼츠</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column (Sidebar) -->
        <div class="sticky top-8">
            <div class="bg-white rounded-xl shadow-sm">
                <div class="p-6 border-b border-slate-200">
                    <h2 class="text-xl font-bold flex items-center gap-3"><i class="fas fa-receipt text-teal-600"></i> 결제 요약</h2>
                </div>
                <div class="p-6 space-y-4">
                    <div class="flex justify-between items-center text-slate-600">
                        <span>총 상품 금액</span>
                        <span id="subtotal" class="font-medium text-slate-900">0 원</span>
                    </div>
                    <div class="flex justify-between items-center text-slate-600">
                        <span>배송비</span>
                        <span id="shipping-fee" class="font-medium text-slate-900">0 원</span>
                    </div>
                    <div class="border-t pt-4 mt-4">
                        <div class="flex justify-between items-center text-lg font-bold">
                            <span>최종 결제 금액</span>
                            <span id="total-amount" class="text-2xl font-extrabold text-teal-600">0 원</span>
                        </div>
                    </div>
                    
                    <div class="pt-4 space-y-2">
                        <label for="currency-selector" class="text-sm font-medium text-slate-600">표시 통화</label>
                        <div class="flex items-center gap-2">
                            <select id="currency-selector" onchange="handleCurrencyChange()" class="w-full p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-teal-500 focus:border-teal-500"></select>
                            <button id="refresh-rates-btn" onclick="refreshExchangeRates()" title="환율 새로고침" class="p-2 border rounded-md hover:bg-slate-100">
                                <i class="fas fa-sync-alt text-slate-600"></i>
                            </button>
                        </div>
                        <div class="text-xs text-slate-500 text-right">
                            환율 기준일: <span id="rates-base-date">N/A</span>
                        </div>
                    </div>

                    <button class="w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-3 rounded-lg text-lg transition-colors mt-4" onclick="order()">결제하기</button>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- ====== 주소 추가 모달 ====== -->
<div id="address-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg">
        <div class="p-6 border-b flex justify-between items-center">
            <h2 class="text-xl font-bold">새 배송지 추가</h2>
            <button class="w-8 h-8 rounded-full hover:bg-slate-100" onclick="closeAddressModal()">&times;</button>
        </div>
        <form id="address-form" class="p-6 space-y-4" onsubmit="saveNewAddress(event)">
            <div class="grid grid-cols-[80px_1fr] items-center gap-4">
                <label for="rName" class="font-semibold text-sm">받는 분</label>
                <input type="text" id="rName" class="w-full p-2 border border-slate-300 rounded-md" required>
            </div>
            <div class="grid grid-cols-[80px_1fr] items-center gap-4">
                <label for="rPhone" class="font-semibold text-sm">연락처</label>
                <input type="tel" id="rPhone" class="w-full p-2 border border-slate-300 rounded-md" required>
            </div>
            <div class="grid grid-cols-[80px_1fr] items-start gap-4">
                <label class="font-semibold text-sm pt-2">주소</label>
                <div class="space-y-2">
                    <div class="flex gap-2">
                        <input type="text" id="zipcode" class="w-full p-2 border border-slate-300 rounded-md bg-slate-50" placeholder="우편번호" readonly required>
                        <button type="button" class="bg-slate-700 hover:bg-slate-800 text-white font-semibold py-2 px-4 rounded-md whitespace-nowrap" onclick="execDaumPostcode()">검색</button>
                    </div>
                    <input type="text" id="address1" class="w-full p-2 border border-slate-300 rounded-md bg-slate-50" placeholder="기본 주소" readonly required>
                    <input type="text" id="address2" class="w-full p-2 border border-slate-300 rounded-md" placeholder="상세 주소 입력">
                </div>
            </div>
            <div class="grid grid-cols-[80px_1fr] items-center gap-4">
                <label></label>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="isDefault" class="h-4 w-4 rounded border-slate-300 text-teal-600 focus:ring-teal-500">
                    <label for="isDefault">기본 배송지로 설정</label>
                </div>
            </div>
            <div class="pt-4 border-t flex justify-end gap-3">
                <button type="button" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 px-4 rounded-lg" onclick="closeAddressModal()">취소</button>
                <button type="submit" class="bg-teal-500 hover:bg-teal-600 text-white font-bold py-2 px-4 rounded-lg">저장하기</button>
            </div>
        </form>
    </div>
</div>

<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
    let selectedAddressId = null;
    let selectedPaymentMethod = 'MOCK';
    let currentCheckoutData = {};

    document.addEventListener("DOMContentLoaded", () => {
        loadCheckout();
        loadAddresses();
        setupPaymentMethodSelector();
        loadCurrencyData();
    });

    async function loadCurrencyData(triggeredByButton = false) {
        const refreshBtn = document.getElementById('refresh-rates-btn');
        const baseDateSpan = document.getElementById('rates-base-date');
        const selector = document.getElementById('currency-selector');
        const icon = refreshBtn.querySelector('i');
        const originalIcon = 'fa-sync-alt';

        if (refreshBtn) refreshBtn.disabled = true;
        if (triggeredByButton) {
            icon.className = 'fas fa-spinner fa-spin';
        }

        try {
            if (!triggeredByButton) {
                const baseDateResponse = await fetch('/api/exchange/baseDate');
                if (baseDateResponse.ok) {
                    const baseDate = await baseDateResponse.json();
                    if (baseDateSpan && baseDate) baseDateSpan.innerText = baseDate;
                }
            } else {
                const refreshResponse = await fetch('/api/exchange/refresh', { method: 'POST' });
                if (!refreshResponse.ok) throw new Error('Failed to refresh rates');
                const refreshData = await refreshResponse.json();
                if (baseDateSpan && refreshData.baseDate) baseDateSpan.innerText = refreshData.baseDate;
            }
            const currenciesResponse = await fetch('/api/exchange/currencies');
            if (!currenciesResponse.ok) throw new Error('Failed to fetch currencies');
            const currencies = await currenciesResponse.json();
            const previouslySelected = selector.value;
            selector.innerHTML = '<option value="KRW">KRW</option>';
            currencies.forEach(currency => {
                if (currency !== 'KRW') selector.innerHTML += `<option value="${currency}">${currency}</option>`;
            });
            selector.value = [...selector.options].some(opt => opt.value === previouslySelected) ? previouslySelected : 'KRW';
            if (selector.value !== 'KRW') await handleCurrencyChange();

            if (triggeredByButton) {
                icon.className = 'fas fa-check text-green-600';
                setTimeout(() => {
                    icon.className = `fas ${originalIcon} text-slate-600`;
                }, 2000);
            }
        } catch (error) {
            console.error('Error loading currency data:', error);
            if (baseDateSpan) baseDateSpan.innerText = '오류';
            if (triggeredByButton) {
                icon.className = 'fas fa-exclamation-triangle text-red-600';
                setTimeout(() => {
                    icon.className = `fas ${originalIcon} text-slate-600`;
                }, 2000);
            }
        } finally {
            if (refreshBtn) refreshBtn.disabled = false;
        }
    }

    async function refreshExchangeRates() { await loadCurrencyData(true); }

    async function handleCurrencyChange() {
        const selector = document.getElementById('currency-selector');
        const selectedCurrency = selector.value;
        const totalKrw = currentCheckoutData.totalAmount;
        if (selectedCurrency === 'KRW') {
            renderSummary(currentCheckoutData);
            return;
        }
        if (!totalKrw) return;
        try {
            const response = await fetch(`/api/exchange?amount=${totalKrw}&currency=${selectedCurrency}`);
            if (!response.ok) throw new Error('Conversion failed');
            const result = await response.json();
            const convertedAmount = result.convertedAmount.toFixed(2);
            document.getElementById('subtotal').innerText = `${convertedAmount} ${result.currency}`;
            document.getElementById('shipping-fee').innerText = `0 ${result.currency}`;
            document.getElementById('total-amount').innerText = `${convertedAmount} ${result.currency}`;
        } catch (error) {
            console.error('Error converting currency:', error);
            alert('환율 변환에 실패했습니다.');
            selector.value = 'KRW';
        }
    }

    async function loadCheckout() {
        const items = JSON.parse(localStorage.getItem('checkoutItems'));
        if (!items || items.length === 0) {
            alert('결제할 상품 정보가 없습니다. 장바구니로 돌아갑니다.');
            location.href = '/cart';
            return;
        }
        const sheetId = sessionStorage.getItem('checkoutSheetId');
        try {
            const body = { items, addressId: null };
            if (sheetId) body.sheetId = Number(sheetId);
            const response = await fetch('/api/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!response.ok) throw new Error('Checkout data fetch failed.');
            const data = await response.json();
            currentCheckoutData = data;
            renderOrderItems(data);
            renderSummary(data);
        } catch (error) {
            console.error('Error loading checkout:', error);
            document.getElementById('order-item-list').innerHTML = '<p class="text-center text-red-500 py-4">주문 정보를 불러오는데 실패했습니다.</p>';
        }
    }

    function renderOrderItems(data) {
        const container = document.getElementById('order-item-list');
        container.innerHTML = '';
        if (!data.items || data.items.length === 0) {
            container.innerHTML = '<p class="text-center text-slate-500 py-4">주문할 상품이 없습니다.</p>';
            return;
        }
        data.items.forEach(item => {
            container.innerHTML += `
                <div class="flex items-center gap-4 py-4 border-b last:border-0 px-6">
                    <div class="w-20 h-20 bg-slate-100 rounded-md overflow-hidden flex-shrink-0">
                         <img src="https://picsum.photos/seed/${item.skuId}/200" alt="${item.productName}" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1">
                        <div class="font-bold text-slate-800">${item.productName}</div>
                        <div class="text-sm text-slate-500 mt-1">${item.optionSummary} / ${item.quantity}개</div>
                    </div>
                    <div class="font-semibold text-right">${item.lineAmount.toLocaleString()}원</div>
                </div>`;
        });
    }

    function renderSummary(data) {
        document.getElementById('subtotal').innerText = `${data.totalAmount.toLocaleString()} 원`;
        document.getElementById('shipping-fee').innerText = `0 원`;
        document.getElementById('total-amount').innerText = `${data.totalAmount.toLocaleString()} 원`;
        handleCurrencyChange();
    }

    async function loadAddresses() {
        document.getElementById('address-list').innerHTML = '<div class="loader"></div>';
        try {
            const response = await fetch('/address');
            if (!response.ok) throw new Error('Address fetch failed.');
            const addresses = await response.json();
            renderAddresses(addresses);
        } catch (error) {
            console.error('Error loading addresses:', error);
            document.getElementById('address-list').innerHTML = '<p class="text-center text-red-500 py-4">배송지를 불러오는데 실패했습니다.</p>';
        }
    }

    function renderAddresses(addresses) {
        const container = document.getElementById('address-list');
        container.innerHTML = '';
        if (!addresses || addresses.length === 0) {
            container.innerHTML = '<p class="text-center text-slate-500 py-4">등록된 배송지가 없습니다.</p>';
            return;
        }
        addresses.forEach(addr => {
            const card = document.createElement('div');
            card.className = 'address-card border rounded-lg p-4 cursor-pointer hover:border-teal-500 hover:bg-teal-50/50 transition';
            card.dataset.addressId = addr.id;
            card.onclick = () => selectAddress(card, addr.id);

            if (addr.isDefault) {
                card.classList.add('active', 'border-2', 'border-teal-600', 'bg-teal-50/80');
                selectedAddressId = addr.id;
            }
            card.innerHTML = `
                ${addr.isDefault ? '<div class="text-xs font-bold text-white bg-teal-600 rounded-full px-2 py-0.5 inline-block mb-2">기본 배송지</div>' : ''}
                <div class="font-semibold">${addr.rName} <span class="font-normal text-slate-500">(${addr.rPhone || '-'})</span></div>
                <div class="text-sm text-slate-600 mt-1">[${addr.zipcode}] ${addr.address1} ${addr.address2 || ''}</div>
            `;
            container.appendChild(card);
        });
    }

    function selectAddress(card, id) {
        document.querySelectorAll('.address-card.active').forEach(c => c.classList.remove('active', 'border-2', 'border-teal-600', 'bg-teal-50/80'));
        card.classList.add('active', 'border-2', 'border-teal-600', 'bg-teal-50/80');
        selectedAddressId = id;
    }

    const addressModal = document.getElementById('address-modal');
    function addNewAddress() { addressModal.classList.remove('hidden'); }
    function closeAddressModal() { addressModal.classList.add('hidden'); document.getElementById('address-form').reset(); }

    async function saveNewAddress(event) {
        event.preventDefault();
        const newAddress = {
            rName: document.getElementById('rName').value, rPhone: document.getElementById('rPhone').value,
            zipcode: document.getElementById('zipcode').value, address1: document.getElementById('address1').value,
            address2: document.getElementById('address2').value, isDefault: document.getElementById('isDefault').checked
        };
        try {
            const response = await fetch('/address', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newAddress)
            });
            if (!response.ok) throw new Error('Failed to save address.');
            closeAddressModal();
            await loadAddresses();
        } catch (error) {
            console.error('Error saving address:', error);
            alert('배송지 저장에 실패했습니다. 다시 시도해주세요.');
        }
    }

    function execDaumPostcode() {
        new daum.Postcode({
            oncomplete: function(data) {
                document.getElementById('zipcode').value = data.zonecode;
                document.getElementById("address1").value = data.address;
                document.getElementById("address2").focus();
            }
        }).open();
    }

    function setupPaymentMethodSelector() {
        const methods = document.querySelectorAll('.payment-method');
        methods.forEach(method => {
            method.addEventListener('click', () => {
                methods.forEach(m => m.classList.remove('active', 'border-2', 'border-teal-600', 'bg-teal-50/80'));
                method.classList.add('active', 'border-2', 'border-teal-600', 'bg-teal-50/80');
                selectedPaymentMethod = method.dataset.method;
            });
        });
        // Select the first one by default
        if (methods.length > 0) methods[0].click();
    }

    async function order() {
        if (!selectedAddressId) {
            alert('배송지를 선택해주세요.');
            return;
        }
        const sheetId = sessionStorage.getItem('checkoutSheetId');
        try {
            const payload = { ...currentCheckoutData, addressId: selectedAddressId };
            if (sheetId) payload.sheetId = Number(sheetId);
            const orderRes = await fetch('/api/order', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
            });
            if (!orderRes.ok) throw new Error('주문 생성 실패');
            const orderData = await orderRes.json();
            const paymentRes = await fetch('/api/payments', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ orderId: orderData.orderId, method: selectedPaymentMethod })
            });
            if (!paymentRes.ok) throw new Error('결제 요청 실패');
            const paymentData = await paymentRes.json();
            if (paymentData.status === 'SUCCESS') {
                sessionStorage.removeItem('checkoutSheetId');
                localStorage.removeItem('checkoutItems');
                alert(`결제 성공! 주문번호: ${orderData.orderId}`);
                location.href = `/order/complete?orderId=${orderData.orderId}`;
            } else {
                alert('결제에 실패했습니다. 다시 시도해주세요.');
            }
        } catch (error) {
            console.error('Order processing failed:', error);
            alert('주문 처리 중 오류가 발생했습니다.');
        }
    }
</script>

</body>
</html>
