<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MODERN-ALI | 결제하기</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/main/css/main-header.css">
    <link rel="stylesheet" href="/main/css/common.css">
    <link rel="stylesheet" href="/checkout/css/checkout.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
<div th:replace="layout/mainHeader :: mainHeader"></div>

<div class="checkout-container">
    <div class="main-content">
        <!-- 주문 상품 -->
        <div class="checkout-card">
            <div class="card-header">
                <i class="fas fa-shopping-bag"></i>
                <h2>주문 상품</h2>
            </div>
            <div id="order-item-list" class="order-item-list">
                 <div class="loader"></div>
            </div>
        </div>

        <!-- 배송지 -->
        <div class="checkout-card">
            <div class="card-header">
                <i class="fas fa-truck"></i>
                <h2>배송지 선택</h2>
            </div>
            <div id="address-list" class="address-list">
                <div class="loader"></div>
            </div>
            <button class="add-address-btn" onclick="addNewAddress()">+ 새 배송지 추가</button>
        </div>

         <!-- 결제 수단 -->
        <div class="checkout-card">
            <div class="card-header">
                <i class="fas fa-credit-card"></i>
                <h2>결제 수단</h2>
            </div>
            <div class="payment-method-list">
                <div class="payment-method active" data-method="MOCK">
                    <i class="fas fa-money-check-alt"></i>
                    <span>가상 결제</span>
                </div>
                <div class="payment-method" data-method="TOSS">
                     <i class="fas fa-coins"></i>
                    <span>토스페이먼츠</span>
                </div>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <!-- 최종 결제 요약 -->
        <div class="checkout-card summary-card">
            <div class="card-header">
                 <i class="fas fa-receipt"></i>
                <h2>결제 요약</h2>
            </div>
            <div class="summary-details">
                <div class="summary-row">
                    <span>총 상품 금액</span>
                    <span id="subtotal">0 원</span>
                </div>
                <div class="summary-row">
                    <span>배송비</span>
                    <span id="shipping-fee">0 원</span>
                </div>
                <div class="summary-row total">
                    <span>최종 결제 금액</span>
                    <span class="total-price" id="total-amount">0 원</span>
                </div>
            </div>
            <button class="checkout-btn" onclick="order()">결제하기</button>
        </div>
    </div>
</div>

<!-- ====== 주소 추가 모달 ====== -->
<div id="address-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2>새 배송지 추가</h2>
            <button class="close-btn" onclick="closeAddressModal()">&times;</button>
        </div>
        <form id="address-form" class="address-form" onsubmit="saveNewAddress(event)">
            <div class="form-group">
                <label for="rName">받는 분</label>
                <input type="text" id="rName" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="rPhone">연락처</label>
                <input type="tel" id="rPhone" class="form-control" required>
            </div>
            <div class="form-group">
                <label>주소</label>
                <div class="zipcode-group">
                    <input type="text" id="zipcode" class="form-control" placeholder="우편번호" readonly required>
                    <button type="button" class="btn btn-secondary" onclick="execDaumPostcode()">검색</button>
                </div>
            </div>
            <div class="form-group">
                <input type="text" id="address1" class="form-control" placeholder="기본 주소" readonly required>
            </div>
            <div class="form-group">
                <input type="text" id="address2" class="form-control" placeholder="상세 주소 입력">
            </div>
            <div class="form-group form-checkbox">
                <input type="checkbox" id="isDefault">
                <label for="isDefault">기본 배송지로 설정</label>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="closeAddressModal()">취소</button>
                <button type="submit" class="btn btn-primary">저장하기</button>
            </div>
        </form>
    </div>
</div>

<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
    let selectedAddressId = null;
    let selectedPaymentMethod = 'MOCK';
    let currentCheckoutData = {};

    document.addEventListener("DOMContentLoaded", () => {
        loadCheckout();
        loadAddresses();
        setupPaymentMethodSelector();
    });

    async function loadCheckout() {
        const items = JSON.parse(localStorage.getItem('checkoutItems'));
        if (!items || items.length === 0) {
            alert('결제할 상품 정보가 없습니다. 장바구니로 돌아갑니다.');
            location.href = '/cart';
            return;
        }
        //태민
        const sheetId = sessionStorage.getItem('checkoutSheetId');
        try {
            //태민
            const body = { items, addressId: null };
            if (sheetId) body.sheetId = Number(sheetId);
            const response = await fetch('/api/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!response.ok) throw new Error('Checkout data fetch failed.');
            
            const data = await response.json();
            currentCheckoutData = data;
            renderOrderItems(data);
            renderSummary(data);
        } catch (error) {
            console.error('Error loading checkout:', error);
            document.getElementById('order-item-list').innerHTML = '<p>주문 정보를 불러오는데 실패했습니다.</p>';
        }
    }

    function renderOrderItems(data) {
        const container = document.getElementById('order-item-list');
        container.innerHTML = '';
        if (!data.items || data.items.length === 0) {
            container.innerHTML = '<p>주문할 상품이 없습니다.</p>';
            return;
        }
        data.items.forEach(item => {
            container.innerHTML += `
                <div class="item">
                    <div class="item-image"></div>
                    <div class="item-details">
                        <div class="item-name">${item.productName}</div>
                        <div class="item-info">${item.optionSummary} / ${item.quantity}개</div>
                        <div class="item-price">${item.lineAmount.toLocaleString()}원</div>
                    </div>
                </div>`;
        });
    }

    function renderSummary(data) {
        document.getElementById('subtotal').innerText = `${data.totalAmount.toLocaleString()} 원`;
        document.getElementById('shipping-fee').innerText = `0 원`;
        document.getElementById('total-amount').innerText = `${data.totalAmount.toLocaleString()} 원`;
    }

    async function loadAddresses() {
        document.getElementById('address-list').innerHTML = '<div class="loader"></div>';
        try {
            const response = await fetch('/address');
            if (!response.ok) throw new Error('Address fetch failed.');
            const addresses = await response.json();
            renderAddresses(addresses);
        } catch (error) {
            console.error('Error loading addresses:', error);
            document.getElementById('address-list').innerHTML = '<p>배송지를 불러오는데 실패했습니다.</p>';
        }
    }

    function renderAddresses(addresses) {
        const container = document.getElementById('address-list');
        container.innerHTML = '';
        if (!addresses || addresses.length === 0) {
            container.innerHTML = '<p>등록된 배송지가 없습니다.</p>';
            return;
        }
        addresses.forEach(addr => {
            const card = document.createElement('div');
            card.className = 'address-card';
            card.onclick = () => selectAddress(card, addr.id);
            
            if (addr.isDefault) {
                card.classList.add('active');
                selectedAddressId = addr.id;
            }
            
            card.innerHTML = `
                ${addr.isDefault ? '<div class="default-badge">기본 배송지</div>' : ''}
                <div class="address-card-content">
                    <strong>${addr.rName}</strong> (${addr.rPhone || '-'})<br>
                    [${addr.zipcode}] ${addr.address1} ${addr.address2 || ''}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function selectAddress(card, id) {
        document.querySelectorAll('.address-card.active').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        selectedAddressId = id;
    }
    
    // --- Address Modal Functions ---
    const addressModal = document.getElementById('address-modal');

    function addNewAddress() {
        addressModal.classList.add('visible');
    }

    function closeAddressModal() {
        addressModal.classList.remove('visible');
        document.getElementById('address-form').reset();
    }

    async function saveNewAddress(event) {
        event.preventDefault();
        
        const newAddress = {
            rName: document.getElementById('rName').value,
            rPhone: document.getElementById('rPhone').value,
            zipcode: document.getElementById('zipcode').value,
            address1: document.getElementById('address1').value,
            address2: document.getElementById('address2').value,
            isDefault: document.getElementById('isDefault').checked
        };

        try {
            const response = await fetch('/address', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newAddress)
            });

            if (!response.ok) {
                throw new Error('Failed to save address.');
            }
            
            closeAddressModal();
            await loadAddresses(); // Refresh the address list

        } catch (error) {
            console.error('Error saving address:', error);
            alert('배송지 저장에 실패했습니다. 다시 시도해주세요.');
        }
    }

    function execDaumPostcode() {
        new daum.Postcode({
            oncomplete: function(data) {
                document.getElementById('zipcode').value = data.zonecode;
                document.getElementById("address1").value = data.address;
                document.getElementById("address2").focus();
            }
        }).open();
    }

    // --- End of Address Modal Functions ---


    function setupPaymentMethodSelector() {
        document.querySelectorAll('.payment-method').forEach(method => {
            method.addEventListener('click', () => {
                document.querySelectorAll('.payment-method.active').forEach(m => m.classList.remove('active'));
                method.classList.add('active');
                selectedPaymentMethod = method.dataset.method;
            });
        });
    }

    async function order() {
        if (!selectedAddressId) {
            alert('배송지를 선택해주세요.');
            return;
        }
        const sheetId = sessionStorage.getItem('checkoutSheetId');
        try {
            const payload = { ...currentCheckoutData, addressId: selectedAddressId };
            if (sheetId) payload.sheetId = Number(sheetId);
            const orderRes = await fetch('/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!orderRes.ok) throw new Error('주문 생성 실패');
            
            const orderData = await orderRes.json();
            
            const paymentRes = await fetch('/api/payments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ orderId: orderData.orderId, method: selectedPaymentMethod })
            });
            if (!paymentRes.ok) throw new Error('결제 요청 실패');

            const paymentData = await paymentRes.json();
            
            if (paymentData.status === 'SUCCESS') {
                //태민
                sessionStorage.removeItem('checkoutSheetId');
                localStorage.removeItem('checkoutItems');
                alert(`결제 성공! 주문번호: ${orderData.orderId}`);
                location.href = `/order/complete?orderId=${orderData.orderId}`;
            } else {
                alert('결제에 실패했습니다. 다시 시도해주세요.');
            }
        } catch (error) {
            console.error('Order processing failed:', error);
            alert('주문 처리 중 오류가 발생했습니다.');
        }
    }
</script>

</body>
</html>
