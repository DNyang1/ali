<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>페이지를 찾을 수 없습니다 - ALI</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f8f9fa;
      font-family: 'Noto Sans KR', 'Segoe UI', sans-serif;
      text-align: center;
    }
    .container {
      background: white;
      padding: 60px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 90%;
    }
    h1 {
      font-size: 80px;
      margin: 0;
      color: #dc3545; /* 빨간색 포인트 */
      font-weight: 900;
    }
    h2 {
      margin: 10px 0 20px;
      color: #333;
      font-size: 24px;
    }
    p {
      color: #666;
      margin-bottom: 40px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      padding: 15px 35px;
      background-color: #0d6efd; /* 파란색 버튼 */
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.3s;
    }
    .btn:hover {
      background-color: #0b5ed7;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>404</h1>
  <h2>페이지를 찾을 수 없습니다.</h2>
  <p>요청하신 페이지가 삭제되었거나,<br>잘못된 주소를 입력하셨습니다.</p>
  <a href="/" class="btn">메인으로 돌아가기</a>
</div>
</body>
</html>
