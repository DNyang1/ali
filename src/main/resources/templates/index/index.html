<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ali Main</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/main/css/main-header.css">
    <link rel="stylesheet" href="/main/css/common.css">
    <link rel="stylesheet" href="/mypage/common/css/layout.css">
</head>

<body class="bg-slate-50 text-slate-900">

<div th:replace="layout/mainHeader :: mainHeader"></div>

<header class="bg-gradient-to-r from-teal-500 to-sky-500 text-white">
    <div class="max-w-[1200px] mx-auto px-6 py-12 text-center">

        <h1 class="text-white text-3xl font-black tracking-tight">
            ALI MARKET
        </h1>
        <p class="mt-2 text-white/80 text-sm">
            글로벌 제조업체와 연결되는 B2B 마켓
        </p>

        <form action="/products/search"
              method="get"
              class="mt-8 bg-white max-w-[760px] mx-auto
                     flex rounded-full overflow-hidden
                     shadow-xl">

            <input
                    name="keyword"
                    class="flex-1 px-6 py-4 text-slate-800
                       outline-none text-sm"
                    placeholder="여성 의류, 가방, 전자제품…">

            <button
                    class="px-8 font-extrabold text-white
                       bg-gradient-to-r from-teal-500 to-sky-500
                       hover:from-teal-600 hover:to-sky-600
                       transition">
                검색
            </button>
        </form>

    </div>
</header>


<section class="max-w-[1200px] mx-auto px-6 my-14 grid grid-cols-2 gap-8">

    <div class="bg-teal-100/70 border border-teal-200 rounded-xl p-8 shadow-sm">
        <h2 class="text-xl font-bold mb-2 text-teal-700">
            <span class="text-teal-600">Ali</span> Guaranteed
        </h2>
        <p class="text-sm text-slate-600 mb-4">
            ✔ 빠른 주문 ✔ 정시 배송 ✔ 환불 보장
        </p>

        <button class="explore-btn bg-teal-500 text-white px-6 py-2 rounded font-bold mb-6"
                data-custom="false">
            지금 살펴보기
        </button>

        <div class="grid grid-cols-4 gap-4 text-center text-sm">
            <div th:each="p : ${aliRandomProducts}">
                <img class="rounded mb-1"
                     th:src="|https://picsum.photos/seed/${p.productId}/200|">

                <div class="mt-1 text-sm font-semibold"
                     th:text="${p.productName}"></div>

                <div class="text-xs text-slate-500">무료 배송</div>
            </div>

        </div>
    </div>

    <div class="bg-sky-100/70 border border-sky-200 rounded-xl p-8 shadow-sm">
        <h2 class="text-xl font-bold mb-2 text-sky-700">
            ⚡ 빠른 커스터마이징
        </h2>
        <p class="text-sm text-slate-600 mb-4">
            ✔ 낮은 MOQ ✔ 14일 발송 ✔ 디자인 충실
        </p>

        <button class="explore-btn bg-sky-500 text-white px-6 py-2 rounded font-bold mb-6"
                data-custom="true">
            지금 살펴보기
        </button>

        <div class="grid grid-cols-4 gap-4 text-center text-sm">
            <div th:each="p : ${customRandomProducts}">
                <img class="rounded mb-1"
                     th:src="|https://picsum.photos/seed/${p.productId}/200|">

                <div class="mt-1 text-sm font-semibold"
                     th:text="${p.productName}"></div>

                <div class="text-xs text-slate-500">무료 배송</div>
            </div>

        </div>
    </div>

</section>

<section class="max-w-[1200px] mx-auto px-6 mb-20">

    <div class="bg-white rounded-2xl shadow
              grid grid-cols-[260px_1fr_300px]
              gap-6 p-6
              h-[480px]">

        <aside class="category-box bg-white border border-slate-200 rounded-xl p-4 h-[440px] flex flex-col">
            <div id="allCategoryBtn" class="flex items-center justify-between px-2 py-2 mb-3 rounded-lg cursor-pointer select-none hover:bg-slate-50 transition">
                    <span class="flex items-center gap-2">
                      <span class="grid place-items-center w-8 h-8 rounded-xl bg-teal-100 text-teal-600">📂</span>
                      고객님을 위한 카테고리
                    </span>
                <span class="text-slate-400 text-lg">›</span>
            </div>

            <ul id="categoryList" class="mt-2 space-y-1 text-[15px] overflow-y-auto pr-1">
            </ul>
        </aside>



        <main class="h-full overflow-hidden">

            <div class="category-horizontal-wrap
                flex gap-6
                overflow-x-auto
                overflow-y-hidden
                h-[420px]
                pb-4 pr-2
                items-start">

                <div th:each="entry : ${recommendByCategory}"
                     th:if="${entry.value != null and #lists.size(entry.value) > 0}"
                     class="min-w-[320px] h-[420px]
                     bg-white border rounded-2xl p-4 flex flex-col">

                    <div class="flex justify-between items-center mb-3">
                        <h4 class="font-bold text-sm"
                            th:text="${entry.key}">
                        </h4>
                        <a class="text-xs text-sky-600 hover:underline">
                            추천 더 보기
                        </a>
                    </div>

                    <div class="grid grid-cols-2 gap-3 flex-1">

                        <a th:each="p, stat : ${entry.value}"
                           th:if="${stat.index < 4}"
                           th:href="@{/products/{id}(id=${p.productId})}"
                           class="bg-slate-50 rounded-xl overflow-hidden hover:shadow">

                            <img th:src="|https://picsum.photos/seed/${p.productId}/300/200|"
                                 class="w-full h-28 object-cover">

                            <div class="px-2 py-1 text-sm font-semibold text-slate-800"
                                 th:text="${p.productName}">
                            </div>
                        </a>

                    </div>
                </div>

            </div>

        </main>

        <div class="bg-gradient-to-b from-teal-500 to-sky-500
         rounded-2xl p-8 text-white
         h-[440px] flex flex-col justify-between">


            <div>
                <h3 class="text-xl font-bold mb-2">
                    최대 <span th:text="${maxDiscountRate}">30</span>% 할인
                </h3>
                <p class="text-sm opacity-90">
                    지금 주문하고<br>한정 혜택을 받아보세요
                </p>
            </div>

            <a href="/products/list?discount=true"
               class="bg-white text-teal-600 font-bold py-3 rounded-lg text-center">
                할인 상품 보기
            </a>

        </aside>

    </div>
    </div>
</section>


<div id="allCategoryOverlay"
     class="hidden fixed inset-0 z-[9999] bg-black/40 backdrop-blur-[2px] flex items-center justify-center p-6">

    <div class="all-category-panel w-[1100px] max-w-[96vw] max-h-[82vh] bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-200">

        <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200
                bg-gradient-to-r from-teal-50 to-sky-50">
            <div class="flex items-center gap-3">
                <span class="grid place-items-center w-9 h-9 rounded-xl bg-teal-100 text-teal-600">📦</span>
                <h3 id="allCategoryTitle" class="text-lg font-extrabold text-slate-900">
                    고객님을 위한 카테고리
                </h3>
            </div>

            <button id="categoryCloseBtn"
                    class="w-10 h-10 grid place-items-center rounded-xl text-slate-500 hover:text-slate-900 hover:bg-black/5 transition">
                ✕
            </button>
        </div>

        <div class="all-category-wrap grid grid-cols-[260px_1fr] h-[520px]">

            <aside class="all-category-left border-r border-slate-200 bg-slate-50/60 p-4 overflow-y-auto">
                <ul id="allCategoryList" class="space-y-1 text-[15px]">
                </ul>
            </aside>

            <section class="all-category-right p-6 overflow-y-auto">
                <div id="allCategoryGrid" class="grid grid-cols-4 gap-3">
                </div>
            </section>

        </div>
    </div>
</div>


<div th:replace="layout/footer :: footer"></div>
<script src="/index/js/index.js"></script>

<script>
    document.querySelectorAll('.explore-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            location.href = `/products/list?custom=${btn.dataset.custom}`;
        });
    });
</script>

</body>
</html>
