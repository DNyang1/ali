<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="mypage/supplier/layout/base :: layout(~{::content}, ~{})">

    <th:block th:fragment="content">

        <div th:replace="inquiry/_detail :: inquiryDetail(${inquiry}, ${sheet})"></div>

        <div class="mt-3 space-y-2">
            <div th:if="${msg != null}"
                 class="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800"
                 th:text="${msg}"></div>

            <div th:if="${error != null}"
                 class="rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800"
                 th:text="${error}"></div>
        </div>

        <div class="my-5 h-px bg-slate-200"></div>

        <!-- 진행 중일 때만 액션 -->
        <div th:if="${inquiry.status != 2}" class="flex flex-wrap items-center gap-2">

            <form th:action="@{/inquiry/supplier/detail/{id}/cancel(id=${inquiry.inquiryId})}"
                  method="post"
                  onsubmit="return confirm('이 문의를 거절 처리하시겠습니까?');">
                <button type="submit"
                        class="rounded-xl border border-rose-200 bg-white px-4 py-2 text-sm font-bold text-rose-700 hover:bg-rose-50">
                    문의 거절
                </button>
            </form>

            <button type="button"
                    onclick="openSheetModal()"
                    th:disabled="${sheet != null and sheet.status != null and sheet.status.toString() == 'SENT'}"
                    class="rounded-xl bg-blue-600 px-4 py-2 text-sm font-bold text-white hover:bg-blue-700
                     disabled:cursor-not-allowed disabled:opacity-50">
                <span th:if="${sheet == null}">주문서 작성</span>
                <span th:if="${sheet != null and sheet.status != null and (sheet.status.toString() == 'DRAFT' or sheet.status.toString() == 'REJECTED')}">주문서 수정</span>
                <span th:if="${sheet != null and sheet.status != null and sheet.status.toString() == 'SENT'}">주문서(발송됨)</span>
            </button>

            <form th:if="${sheet != null and sheet.status != null and (sheet.status.toString() == 'DRAFT' or sheet.status.toString() == 'REJECTED')}"
                  th:action="@{/mypage/supplier/product/{pid}/custom-sheet/{sid}/send(pid=${inquiry.productId}, sid=${sheet.sheetId}, inquiryId=${inquiry.inquiryId})}"
                  method="post"
                  onsubmit="return confirm('주문서를 발송하시겠습니까? 발송 후 수정이 제한될 수 있습니다.');">
                <button type="submit"
                        class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-900 hover:bg-slate-50">
                    주문서 보내기
                </button>
            </form>

            <span th:if="${sheet != null and sheet.status != null and sheet.status.toString() == 'SENT'}"
                  class="inline-flex items-center rounded-full border border-slate-200 bg-slate-50 px-3 py-1 text-xs font-semibold text-slate-700">
        발송됨(수정 불가)
      </span>
        </div>

        <!-- 모달 (진행 중일 때만) -->
        <div th:if="${inquiry.status != 2}">
            <div id="sheetModal"
                 class="fixed inset-0 z-[9999] hidden items-center justify-center p-4"
                 style="display:none;">

                <!-- backdrop -->
                <div class="absolute inset-0 bg-black/40"></div>

                <!-- modal -->
                <div class="relative w-full max-w-[620px] rounded-2xl border border-slate-200 bg-white shadow-xl">
                    <div class="flex items-center justify-between border-b border-slate-200 px-5 py-4">
                        <h3 class="text-base font-extrabold text-slate-900">커스텀 주문서</h3>
                        <button type="button"
                                class="inline-flex h-9 w-9 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-700 hover:bg-slate-50"
                                onclick="closeSheetModal()"
                                aria-label="닫기">
                            ✕
                        </button>
                    </div>

                    <div class="p-5">
                        <div th:if="${sheet != null and sheet.status != null and sheet.status.toString() == 'SENT'}"
                             class="mb-4 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-700">
                            이미 발송된 주문서는 수정할 수 없습니다.
                        </div>

                        <form th:action="@{/mypage/supplier/product/{pid}/custom-sheet(pid=${inquiry.productId})}"
                              method="post"
                              class="space-y-4">

                            <input type="hidden" name="inquiryId" th:value="${inquiry.inquiryId}"/>
                            <input type="hidden" name="sheetId" th:value="${sheet != null ? sheet.sheetId : ''}"/>

                            <label class="block">
                                <span class="text-sm font-semibold text-slate-700">수량</span>
                                <input type="number" name="quantity" min="1" required
                                       th:value="${sheet != null ? sheet.quantity : ''}"
                                       th:disabled="${sheet != null and sheet.status != null and sheet.status.toString() == 'SENT'}"
                                       class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-blue-500
                              disabled:bg-slate-50 disabled:text-slate-500"/>
                            </label>

                            <label class="block">
                                <span class="text-sm font-semibold text-slate-700">단가</span>
                                <input type="number" name="unitPrice" min="1" required
                                       th:value="${sheet != null ? sheet.unitPrice : ''}"
                                       th:disabled="${sheet != null and sheet.status != null and sheet.status.toString() == 'SENT'}"
                                       class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-blue-500
                              disabled:bg-slate-50 disabled:text-slate-500"/>
                            </label>

                            <label class="block">
                                <span class="text-sm font-semibold text-slate-700">옵션/요청사항</span>
                                <textarea name="optionsText" rows="6" required
                                          th:disabled="${sheet != null and sheet.status != null and sheet.status.toString() == 'SENT'}"
                                          th:text="${sheet != null ? sheet.optionsText : ''}"
                                          class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-blue-500
                                 disabled:bg-slate-50 disabled:text-slate-500"></textarea>
                            </label>

                            <div class="flex justify-end gap-2 pt-2">
                                <button type="button"
                                        onclick="closeSheetModal()"
                                        class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 hover:bg-slate-50">
                                    닫기
                                </button>

                                <button type="submit"
                                        th:disabled="${sheet != null and sheet.status != null and sheet.status.toString() == 'SENT'}"
                                        class="rounded-xl bg-blue-600 px-4 py-2 text-sm font-bold text-white hover:bg-blue-700
                               disabled:cursor-not-allowed disabled:opacity-50">
                                    저장
                                </button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>

        <!-- ✅ JS는 그대로 -->
        <script>
            function openSheetModal(){
                const m = document.getElementById('sheetModal');
                if(!m) return;
                m.style.display = 'flex';
            }
            function closeSheetModal(){
                const m = document.getElementById('sheetModal');
                if(!m) return;
                m.style.display = 'none';
            }
            document.addEventListener('click', function(e){
                const m = document.getElementById('sheetModal');
                if(!m || m.style.display === 'none') return;
                if(e.target === m) closeSheetModal();
            });
            document.addEventListener('keydown', function(e){
                if(e.key === 'Escape') closeSheetModal();
            });
        </script>

    </th:block>
</th:block>
