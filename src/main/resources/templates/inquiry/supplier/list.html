<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="mypage/supplier/layout/base :: layout(~{::content}, ~{::links})">

    <th:block th:fragment="links">
        <title>받은 문의</title>
        <!-- 필요하면 css/js -->
    </th:block>

    <th:block th:fragment="content">

        <!-- Page Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">받은 문의</h1>
            <p class="mt-1 text-sm text-slate-500">구매자로부터 도착한 문의 내역입니다.</p>
        </div>

        <!-- Inquiry Card -->
        <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
            <div th:replace="inquiry/_list :: inquiryList(${inquiries}, 'supplier')"></div>
        </div>

    </th:block>

</th:block>
