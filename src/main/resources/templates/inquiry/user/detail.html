<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="mypage/user/layout/base :: layout(~{::content}, ~{::links})">

    <th:block th:fragment="links">
        <title>문의 상세</title>
        <!-- 필요하면 css/js -->
    </th:block>

    <th:block th:fragment="content">

        <!-- ✅ 공급자처럼: detail을 그대로 렌더 (추가 카드로 감싸지 않음) -->
        <div th:replace="inquiry/_detail :: inquiryDetail(${inquiry}, ${sheet})"></div>

        <!-- ✅ 공급자처럼: msg/error -->
        <div class="mt-3 space-y-2">
            <div th:if="${msg != null}"
                 class="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800"
                 th:text="${msg}"></div>

            <div th:if="${error != null}"
                 class="rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800"
                 th:text="${error}"></div>
        </div>

        <div class="my-5 h-px bg-slate-200"></div>

        <!-- ✅ 공급자처럼: 진행 중일 때만 '버튼 row' -->
        <div th:if="${inquiry.status != 2}" class="flex flex-wrap items-center gap-2">

            <!-- 결제 진행: SENT일 때만 (유저 톤 그라데이션) -->
            <button th:if="${sheet != null and sheet.status != null and sheet.status.toString() == 'SENT'}"
                    type="button"
                    th:attr="data-sheet-id=${sheet.sheetId}, data-inquiry-id=${inquiry.inquiryId}"
                    onclick="orderFromSheet(this)"
                    class="inline-flex items-center justify-center rounded-xl
                           bg-gradient-to-r from-brand-500 to-accent-500
                           px-4 py-2 text-sm font-bold text-white
                           hover:from-brand-600 hover:to-accent-600">
                결제 진행
            </button>

            <!-- 견적 거절: SENT일 때만 -->
            <form th:if="${sheet != null and sheet.status != null and sheet.status.toString() == 'SENT'}"
                  th:action="@{/inquiry/user/detail/{inquiryId}/reject(inquiryId=${inquiry.inquiryId})}"
                  method="post"
                  onsubmit="return confirm('이 견적을 거절하시겠습니까?');">
                <button type="submit"
                        class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-900 hover:bg-slate-50">
                    견적 거절
                </button>
            </form>

            <!-- 문의 취소: 항상 -->
            <form th:action="@{/inquiry/user/detail/{inquiryId}/cancel(inquiryId=${inquiry.inquiryId})}"
                  method="post"
                  th:onsubmit="${sheet != null and sheet.status != null and sheet.status.toString() == 'SENT'}
                    ? 'return confirm(&quot;이미 견적이 도착했습니다. 문의를 취소(철회)하시겠습니까?&quot;);'
                    : 'return confirm(&quot;문의(견적 요청)를 취소(철회)하시겠습니까?&quot;);'">
                <button type="submit"
                        class="rounded-xl border border-rose-200 bg-white px-4 py-2 text-sm font-bold text-rose-700 hover:bg-rose-50">
                    문의 취소
                </button>
            </form>

            <!-- 공급자처럼 상태 뱃지 -->
            <span th:if="${sheet != null and sheet.status != null and sheet.status.toString() == 'SENT'}"
                  class="inline-flex items-center rounded-full border border-slate-200 bg-slate-50 px-3 py-1 text-xs font-semibold text-slate-700">
                견적 도착(결제 가능)
            </span>
        </div>

        <!-- ✅ 기존 결제 JS 유지 (SENT일 때만 포함) -->
        <th:block th:if="${sheet != null and sheet.status != null and sheet.status.toString() == 'SENT'}">
            <script th:inline="javascript">
                async function orderFromSheet(btn) {
                    const sheetId = btn.dataset.sheetId;
                    const inquiryId = btn.dataset.inquiryId;

                    const items = [{
                        skuId: /*[[${sheet.skuId}]]*/ '',
                        quantity: /*[[${sheet.quantity}]]*/ 0
                    }];

                    if (!items[0].skuId || items[0].quantity <= 0) {
                        alert('견적 정보가 올바르지 않습니다.');
                        return;
                    }

                    const res = await fetch(`/inquiry/user/${inquiryId}/pay-start`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sheetId: Number(sheetId) })
                    });

                    if (!res.ok) {
                        alert('결제 준비에 실패했습니다.');
                        return;
                    }

                    sessionStorage.setItem('checkoutSheetId', String(sheetId));
                    localStorage.setItem('checkoutItems', JSON.stringify(items));
                    location.href = '/order/checkout';
                }
            </script>
        </th:block>

    </th:block>
</th:block>
