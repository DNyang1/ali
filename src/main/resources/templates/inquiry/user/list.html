<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="mypage/user/layout/base :: layout(~{::content}, ~{::links})">

    <th:block th:fragment="links">
        <title>내 문의</title>
        <!-- 필요하면 css/js -->
    </th:block>

    <th:block th:fragment="content">

        <!-- Page Header (받은 문의와 동일 틀) -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">내 문의</h1>
            <p class="mt-1 text-sm text-slate-500">구매자로서 작성한 문의 내역입니다.</p>
        </div>

        <!-- Card -->
        <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
            <div th:replace="inquiry/_list :: inquiryList(${inquiries}, 'user')"></div>
        </div>

    </th:block>

</th:block>
