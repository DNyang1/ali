<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="inquiryDetail(inq, sheet)">

  <!-- 헤더 -->
  <section class="mb-5">
    <h2 class="text-xl font-extrabold text-slate-900">문의 상세</h2>
    <p class="mt-1 text-sm text-slate-500">문의 내용과 주문서(견적) 상태를 확인하세요.</p>
  </section>

  <!-- 문의 요약 카드 -->
  <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
    <div class="flex items-start justify-between gap-4">
      <div>
        <div class="text-xs font-semibold text-slate-500">문의번호</div>
        <div class="mt-1 text-lg font-bold text-slate-900" th:text="${inq.inquiryId}">-</div>
      </div>

      <!-- 상태 뱃지 -->
      <div class="flex flex-col items-end gap-2">
        <span class="inline-flex rounded-full bg-slate-100 px-2 py-1 text-xs font-semibold text-slate-700"
              th:if="${inq.status == 0}">답변대기</span>
        <span class="inline-flex rounded-full bg-blue-50 px-2 py-1 text-xs font-semibold text-blue-700"
              th:if="${inq.status == 1}">진행중</span>
        <span class="inline-flex rounded-full bg-emerald-50 px-2 py-1 text-xs font-semibold text-emerald-700"
              th:if="${inq.status == 2}">종료</span>

        <div class="text-xs text-slate-500">
          작성일: <span th:text="${inq.createdAt}">-</span>
        </div>
      </div>
    </div>

    <div class="mt-4 grid grid-cols-1 gap-3 md:grid-cols-2">
      <div class="rounded-xl border border-slate-100 p-4">
        <div class="text-xs font-semibold text-slate-500">상품ID</div>
        <div class="mt-1 text-sm font-semibold text-slate-900" th:text="${inq.productId}">-</div>
      </div>

      <div class="rounded-xl border border-slate-100 p-4">
        <div class="text-xs font-semibold text-slate-500">상태</div>
        <div class="mt-1 text-sm font-semibold text-slate-900">
          <span th:if="${inq.status == 0}">답변대기</span>
          <span th:if="${inq.status == 1}">진행중</span>
          <span th:if="${inq.status == 2}">종료</span>
        </div>
      </div>
    </div>
  </section>

  <!-- 문의 내용 -->
  <section class="mt-5 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
    <header class="flex items-center justify-between">
      <h3 class="text-base font-bold text-slate-900">문의 내용</h3>
      <span class="text-xs text-slate-500">원문 그대로 표시</span>
    </header>

    <pre class="mt-3 whitespace-pre-wrap rounded-xl border border-slate-100 bg-slate-50 p-4 text-sm text-slate-800"
         th:text="${inq.content}">-</pre>
  </section>

  <!-- 주문서(견적) -->
  <section class="mt-5 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
    <header class="flex items-center justify-between">
      <h3 class="text-base font-bold text-slate-900">주문서(견적) 정보</h3>
      <span class="text-xs text-slate-500" th:if="${sheet != null}">
        상태: <b class="text-slate-700" th:text="${sheet.status}">-</b>
      </span>
    </header>

    <div th:if="${sheet == null}" class="mt-3 rounded-xl border border-slate-100 bg-slate-50 p-4 text-sm text-slate-600">
      아직 주문서가 없습니다.
    </div>

    <div th:if="${sheet != null}" class="mt-4 grid grid-cols-1 gap-3 md:grid-cols-2">
      <div class="rounded-xl border border-slate-100 p-4">
        <div class="text-xs font-semibold text-slate-500">주문서 ID</div>
        <div class="mt-1 text-sm font-semibold text-slate-900" th:text="${sheet.sheetId}">-</div>
      </div>

      <div class="rounded-xl border border-slate-100 p-4">
        <div class="text-xs font-semibold text-slate-500">SKU ID</div>
        <div class="mt-1 text-sm font-semibold text-slate-900" th:text="${sheet.skuId}">-</div>
      </div>

      <div class="rounded-xl border border-slate-100 p-4">
        <div class="text-xs font-semibold text-slate-500">수량</div>
        <div class="mt-1 text-sm font-semibold text-slate-900" th:text="${sheet.quantity}">-</div>
      </div>

      <div class="rounded-xl border border-slate-100 p-4">
        <div class="text-xs font-semibold text-slate-500">단가</div>
        <div class="mt-1 text-sm font-semibold text-slate-900" th:text="${sheet.unitPrice}">-</div>
      </div>

      <div class="md:col-span-2 rounded-xl border border-slate-100 p-4">
        <div class="text-xs font-semibold text-slate-500">옵션/요청사항</div>
        <pre class="mt-2 whitespace-pre-wrap rounded-xl border border-slate-100 bg-slate-50 p-4 text-sm text-slate-800"
             th:text="${sheet.optionsText}">-</pre>
      </div>
    </div>
  </section>

  <!-- 종료 안내(상태 메시지) -->
  <section th:if="${inq.status == 2}" class="mt-5 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
    <h3 class="text-base font-bold text-slate-900">처리 결과</h3>

    <div class="mt-3 rounded-xl border border-slate-100 bg-slate-50 p-4 text-sm text-slate-700">
      <span th:if="${sheet != null and sheet.status != null and sheet.status.toString() == 'CANCELLED'}">
        문의가 취소 되었습니다.
      </span>
      <span th:if="${sheet != null and sheet.status != null and sheet.status.toString() == 'PAID'}">
        결제가 완료되었습니다.
      </span>
      <span th:if="${sheet != null and sheet.status != null and sheet.status.toString() == 'REJECTED'}">
        견적이 거절되었습니다.
      </span>

      <span th:if="${sheet == null or sheet.status == null
                    or !(sheet.status.toString() == 'CANCELLED'
                         or sheet.status.toString() == 'PAID'
                         or sheet.status.toString() == 'REJECTED')}">
        문의가 종료되었습니다.
      </span>
    </div>
  </section>

</div>

</body>
</html>
