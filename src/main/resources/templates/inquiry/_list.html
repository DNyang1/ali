<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="inquiryList(inquiries, mode)"
     th:attr="data-mode=${mode}"
     id="inquiry-root">

  <!-- Title -->
  <div class="flex items-end justify-between gap-3">
    <h2 class="text-xl font-semibold tracking-tight"
        th:text="${mode == 'supplier' ? '받은 문의' : '내 문의'}">문의 목록</h2>

    <!-- optional: count -->
    <div class="text-sm text-slate-500"
         th:if="${inquiries != null}"
         th:text="|총 ${#lists.size(inquiries)}건|">총 0건</div>
  </div>

  <!-- Empty -->
  <div th:if="${#lists.isEmpty(inquiries)}"
       class="mt-4 rounded-xl border border-slate-200 bg-white p-6 text-sm text-slate-500">
    문의가 없습니다.
  </div>

  <!-- Table -->
  <div th:if="${!#lists.isEmpty(inquiries)}"
       class="mt-4 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
    <div class="overflow-x-auto">
      <table id="inquiry-table" class="min-w-full text-sm">
        <thead class="bg-slate-50">
        <tr class="text-left text-slate-600">
          <th class="whitespace-nowrap px-4 py-3 font-medium">번호</th>
          <th class="whitespace-nowrap px-4 py-3 font-medium">상품ID</th>
          <th class="px-4 py-3 font-medium">내용</th>
          <th class="whitespace-nowrap px-4 py-3 font-medium">상태</th>
          <th class="whitespace-nowrap px-4 py-3 font-medium">작성일</th>
          <th class="whitespace-nowrap px-4 py-3 font-medium">상세</th>
        </tr>
        </thead>

        <tbody class="divide-y divide-slate-100">
        <tr th:each="inq : ${inquiries}" class="hover:bg-slate-50/60">
          <td class="whitespace-nowrap px-4 py-3 text-slate-900"
              th:text="${inq.inquiryId}">1</td>

          <td class="whitespace-nowrap px-4 py-3 text-slate-900"
              th:text="${inq.productId}">10</td>

          <td class="px-4 py-3 text-slate-700">
            <span th:text="${#strings.abbreviate(inq.content, 30)}">내용...</span>
          </td>

          <!-- status badge -->
          <td class="whitespace-nowrap px-4 py-3">
            <span th:if="${inq.status == 0}"
                  class="inline-flex items-center rounded-full bg-amber-50 px-2.5 py-1 text-xs font-medium text-amber-700 ring-1 ring-inset ring-amber-200">
              답변대기
            </span>
            <span th:if="${inq.status == 1}"
                  class="inline-flex items-center rounded-full bg-blue-50 px-2.5 py-1 text-xs font-medium text-blue-700 ring-1 ring-inset ring-blue-200">
              진행중
            </span>
            <span th:if="${inq.status == 2}"
                  class="inline-flex items-center rounded-full bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-700 ring-1 ring-inset ring-slate-200">
              종료
            </span>
          </td>

          <td class="whitespace-nowrap px-4 py-3 text-slate-600"
              th:text="${inq.createdAt}">2026-01-07</td>

          <td class="whitespace-nowrap px-4 py-3">
            <a th:if="${mode == 'user'}"
               th:href="@{/inquiry/user/detail/{id}(id=${inq.inquiryId})}"
               class="inline-flex items-center rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-50">
              보기
            </a>

            <a th:if="${mode == 'supplier'}"
               th:href="@{/inquiry/supplier/detail/{id}(id=${inq.inquiryId})}"
               class="inline-flex items-center rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-50">
              보기
            </a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="inquiry-pager" class="mt-6 flex justify-center"
       th:if="${!#lists.isEmpty(inquiries)}"></div>

  <!-- ✅ 중요: script를 fragment 안으로 넣어야 th:replace로 같이 포함됨 -->
  <script>
    const ROOT = document.getElementById('inquiry-root');
    const MODE = ROOT?.dataset.mode || 'supplier';
    (function () {
      const PAGE_SIZE = 10;

      const table = document.getElementById('inquiry-table');
      const pagerHost = document.getElementById('inquiry-pager');

      if (!table || !pagerHost) return;

      const tbody = table.querySelector('tbody');
      if (!tbody) return;

      const rows = Array.from(tbody.querySelectorAll('tr'));
      if (rows.length === 0) {
        pagerHost.innerHTML = '';
        return;
      }

      const qs = new URLSearchParams(location.search);
      const page = Math.max(1, parseInt(qs.get('page') || '1', 10) || 1);
      const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
      const safePage = Math.min(page, totalPages);

      renderPage(safePage);
      renderPager(safePage, totalPages);

      if (safePage !== page) {
        const next = new URLSearchParams(location.search);
        next.set('page', String(safePage));
        history.replaceState(null, '', `${location.pathname}?${next.toString()}`);
      }

      function renderPage(p) {
        const start = (p - 1) * PAGE_SIZE;
        const end = start + PAGE_SIZE;
        rows.forEach((tr, idx) => tr.style.display = (idx >= start && idx < end) ? '' : 'none');
      }

      function renderPager(p, total) {
        pagerHost.innerHTML = '';
        if (total <= 1) return;

        const wrap = document.createElement('div');
        wrap.className = 'flex flex-wrap items-center justify-center gap-2';

        const makeHref = (nextPage) => {
          const next = new URLSearchParams(location.search);
          next.set('page', String(nextPage)); // ✅ 기존 파라미터 유지
          return `${location.pathname}?${next.toString()}`;
        };

        if (p > 1) wrap.appendChild(btn('이전', makeHref(p - 1), false));

        const windowSize = 7;
        let start = Math.max(1, p - Math.floor(windowSize / 2));
        let end = Math.min(total, start + windowSize - 1);
        start = Math.max(1, end - windowSize + 1);

        if (start > 1) {
          wrap.appendChild(btn('1', makeHref(1), p === 1));
          if (start > 2) wrap.appendChild(dots());
        }

        for (let i = start; i <= end; i++) {
          wrap.appendChild(btn(String(i), makeHref(i), i === p));
        }

        if (end < total) {
          if (end < total - 1) wrap.appendChild(dots());
          wrap.appendChild(btn(String(total), makeHref(total), p === total));
        }

        if (p < total) wrap.appendChild(btn('다음', makeHref(p + 1), false));

        pagerHost.appendChild(wrap);
      }

      function btn(text, href, active) {
        const a = document.createElement('a');
        a.href = href;
        a.textContent = text;

        // supplier (기존 유지)
        const supplierNormal =
                'rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm font-semibold text-slate-700 hover:bg-slate-50';

        const supplierActive =
                'rounded-lg border border-blue-600 bg-blue-600 px-3 py-1.5 text-sm font-semibold text-white hover:bg-blue-600';

        // user (마이페이지 그라데이션)
        const userNormal =
                'rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-sm font-semibold text-slate-700 hover:bg-slate-50';

        const userActive =
                'rounded-xl text-white text-sm font-semibold px-3 py-1.5 ' +
                'bg-gradient-to-r from-brand-500 to-accent-500 hover:from-brand-600 hover:to-accent-600';

        const isUser = MODE === 'user';

        if (isUser) {
          a.className = active ? userActive : userNormal;
        } else {
          a.className = active ? supplierActive : supplierNormal;
        }

        return a;
      }

      function dots() {
        const s = document.createElement('span');
        s.textContent = '...';
        s.className = 'px-2 text-sm text-slate-400';
        return s;
      }
    })();
  </script>

</div>

</body>
</html>
