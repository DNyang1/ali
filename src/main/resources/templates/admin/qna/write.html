<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::section}, ~{::link})}">
<head>
  <link rel="stylesheet" href="/admin/css/qna.css"/>
</head>
<body>
<section>
  <h2>문의 작성</h2>

  <div class="form-container">
    <form th:action="@{/qna/write}" method="post">
      <div class="form-group">
        <label for="title">제목</label>
        <input type="text" id="title" name="title" required placeholder="제목을 입력하세요">
      </div>

      <div class="form-group">
        <label for="content">내용</label>
        <textarea id="content" name="content" rows="10" required placeholder="문의 내용을 자세히 적어주세요"></textarea>
      </div>

      <div class="btn-group">
        <a th:href="@{/qna/list}" class="btn-secondary">취소</a>
        <button type="submit" class="btn-primary">등록하기</button>
      </div>
    </form>
  </div>
</section>
</body>
</html>
