<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::section}, ~{::head/link})}">
<head>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="/admin/css/supplierList.css" />
</head>
<body>
<section>
    <div class="page-header">
        <h2>🏪 판매자 입점 신청 관리</h2>
        <span class="badge-count" th:text="${suppliers.size()} + '건 대기중'">0건 대기중</span>
    </div>

    <div th:if="${suppliers.isEmpty()}" class="empty-state">
        <span class="material-icons-outlined">inbox</span>
        <p>현재 대기 중인 입점 신청이 없습니다.</p>
    </div>

    <div class="supplier-grid" th:unless="${suppliers.isEmpty()}">
        <div class="supplier-card" th:each="supplier : ${suppliers}">
            <div class="card-header">
                <div class="icon-box">
                    <span class="material-icons-outlined">store</span>
                </div>
                <div class="title-box">
                    <h3 th:text="${supplier.cpName}">업체명</h3>
                    <span class="apply-date" th:text="${#temporals.format(supplier.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</span>
                </div>
            </div>

            <div class="card-body">
                <div class="info-row">
                    <span class="label">신청자 ID</span>
                    <span class="value" th:text="${supplier.userId}">user123</span>
                </div>
                <div class="info-row" th:if="${supplier.cpNumber}">
                    <span class="label">사업자번호</span>
                    <span class="value" th:text="${supplier.cpNumber}">000-00-00000</span>
                </div>
            </div>

            <div class="card-actions">
                <form th:action="@{/admin/supplier/approve}" method="post">
                    <input type="hidden" name="supplierId" th:value="${supplier.supplierId}">
                    <input type="hidden" name="userId" th:value="${supplier.userId}">
                    <button type="submit" class="btn-approve">
                        <span class="material-icons-outlined">check_circle</span> 승인
                    </button>
                </form>

                <button type="button" class="btn-reject"
                        th:data-id="${supplier.supplierId}"
                        onclick="openRejectModal(this.getAttribute('data-id'))">
                    <span class="material-icons-outlined">cancel</span> 반려
                </button>
            </div>
        </div>
    </div>

    <div id="rejectModal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h3>⛔ 입점 반려 사유 입력</h3>
            <p>해당 업체의 승인을 거절하는 이유를 입력해주세요.</p>

            <form th:action="@{/admin/supplier/reject}" method="post">
                <input type="hidden" id="modalSupplierId" name="supplierId">

                <textarea name="memo" placeholder="예: 사업자 등록증 식별 불가, 필수 서류 누락 등" required></textarea>

                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeRejectModal()">취소</button>
                    <button type="submit" class="btn-danger">반려 확정</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openRejectModal(supplierId) {
            document.getElementById('modalSupplierId').value = supplierId;
            document.getElementById('rejectModal').style.display = 'flex';
        }
        function closeRejectModal() {
            document.getElementById('rejectModal').style.display = 'none';
        }
        // 모달 바깥 배경 클릭 시 닫기
        window.onclick = function(event) {
            const modal = document.getElementById('rejectModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</section>
</body>
</html>
