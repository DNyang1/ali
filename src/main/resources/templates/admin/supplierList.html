<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::section}, ~{::head/style})}">
<head>
    <link rel="stylesheet" href="/admin/css/adminpage.css"/>
    <style>
        /* 기존 테이블 스타일 그대로 유지 */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; }
        th { background-color: #f4f4f4; }
        .approve-btn { background-color: #4CAF50; color: white; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
<section>
    <h2>판매자 입점 신청 대기 목록</h2>
    <table>
        <thead>
        <tr>
            <th>신청일</th>
            <th>업체명</th>
            <th>승인처리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="supplier : ${suppliers}">
            <td th:text="${#temporals.format(supplier.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${supplier.cpName}"></td>
            <td>
                <form th:action="@{/admin/supplier/approve}" method="post">
                    <input type="hidden" name="supplierId" th:value="${supplier.supplierId}">
                    <input type="hidden" name="userId" th:value="${supplier.userId}">
                    <button type="submit" class="approve-btn">승인</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
