<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::section}, ~{::link})}">
<head>
  <link rel="stylesheet" href="/admin/css/userList.css"/>
</head>
<body>
<section>
  <h2>전체 회원 관리</h2>

  <div class="search-container">
    <form action="/admin/users" method="get" style="display: flex; gap: 10px;">
      <select name="role" class="search-select">
        <option value="">전체 권한</option>
        <option value="ROLE_USER" th:selected="${searchDTO.role == 'ROLE_USER'}">일반 회원</option>
        <option value="ROLE_SUPPLIER" th:selected="${searchDTO.role == 'ROLE_SUPPLIER'}">판매자</option>
        <option value="ROLE_ADMIN" th:selected="${searchDTO.role == 'ROLE_ADMIN'}">관리자</option>
      </select>

      <select name="status" class="search-select">
        <option value="">전체 상태</option>
        <option value="ACTIVE" th:selected="${searchDTO.status == 'ACTIVE'}">활동중</option>
        <option value="SUSPENDED" th:selected="${searchDTO.status == 'SUSPENDED'}">정지됨</option>
      </select>

      <input type="text" name="keyword" class="search-input" placeholder="ID 또는 이름 검색"
             th:value="${searchDTO.keyword}">

      <button type="submit" class="btn-search">검색</button>
      <a href="/admin/users" class="btn-reset">초기화</a>
    </form>
  </div>

  <table class="table">
    <thead>
    <tr>
      <th>가입일</th>
      <th>아이디</th>
      <th>이름</th>
      <th>현재 권한</th>
      <th>계정 상태</th>
      <th>관리</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${users == null or users.isEmpty()}">
      <td colspan="6" style="text-align: center; padding: 30px;">
        조건에 맞는 회원이 없습니다.
      </td>
    </tr>

    <tr th:each="user : ${users}">
      <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}"></td>
      <td th:text="${user.userId}" style="font-weight:bold;"></td>
      <td th:text="${user.name}"></td>

      <td>
        <form th:action="@{/admin/users/role}" method="post">
          <input type="hidden" name="userId" th:value="${user.userId}">
          <select name="role" onchange="this.form.submit()" class="role-select"
                  th:classappend="${user.roles != null and user.roles.contains('ROLE_ADMIN') ? 'admin-role' : (user.roles != null and user.roles.contains('ROLE_SUPPLIER') ? 'supplier-role' : '')}">
            <option value="ROLE_USER"
                    th:selected="${user.roles != null and user.roles.contains('ROLE_USER') and !user.roles.contains('ROLE_SUPPLIER') and !user.roles.contains('ROLE_ADMIN')}">
              일반 회원
            </option>
            <option value="ROLE_SUPPLIER"
                    th:selected="${user.roles != null and user.roles.contains('ROLE_SUPPLIER') and !user.roles.contains('ROLE_ADMIN')}">
              판매자
            </option>
            <option value="ROLE_ADMIN"
                    th:selected="${user.roles != null and user.roles.contains('ROLE_ADMIN')}">
              관리자
            </option>
          </select>
        </form>
      </td>

      <td>
        <div th:if="${user.status == 'ACTIVE'}">
          <span class="badge active">활동중</span>
        </div>
        <div th:if="${user.status == 'SUSPENDED'}">
          <span class="badge suspended">정지됨</span>
          <div style="font-size: 11px; color: red; margin-top: 4px;"
               th:text="${user.suspensionReason}"></div>
        </div>
      </td>

      <td>
        <form th:if="${user.status == 'ACTIVE'}"
              th:action="@{/admin/users/status}" method="post"
              style="display:inline;"
              onsubmit="return promptReason(this);">
          <input type="hidden" name="userId" th:value="${user.userId}">
          <input type="hidden" name="status" value="SUSPENDED">
          <input type="hidden" name="reason" id="reasonInput">
          <button type="submit" class="btn-suspend">정지</button>
        </form>

        <form th:if="${user.status == 'SUSPENDED'}"
              th:action="@{/admin/users/status}" method="post"
              style="display:inline;">
          <input type="hidden" name="userId" th:value="${user.userId}">
          <button type="submit" name="status" value="ACTIVE" class="btn-activate">해제</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <script>
    function promptReason(form) {
      const reason = prompt("정지 사유를 입력해주세요:");
      if (reason === null) return false; // 취소
      if (reason.trim() === "") {
        alert("사유를 반드시 입력해야 합니다.");
        return false;
      }
      form.reason.value = reason;
      return true;
    }
  </script>
</section>
</body>
</html>
