<header th:fragment="mainHeader"
        class="sticky top-0 z-40 w-full border-b border-slate-200 bg-white/90 backdrop-blur">

    <div class="mx-auto flex max-w-[1400px] items-center justify-between px-4 py-3 lg:px-6">

        <div class="flex items-center gap-4">
            <a th:href="@{/}"
               class="text-xl font-black tracking-tight text-teal-600 hover:text-sky-600 transition">
                ALI
            </a>
        </div>

        <div class="flex items-center gap-2 text-sm">

            <div th:if="${session.loginUser == null}" class="flex items-center gap-2">
                <a th:href="@{/user/login}"
                   class="font-semibold text-slate-600 hover:text-teal-600 transition">
                    로그인
                </a>

                <a th:href="@{/user/register}"
                   class="rounded-lg bg-gradient-to-r from-teal-500 to-sky-500 px-4 py-1.5 font-semibold text-white hover:from-teal-600 hover:to-sky-600 transition">
                    회원가입
                </a>
            </div>

            <div th:if="${session.loginUser != null}" class="flex items-center gap-2">

                <a th:href="@{/cart}"
                   class="inline-flex items-center gap-1 rounded-full border border-teal-200 bg-white px-3 py-1.5 font-semibold text-teal-700 hover:bg-teal-50 transition">
                    장바구니
                </a>

                <a th:href="@{/chat/messages-user}"
                   class="inline-flex items-center gap-1 rounded-full border border-sky-200 bg-white px-3 py-1.5 font-semibold text-sky-700 hover:bg-sky-50 transition">
                    채팅
                    <span id="headerUnreadCount"
                          class="rounded-full bg-emerald-100 px-2 py-0.5 text-xs text-emerald-700"
                          th:text="${unreadChatCount} ?: 0">0</span>
                </a>

                <a th:href="@{/mypage/user/dashboard}"
                   class="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white px-3 py-1.5 font-semibold text-slate-700 hover:bg-slate-50 transition">
                    마이페이지
                </a>

                <img th:src="${session.loginUser.profileImg != null ? session.loginUser.profileImg : '/images/default.png'}"
                     class="h-7 w-7 rounded-full object-cover border border-slate-200"
                     alt="profile">

                <span class="text-sm font-bold text-slate-800"
                      th:text="${session.loginUser.name + '님'}">홍길동님</span>

                <a th:href="@{/user/logout}"
                   class="font-semibold text-rose-600 hover:text-rose-700 transition">
                    로그아웃
                </a>
            </div>
        </div>
    </div>
</header>
