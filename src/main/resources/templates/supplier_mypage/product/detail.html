<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${pageTitle}">상품 상세</title>
  <link rel="stylesheet" href="/supplier_mypage/css/layout.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" th:replace="supplier_mypage/partials/sidebar :: sidebar"></aside>
  <div class="main">
    <header class="topbar" th:replace="supplier_mypage/partials/topbar :: topbar"></header>

    <main class="content">
      <section class="panel">
        <header class="panel-head">
          <h2 class="panel-title">상품 상세</h2>
          <div>
            <a class="panel-link" th:href="@{/supplier_mypage/product/{id}/edit(id=${product.productId})}">수정</a>
            <span> | </span>
            <a class="panel-link" href="/supplier_mypage/product">목록</a>
          </div>
          <a class="panel-link"
             th:href="@{/supplier_mypage/product/{id}/option(id=${product.productId})}">
            옵션 관리
          </a>
          <span> | </span>
          <a class="panel-link"
             th:href="@{/supplier_mypage/product/{id}/sku(id=${product.productId})}">
            SKU 관리
          </a>

        </header>

        <div class="panel-body">
          <p><b>ID</b> : <span th:text="${product.productId}">1</span></p>
          <p><b>카테고리 ID</b> : <span th:text="${product.categoryId}">CAT-001</span></p>
          <p><b>상품명</b> : <span th:text="${product.productName}">상품명</span></p>
          <p><b>MOQ</b> : <span th:text="${product.moq}">0</span></p>
          <p><b>커스터마이즈</b> :
            <span th:text="${product.isCustomizable == 1 ? '가능' : '불가'}">가능</span>
          </p>
          <p><b>설명</b></p>
          <pre th:text="${product.description}">설명</pre>
        </div>
      </section>
    </main>
  </div>
</div>
</body>
</html>
