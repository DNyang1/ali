<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${pageTitle}">상품 관리</title>
    <link rel="stylesheet" href="/supplier_mypage/css/layout.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar" th:replace="supplier_mypage/partials/sidebar :: sidebar"></aside>
    <div class="main">
        <header class="topbar" th:replace="supplier_mypage/partials/topbar :: topbar"></header>

        <main class="content">
            <section class="panel">
                <header class="panel-head">
                    <h2 class="panel-title">상품 목록</h2>
                    <a class="panel-link" href="/supplier_mypage/product/new">상품 등록</a>
                </header>

                <div class="panel-body">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>상품명</th>
                            <th>MOQ</th>
                            <th>커스터마이즈</th>
                            <th>상태</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="4">등록된 상품이 없습니다.</td>
                        </tr>

                        <tr th:each="p : ${products}">
                            <td th:text="${p != null ? p.productId : '-'}">1</td>

                            <td>
                                <a th:if="${p != null}"
                                   th:href="@{/supplier_mypage/product/{id}(id=${p.productId})}"
                                   th:text="${p.productName}">상품명</a>
                                <span th:if="${p == null}">-</span>
                            </td>

                            <td th:text="${p != null ? p.moq : '-'}">0</td>
                            <td th:text="${p != null ? (p.isCustomizable == 1 ? '가능' : '불가') : '-'}">가능</td>

                            <td>
                                <span th:text="${p.status}">ACTIVE</span>

                                <form th:action="@{/supplier_mypage/product/{id}/toggle(id=${p.productId})}"
                                      method="post"
                                      style="display:inline; margin-left:8px;">
                                    <button type="submit"
                                            th:text="${p.status == 'ACTIVE' ? '비활성화' : '활성화'}">
                                        비활성화
                                    </button>
                                </form>
                            </td>


                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
