<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.productName}">상품 상세</title>
    <link rel="stylesheet" th:href="@{/products/css/products_detail.css}">
    <link rel="stylesheet" href="/main/css/main-header.css">
    <link rel="stylesheet" href="/main/css/common.css">

</head>
<body>
<div th:replace="layout/mainHeader :: mainHeader"></div>

<nav class="breadcrumb">
    <a href="/">홈</a> &gt;
    <a href="/products/list">상품</a> &gt;
    <span th:text="${product.productName}"></span>
</nav>

<h1 class="product-title" th:text="${product.productName}"></h1>

<div class="product-detail-container">

    <div class="product-images">
        <img class="main-image" th:src="@{|https://picsum.photos/300?random=${product.productId}|}" alt="상품 이미지">
    </div>

    <div class="product-info">

        <div th:if="${product.discountType != null}"
             class="time-sale-box"
             th:data-type="${product.discountType}"
             th:data-value="${product.discountValue}">

            <span class="time-sale-badge">⏰ 타임딜</span>

            <span class="time-sale-discount"
                  th:text="${product.discountType == 'RATE'
                ? product.discountValue + '% 할인'
                : product.discountValue + '원 할인'}">
        </span>

            <span class="time-sale-countdown"
                  th:data-end-at="${product.eventEndAt}">
        </span>
        </div>

        <div class="price-box">
            <div id="mainPriceTiers" class="main-price-tiers"></div>
            <p class="moq">MOQ: <span th:text="${product.moq}"></span> 개</p>
        </div>

        <div class="sku-selected-box">
            <div class="sku-all-list" id="mainSkuList">
            </div>
        </div>



        <div class="custom">
            <span th:if="${product.isCustomizable == 1}" class="custom-yes">
            </span>
            <span th:if="${product.isCustomizable == 0}" class="custom-no">
            </span>
        </div>

        <div class="action-buttons">
            <th:block th:if="${product.isCustomizable == 0}">
                <button class="btn order" id="openOrderModal">주문 시작</button>
                <button class="btn cart" id="openCartModal">장바구니</button>
            </th:block>

            <th:block th:if="${product.isCustomizable == 1}">
                <button class="btn inquiry"
                        th:onclick="|location.href='/inquiry/create?productId=${product.productId}'|">
                    문의 전송
                </button>
            </th:block>

            <button class="btn chat"
                    th:data-product-id="${product.productId}">
                채팅하기
            </button>
        </div>

    </div>
</div>

<th:block th:if="${product.isCustomizable == 0}">
    <div class="modal-overlay" id="orderModalOverlay"></div>

    <div class="order-modal" id="orderModal">

        <button class="modal-close" id="closeOrderModal">✕</button>
        <h3 class="modal-title">옵션 및 수량을 선택하세요</h3>

        <div class="moq-text">
            최소 주문 수량: <strong th:text="${product.moq}">1</strong> 개
        </div>

        <div class="price-tier-box">
            <h4 class="price-tier-title">가격 구간</h4>
            <ul id="priceTiers" class="price-tier-list"></ul>
        </div>

        <div id="skuList" class="sku-list">
        </div>

        <div class="order-summary">
            <div>
                총 수량 :
                <strong id="totalQty">0</strong>
            </div>
            <div>
                총 금액 :
                <strong id="totalPrice">0원</strong>
            </div>
        </div>

        <button class="modal-submit" id="submitOrder">주문 시작</button>
        <button class="modal-submit" id="submitCart">장바구니 담기</button>
    </div>
</th:block>

<script th:inline="javascript">
    window.SKUS = /*[[${skusJson}]]*/ [];
    window.DEFAULT_PRICE_RULES = /*[[${defaultPriceRulesJson}]]*/ [];
    window.MOQ = /*[[${product.moq}]]*/ 1;
    window.PRODUCT_ID = /*[[${product.productId}]]*/ 0;

    console.log('HTML SKUS 👉', window.SKUS);
    console.log('HTML PRICE RULES 👉', window.DEFAULT_PRICE_RULES);
</script>

<script th:src="@{/products/js/products_detail.js}"></script>

</body>
</html>
