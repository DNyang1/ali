<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>장바구니</title>
    <style>
        body { margin:0; background:#f5f5f5; font-family:Arial,sans-serif; }
        .page { max-width:900px; margin:0 auto; padding:0 16px; }
        .card { background:#fff; border-radius:14px; padding:24px; box-shadow:0 6px 24px rgba(0,0,0,.08); margin-bottom:24px; }
        h2 { margin:0 0 20px; font-size:22px; }
        .cart-item { display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid #eee; font-size:14px; }
        .cart-item:last-child { border-bottom:none; }
        .cart-info { display:flex; flex-direction:column; gap:6px; }
        .cart-actions button { background:none; border:none; color:#ff4d4f; cursor:pointer; font-size:13px; }
        .actions { text-align:right; margin-top:24px; }
        .actions button { background:linear-gradient(135deg,#ff6a00,#ff8a00); border:none; color:#fff; padding:12px 26px; border-radius:26px; font-size:15px; cursor:pointer; }
        .dev-panel { background:#fafafa; border:1px dashed #ccc; border-radius:12px; padding:16px; }
        .dev-panel input { padding:6px 8px; margin-right:6px; font-size:13px; }
    </style>
    <link rel="stylesheet" href="/main/css/main-header.css">
    <link rel="stylesheet" href="/main/css/common.css">
</head>
<body>
<div th:replace="layout/mainHeader :: mainHeader"></div>
<div class="page">

    <section class="card">
        <h2>🛒 내 장바구니</h2>
        <div id="cart-items"></div>

        <div class="actions">
                <button onclick="goCheckout()">결제하기</button>
        </div>
    </section>

    <section class="dev-panel">
        <h3>⚙ 개발용: 임시 상품 추가</h3>
        <input type="text" id="productName" placeholder="productName">
        <input type="text" id="skuId" placeholder="skuId">
        <input type="number" id="quantity" value="1" min="1">
        <button onclick="addItem()">추가</button>
    </section>

</div>

<script>
    function loadCart() {
        fetch('/api/cart/view')
            .then(res => res.json())
            .then(renderCart);
    }

    function renderCart(cart) {
        const container = document.getElementById('cart-items');
        container.innerHTML = '';

        if (!cart.items || cart.items.length === 0) {
            container.innerHTML = '<p>장바구니가 비어 있습니다.</p>';
            return;
        }

        cart.items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'cart-item';

            div.innerHTML = `
            <div class="cart-info">
                <label>
                    <input type="checkbox"
                           class="cart-check"
                           data-sku-id="${item.skuId}"
                           data-quantity="${item.quantity}">
                    <strong>${item.productName}</strong>
                </label>
                <span>옵션: ${item.optionSummary ?? '-'}</span>
                <span>수량: ${item.quantity}</span>
                <span>${item.lineAmount} 원</span>
            </div>
            <div class="cart-actions">
                <button onclick="deleteItem('${item.cartItemId}')">삭제</button>
            </div>
        `;
            container.appendChild(div);
        });
    }

    function addItem() {
        fetch('/api/cart/items', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                productId: productId.value,
                skuId: skuId.value,
                quantity: quantity.value
            })
        }).then(loadCart);
    }

    function deleteItem(id) {
        fetch(`/api/cart/items/${id}`, { method: 'DELETE' })
            .then(loadCart);
    }

    function goCheckout() {
        const selected = [];

        document.querySelectorAll('.cart-check:checked')
            .forEach(cb => {
                selected.push({
                    skuId: cb.dataset.skuId,
                    quantity: Number(cb.dataset.quantity)
                });
            });

        if (selected.length === 0) {
            alert('결제할 상품을 선택해주세요.');
            return;
        }

        localStorage.setItem('checkoutItems', JSON.stringify(selected));
        location.href = '/order/checkout';
    }

    loadCart();
</script>

</body>
</html>
