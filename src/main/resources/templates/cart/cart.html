<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MODERN-ALI | 장바구니</title>
    <link rel="stylesheet" href="/main/css/main-header.css">
    <link rel="stylesheet" href="/main/css/common.css">
    <link rel="stylesheet" href="/cart/css/cart.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div th:replace="layout/mainHeader :: mainHeader"></div>

<div class="cart-container">
    <div class="cart-header">🛒 &nbsp;My Cart</div>

    <div id="cart-items-container">
        <!-- 장바구니 아이템이 여기에 동적으로 추가됩니다. -->
    </div>

    <div class="checkout-btn-container">
        <button class="checkout-btn" onclick="goCheckout()">주문하기</button>
    </div>
</div>


<script>
    function loadCart() {
        fetch('/api/cart/view')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(renderCart)
            .catch(error => {
                console.error('Error loading cart:', error);
                const container = document.getElementById('cart-items-container');
                container.innerHTML = '<div class="cart-empty-message">장바구니 정보를 불러오는 데 실패했습니다.</div>';
            });
    }

    function renderCart(cart) {
        const container = document.getElementById('cart-items-container');
        container.innerHTML = '';

        if (!cart.items || cart.items.length === 0) {
            container.innerHTML = '<div class="cart-empty-message">장바구니가 비어 있습니다.</div>';
            return;
        }

        const itemGrid = document.createElement('div');
        itemGrid.className = 'cart-item-grid';

        cart.items.forEach(item => {
            const itemElement = document.createElement('div');
            itemElement.className = 'cart-item';
            itemElement.innerHTML = `
                <input type="checkbox" class="cart-check" data-item-id="${item.cartItemId}" data-price="${item.lineAmount}" data-sku-id="${item.skuId}" data-quantity="${item.quantity}">
                <div class="item-details">
                    <span class="item-name">${item.productName}</span>
                    <span class="item-option">옵션: ${item.optionSummary || '-'}</span>
                    <span class="item-quantity">수량: ${item.quantity}개</span>
                    <span class="item-price">${Number(item.lineAmount).toLocaleString()} 원</span>
                </div>
                <div class="item-actions">
                    <button class="delete-btn" onclick="deleteItem('${item.cartItemId}')">삭제</button>
                </div>
            `;
            itemGrid.appendChild(itemElement);
        });

        container.appendChild(itemGrid);

        document.querySelectorAll('.cart-check').forEach(cb => cb.checked = true);
    }

    function deleteItem(cartItemId) {
        if (!confirm('상품을 삭제하시겠습니까?')) return;

        fetch(`/api/cart/items/${cartItemId}`, { method: 'DELETE' })
            .then(response => {
                if (response.ok) {
                    loadCart();
                } else {
                    alert('삭제에 실패했습니다.');
                }
            });
    }

    function goCheckout() {
        const selected = [];

        document.querySelectorAll('.cart-check:checked')
            .forEach(cb => {
                selected.push({
                    skuId: cb.dataset.skuId,
                    quantity: Number(cb.dataset.quantity)
                });
            });

        if (selected.length === 0) {
            alert('결제할 상품을 선택해주세요.');
            return;
        }

        localStorage.setItem('checkoutItems', JSON.stringify(selected));
        location.href = '/order/checkout';
    }

    loadCart();
</script>

</body>
</html>
