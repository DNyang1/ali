<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>공급자 정보 수정</title></head>
<body>
<h2>공급자 정보 수정</h2>
<form id="updateForm">
    상호명: <input type="text" id="cpName" th:value="${supplier.cpName}"><br>
    사업자번호: <input type="text" id="cpNumber" th:value="${supplier.cpNumber}"><br>
    전화번호: <input type="text" id="cpPhone" th:value="${supplier.cpPhone}"><br>
    주소: <input type="text" id="cpAddress" th:value="${supplier.cpAddress}"><br>
    <button type="button" onclick="updateInfo()">수정 완료</button>
    <a href="#" onclick="history.back(); return false;">취소</a>
</form>

<script>
    function updateInfo() {
        const data = {
            cpName: document.getElementById('cpName').value,
            cpNumber: document.getElementById('cpNumber').value,
            cpPhone: document.getElementById('cpPhone').value,
            cpAddress: document.getElementById('cpAddress').value
        };

        fetch('/supplier/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(res => {
            if(res.ok) {
                alert("수정되었습니다.");
                location.href = "/supplier/s_setting";
            }
        });
    }
</script>
</body>
</html>
