<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="mypage/supplier/layout/base :: layout(~{::body}, ~{::head/link})">
<head>
  <meta charset="UTF-8">
  <title>공급자 정보 설정</title>
  <link rel="stylesheet" href="/user/css/s_setting.css"/>
</head>
<body>
<div class="setting-container">
  <h1 class="page-title">회사 정보 설정</h1>

  <div class="menu-box">
    <h3 class="box-title">사업자 등록 정보</h3>

    <div class="info-content" th:if="${supplier != null}">
      <div class="text-info-section">
        <div class="info-row">
          <span class="label">상호명</span>
          <span class="value" th:text="${supplier.cpName}">ALI 컴퍼니</span>
        </div>
        <div class="info-row">
          <span class="label">사업자 번호</span>
          <span class="value" th:text="${supplier.cpNumber}">000-00-00000</span>
        </div>
        <div class="info-row">
          <span class="label">업체 연락처</span>
          <span class="value" th:text="${supplier.cpPhone}">02-1234-5678</span>
        </div>
        <div class="info-row">
          <span class="label">사업장 소재지</span>
          <span class="value" th:text="${supplier.cpAddress}">서울특별시 강남구...</span>
        </div>
      </div>
    </div>

    <div class="action-buttons">
      <a th:href="@{/supplier/s_update}" class="btn btn-supplier">공급자 정보 수정</a>
    </div>
  </div>
</div>
</body>
</html>
