<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ALI | 주문 완료</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/main/css/main-header.css">
    <link rel="stylesheet" href="/main/css/common.css">
    <link rel="stylesheet" href="/mypage/common/css/layout.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-900">
<div class="pointer-events-none fixed inset-0">
    <div class="absolute -top-24 left-1/2 h-72 w-[520px] -translate-x-1/2 rounded-full bg-gradient-to-r from-teal-200/60 to-sky-200/60 blur-3xl"></div>
    <div class="absolute -bottom-24 left-1/3 h-72 w-[520px] -translate-x-1/2 rounded-full bg-gradient-to-r from-sky-200/40 to-teal-200/40 blur-3xl"></div>
</div>
<div th:replace="layout/mainHeader :: mainHeader"></div>

<main class="max-w-2xl mx-auto px-6 py-16 text-center">
    <div class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-lg p-8 md:p-12 border border-slate-100">
        <div class="w-24 h-24 bg-teal-100 rounded-full flex items-center justify-center mx-auto">
            <i class="fas fa-check text-5xl text-teal-600"></i>
        </div>

        <h1 class="text-3xl font-extrabold text-slate-800 mt-6">결제가 완료되었습니다!</h1>

        <p class="mt-3 text-slate-600">
            주문이 정상적으로 접수되었습니다.<br>
            언제나 저희 Ali를 이용해주셔서 감사합니다.
        </p>

        <div class="mt-8 text-left max-w-md mx-auto bg-slate-50 rounded-lg p-6 border border-slate-200 space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-slate-500">주문번호</span>
                <strong class="text-slate-900 font-mono" th:text="${orderId}">ORD-000000</strong>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-slate-500">주문 상태</span>
                <strong class="text-teal-600 font-semibold">결제 완료</strong>
            </div>
            <div class="border-t border-slate-300 pt-3 mt-3 flex justify-between items-center">
                <span class="text-slate-500">총 결제 금액</span>
                <strong id="final-total-amount" class="text-xl font-extrabold text-teal-600">0 원</strong>
            </div>
        </div>

        <!-- UI/UX 개선 제안: 주문 상품 요약 -->
        <div id="order-summary-container" class="mt-8 border-t pt-8 text-left">
            <h3 class="text-lg font-bold mb-4 text-slate-700">주문 상품</h3>
            <div id="order-item-list" class="space-y-4">
                <!-- 로딩 스피너 또는 메시지 -->
                <div class="py-8 text-center text-slate-500">주문 정보를 불러오는 중...</div>
            </div>
        </div>

        <div class="mt-12 flex flex-col sm:flex-row justify-center gap-4">
            <a href="/" class="w-full sm:w-auto inline-flex items-center justify-center rounded-xl px-6 py-3 text-base font-bold border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 transition shadow-sm">
                쇼핑 계속하기
            </a>
            <a href="/mypage/user/order" class="w-full sm:w-auto inline-flex items-center justify-center rounded-xl px-6 py-3 text-base font-extrabold bg-gradient-to-r from-teal-500 to-sky-500 text-white shadow-lg transition hover:from-teal-600 hover:to-sky-600 active:scale-[0.99]">
                내 주문내역 보기
            </a>
        </div>
    </div>
</main>
<div th:replace="layout/footer :: footer"></div>
<script th:inline="javascript">
    /*<![CDATA[*/
    const orderId = /*[[${orderId}]]*/ 'ORD-000000';
    /*]]>*/

    document.addEventListener('DOMContentLoaded', () => {
        const itemListContainer = document.getElementById('order-item-list');
        const finalTotalAmountEl = document.getElementById('final-total-amount');

        if (!orderId) {
            itemListContainer.innerHTML = '<div class="p-4 bg-red-50 text-red-700 rounded-md text-center text-sm">주문 ID를 찾을 수 없습니다.</div>';
            if (finalTotalAmountEl) finalTotalAmountEl.innerText = 'N/A';
            return;
        }

        fetch(`/api/order/${orderId}/detail`)
            .then(response => {
                if (!response.ok) {
                    throw new Error('주문 정보를 불러오는 데 실패했습니다.');
                }
                return response.json();
            })
            .then(data => {
                itemListContainer.innerHTML = ''; // 로딩 메시지 제거
                if (!data.items || data.items.length === 0) {
                    itemListContainer.innerHTML = '<div class="p-4 bg-slate-50 rounded-md text-center text-slate-500 text-sm">주문한 상품이 없습니다.</div>';
                    if (finalTotalAmountEl) finalTotalAmountEl.innerText = '0 원';
                    return;
                }

                data.items.forEach(item => {
                    const itemElement = document.createElement('div');
                    itemElement.className = 'flex items-center gap-4 py-4 border-b last:border-b-0';
                    itemElement.innerHTML = `
                        <div class="w-16 h-16 bg-slate-100 rounded-md overflow-hidden flex-shrink-0">
                             <img src="https://picsum.photos/seed/${item.skuId}/200" alt="${item.productName}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1">
                            <div class="font-bold text-slate-800">${item.productName}</div>
                            <div class="text-sm text-slate-500 mt-1">${item.optionSummary} / ${item.quantity}개</div>
                        </div>
                        <div class="font-semibold text-right">${item.lineAmount.toLocaleString()}원</div>
                    `;
                    itemListContainer.appendChild(itemElement);
                });
                
                // 최종 결제 금액 업데이트
                if (finalTotalAmountEl) {
                    finalTotalAmountEl.innerText = `${data.totalAmount.toLocaleString()} 원`;
                }
            })
            .catch(error => {
                console.error('Error fetching order details:', error);
                itemListContainer.innerHTML = `<div class="p-4 bg-red-50 text-red-700 rounded-md text-center text-sm">${error.message}</div>`;
                if (finalTotalAmountEl) finalTotalAmountEl.innerText = '로딩 실패';
            });
    });
</script>

</body>
</html>
