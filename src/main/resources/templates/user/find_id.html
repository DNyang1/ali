<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>아이디 찾기 - ALI</title>

  <!-- Tailwind (DEV용: CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">

<!-- Background Accent (User entry mood: teal/sky) -->
<div class="pointer-events-none fixed inset-0">
  <div class="absolute -top-24 left-1/2 h-72 w-[520px] -translate-x-1/2 rounded-full bg-gradient-to-r from-teal-200/60 to-sky-200/60 blur-3xl"></div>
  <div class="absolute -bottom-24 left-1/3 h-72 w-[520px] -translate-x-1/2 rounded-full bg-gradient-to-r from-sky-200/40 to-teal-200/40 blur-3xl"></div>
</div>

<main class="relative mx-auto flex min-h-screen max-w-[1100px] items-center justify-center px-4 py-10">
  <section class="w-full max-w-md">

    <div class="rounded-2xl border border-slate-200 bg-white/90 shadow-sm backdrop-blur">
      <!-- Header -->
      <div class="border-b border-slate-100 px-6 py-6 text-center">
        <a href="/" class="inline-flex items-center justify-center gap-2">
          <span class="text-2xl font-black tracking-tight text-teal-600">ALI</span>
          <span class="rounded-full bg-gradient-to-r from-teal-500 to-sky-500 px-2 py-0.5 text-xs font-bold text-white">
              Find ID
            </span>
        </a>
        <h1 class="mt-3 text-xl font-extrabold text-slate-900">아이디 찾기</h1>
        <p class="mt-1 text-sm text-slate-500">본인확인 정보를 입력해 주세요.</p>
      </div>

      <div class="px-6 py-6 space-y-4">

        <!-- Tabs -->
        <div class="grid grid-cols-2 gap-2">
          <button id="tab-phone" type="button"
                  class="auth-tab active rounded-xl border px-4 py-3 text-sm font-extrabold transition"
                  onclick="selectTab('phone')">
            전화번호로 찾기
          </button>

          <button id="tab-email" type="button"
                  class="auth-tab rounded-xl border px-4 py-3 text-sm font-extrabold transition"
                  onclick="selectTab('email')">
            이메일로 찾기
          </button>
        </div>

        <input type="hidden" id="findIdType" value="phone">

        <!-- Form -->
        <div class="space-y-3">
          <input type="text" id="findIdName" placeholder="이름 입력" required
                 class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-800
                          placeholder:text-slate-400 outline-none transition
                          focus:border-teal-300 focus:ring-4 focus:ring-teal-100"/>

          <input type="text" id="findIdValue" placeholder="전화번호 입력 (- 제외)" required
                 class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-800
                          placeholder:text-slate-400 outline-none transition
                          focus:border-sky-300 focus:ring-4 focus:ring-sky-100"/>
        </div>

        <!-- Submit -->
        <button type="button" class="w-full rounded-xl bg-gradient-to-r from-teal-500 to-sky-500 px-4 py-3
                                       text-sm font-extrabold text-white shadow-sm transition
                                       hover:from-teal-600 hover:to-sky-600 active:scale-[0.99]"
                onclick="handleFindId()">
          아이디 찾기
        </button>

        <!-- Result -->
        <div id="findIdResult" class="hidden rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">
          <!-- JS가 채움 -->
        </div>

        <!-- Link -->
        <div class="pt-1 text-center">
          <a href="/user/login" class="text-sm font-bold text-slate-600 hover:text-slate-900 hover:underline">
            로그인으로 돌아가기
          </a>
        </div>
      </div>
    </div>

    <p class="mt-4 text-center text-xs text-slate-400">
      입력 정보가 정확해야 아이디를 찾을 수 있어요.
    </p>
  </section>
</main>

<script>
  function applyTabStyles(type) {
    const phone = document.getElementById('tab-phone');
    const email = document.getElementById('tab-email');

    const base =
            'auth-tab rounded-xl border px-4 py-3 text-sm font-extrabold transition ';

    const active =
            'active border-teal-200 bg-gradient-to-r from-teal-50 to-sky-50 text-slate-900 shadow-sm';

    const inactive =
            'border-slate-200 bg-white text-slate-500 hover:bg-slate-50';

    if (type === 'phone') {
      phone.className = base + active;
      email.className = base + inactive;
    } else {
      email.className = base + active;
      phone.className = base + inactive;
    }
  }

  applyTabStyles('phone');

  function selectTab(type) {
    document.getElementById('findIdType').value = type;
    document.getElementById('tab-phone').classList.toggle('active', type === 'phone');
    document.getElementById('tab-email').classList.toggle('active', type === 'email');

    applyTabStyles(type);

    const valInput = document.getElementById('findIdValue');
    valInput.placeholder = (type === 'phone') ? "전화번호 입력 (- 제외)" : "가입 시 등록한 이메일 입력";
    valInput.value = "";
  }

  async function handleFindId() {
    const name = document.getElementById('findIdName').value;
    const type = document.getElementById('findIdType').value;
    const value = document.getElementById('findIdValue').value;
    const resultDiv = document.getElementById('findIdResult');

    if(!name || !value) {
      alert("정보를 모두 입력해주세요.");
      return;
    }

    const response = await fetch('/user/find_id', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, type, value })
    });

    resultDiv.classList.remove('hidden');

    if (response.ok) {
      const maskedId = await response.text();
      resultDiv.innerHTML =
              `정보와 일치하는 아이디를 찾았습니다:<br>
         <strong class="block mt-2 text-xl font-extrabold text-teal-600">${maskedId}</strong>`;
      resultDiv.className =
              'mt-2 rounded-xl border border-teal-200 bg-teal-50 px-4 py-3 text-sm text-slate-800';
    } else {
      resultDiv.innerHTML =
              `<span class="font-bold text-rose-600">일치하는 사용자 정보를 찾을 수 없습니다.</span>`;
      resultDiv.className =
              'mt-2 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-slate-800';
    }
  }
</script>
</body>
</html>
