<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판매자 등록 - ALI</title>
    <link rel="stylesheet" href="/user/css/register.css"/>
</head>
<body>
<div class="container">
    <h2>판매자 등록</h2>
    <p style="text-align: center; color: #666; font-size: 14px; margin-bottom: 30px;">
        공급자 서비스를 이용하기 위해<br>사업자 정보를 입력해 주세요.<br>ex)124-81-00998
    </p>

    <form id="supplierForm">
        <div class="input-group">
            <input type="text" id="cpName" placeholder="상호명 (Company Name)" required>
        </div>

        <div class="input-group" style="display: flex; gap: 10px;">
            <input type="text" id="cpNumber" placeholder="사업자 등록번호 (숫자만 입력)" required style="flex: 1;">
            <button type="button" onclick="requestBizVerify()" style="width: 100px; padding: 10px; font-size: 13px; background-color: #555;">번호인증</button>
        </div>

        <div id="bizAuthSection" class="input-group" style="display: none; margin-top: 10px; border: 1px dashed #ddd; padding: 10px;">
            <p style="font-size: 12px; color: #333; margin-bottom: 5px;">인증번호 입력</p>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="bizAuthCode" placeholder="6자리 숫자" style="flex: 1;">
                <button type="button" onclick="confirmBizCode()" style="width: 80px; padding: 8px; font-size: 12px; background-color: #28a745;">확인</button>
            </div>
        </div>

        <div class="input-group">
            <input type="text" id="cpPhone" placeholder="업체 전화번호" required>
        </div>

        <div class="input-group">
            <input type="text" id="cpAddress" placeholder="업체 주소" required>
        </div>

        <button type="button" onclick="registerSupplier()">판매자 등록하기</button>

        <div class="link-group">
            <a href="#" onclick="history.back(); return false;">이전 페이지로 돌아가기</a>
        </div>
    </form>
</div>

<script src="/user/js/supplier_register.js"></script>
</body>
</html>
