<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판매자 등록 - ALI</title>
    <link rel="stylesheet" href="/user/css/register.css"/>
</head>
<body>
<div class="container">
    <h2>판매자 등록</h2>
    <p style="text-align: center; color: #666; font-size: 14px; margin-bottom: 30px;">
        공급자 서비스를 이용하기 위해<br>사업자 정보를 입력해 주세요.
    </p>

    <form id="supplierForm">
        <div class="input-group">
            <input type="text" id="cpName" placeholder="상호명 (Company Name)" required>
        </div>

        <div class="input-group">
            <input type="text" id="cpNumber" placeholder="사업자 등록번호 (숫자만 입력)" required>
        </div>

        <div class="input-group">
            <input type="text" id="cpPhone" placeholder="업체 전화번호" required>
        </div>

        <div class="input-group">
            <input type="text" id="cpAddress" placeholder="업체 주소" required>
        </div>

        <button type="button" onclick="registerSupplier()">판매자 등록하기</button>

        <div class="link-group">
            <a href="#" onclick="history.back(); return false;">이전 페이지로 돌아가기</a>
        </div>
    </form>
</div>

<script src="/user/js/supplier_register.js"></script>
</body>
</html>
