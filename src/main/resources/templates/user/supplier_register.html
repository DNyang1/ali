<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판매자 등록 - ALI</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">

<div class="pointer-events-none fixed inset-0">
    <div class="absolute -top-28 left-1/2 h-80 w-[560px] -translate-x-1/2 rounded-full bg-blue-200/50 blur-3xl"></div>
    <div class="absolute -bottom-28 left-1/3 h-80 w-[560px] -translate-x-1/2 rounded-full bg-indigo-200/40 blur-3xl"></div>
</div>

<main class="relative mx-auto flex min-h-screen max-w-[1200px] items-center justify-center px-4 py-10">
    <section class="w-full max-w-lg">

        <div class="rounded-2xl border border-slate-200 bg-white/90 shadow-sm backdrop-blur">
            <div class="border-b border-slate-100 px-6 py-6">
                <div class="flex items-center justify-between">
                    <a href="/" class="text-xl font-black tracking-tight text-blue-600 hover:opacity-80">ALI</a>
                    <span class="rounded-full bg-blue-50 px-3 py-1 text-xs font-extrabold text-blue-700 border border-blue-100">
              SUPPLIER
            </span>
                </div>

                <h1 class="mt-4 text-2xl font-extrabold text-slate-900">판매자 등록</h1>
                <p class="mt-2 text-sm text-slate-600 leading-relaxed">
                    공급자 서비스를 이용하기 위해 사업자 정보를 입력해 주세요.<br>
                    <span class="font-semibold text-slate-700">ex) 124-81-00998</span>
                </p>
            </div>

            <form id="supplierForm" class="px-6 py-6 space-y-4">

                <div>
                    <label class="mb-1 block text-xs font-semibold text-slate-600" for="cpName">상호명</label>
                    <input type="text" id="cpName" placeholder="상호명 (Company Name)" required
                           class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-800
                     placeholder:text-slate-400 outline-none transition
                     focus:border-blue-300 focus:ring-4 focus:ring-blue-100"/>
                </div>

                <div>
                    <label class="mb-1 block text-xs font-semibold text-slate-600" for="cpNumber">사업자 등록번호</label>

                    <div class="flex gap-2">
                        <input type="text" id="cpNumber" placeholder="사업자 등록번호 (숫자만 입력)" required
                               class="flex-1 rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-800
                       placeholder:text-slate-400 outline-none transition
                       focus:border-blue-300 focus:ring-4 focus:ring-blue-100"/>

                        <button type="button" onclick="requestBizVerify()"
                                class="shrink-0 rounded-xl bg-slate-900 px-4 py-3 text-sm font-extrabold text-white
                       hover:bg-slate-800 transition">
                            번호인증
                        </button>
                    </div>
                </div>

                <div id="bizAuthSection"
                     style="display:none;"
                     class="rounded-xl border border-dashed border-slate-300 bg-slate-50 px-4 py-3">
                    <p class="text-xs font-bold text-slate-700 mb-2">인증번호 입력</p>

                    <div class="flex gap-2">
                        <input type="text" id="bizAuthCode" placeholder="6자리 숫자"
                               class="flex-1 rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-800
                       placeholder:text-slate-400 outline-none transition
                       focus:border-emerald-300 focus:ring-4 focus:ring-emerald-100"/>

                        <button type="button" onclick="confirmBizCode()"
                                class="shrink-0 rounded-xl bg-emerald-500 px-4 py-3 text-sm font-extrabold text-white
                       hover:bg-emerald-600 transition">
                            확인
                        </button>
                    </div>
                </div>

                <div>
                    <label class="mb-1 block text-xs font-semibold text-slate-600" for="cpPhone">업체 전화번호</label>
                    <input type="text" id="cpPhone" placeholder="업체 전화번호" required
                           class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-800
                     placeholder:text-slate-400 outline-none transition
                     focus:border-blue-300 focus:ring-4 focus:ring-blue-100"/>
                </div>

                <div>
                    <label class="mb-1 block text-xs font-semibold text-slate-600" for="cpAddress">업체 주소</label>
                    <input type="text" id="cpAddress" placeholder="업체 주소" required
                           class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-800
                     placeholder:text-slate-400 outline-none transition
                     focus:border-blue-300 focus:ring-4 focus:ring-blue-100"/>
                </div>

                <button type="button" onclick="registerSupplier()"
                        class="w-full rounded-xl bg-blue-600 px-4 py-3 text-sm font-extrabold text-white
                   hover:bg-blue-700 transition shadow-sm active:scale-[0.99]">
                    판매자 등록하기
                </button>

                <div class="pt-2 text-center">
                    <a href="#" onclick="history.back(); return false;"
                       class="text-sm font-bold text-slate-600 hover:text-slate-900 hover:underline">
                        이전 페이지로 돌아가기
                    </a>
                </div>

            </form>
        </div>

        <p class="mt-4 text-center text-xs text-slate-400">
            공급자 등록은 정확한 사업자 정보가 필요합니다.
        </p>

    </section>
</main>

<script src="/user/js/supplier_register.js"></script>
</body>
</html>
