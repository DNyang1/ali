<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="stylesheet" href="/user/css/register.css"/>
  <meta charset="UTF-8">
  <title>회원가입 - 전체 입력</title>
</head>
<body>
<h2>회원가입</h2>
<input type="text" id="userId" placeholder="아이디 (user_id)"><br>
<input type="password" id="password" placeholder="비밀번호 (password)"><br>
<input type="text" id="name" placeholder="이름 (name)"><br>
<input type="email" id="email" placeholder="이메일 (email)"><br>
<input type="text" id="phone" placeholder="전화번호 (phone)"><br>
<input type="text" id="birth" placeholder="생년월일 (birth: YYYYMMDD)"><br>
<input type="text" id="address" placeholder="주소 (address)"><br>
<button onclick="signup()">가입하기</button>


<script src="/user/js/register.js"></script>
</body>
</html>
