<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 - ALI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">

<div class="pointer-events-none fixed inset-0">
  <div class="absolute -top-24 left-1/2 h-72 w-[520px] -translate-x-1/2 rounded-full bg-gradient-to-r from-teal-200/60 to-sky-200/60 blur-3xl"></div>
  <div class="absolute -bottom-24 left-1/3 h-72 w-[520px] -translate-x-1/2 rounded-full bg-gradient-to-r from-sky-200/40 to-teal-200/40 blur-3xl"></div>
</div>

<main class="relative mx-auto flex min-h-screen max-w-[1100px] items-center justify-center px-4 py-10">
  <section class="w-full max-w-md">

    <div class="rounded-2xl border border-slate-200 bg-white/90 shadow-sm backdrop-blur">

      <div class="border-b border-slate-100 px-6 py-6 text-center">
        <a href="/" class="inline-flex items-center justify-center gap-2">
          <span class="text-2xl font-black tracking-tight text-teal-600">ALI</span>
          <span class="rounded-full bg-gradient-to-r from-teal-500 to-sky-500 px-2 py-0.5 text-xs font-bold text-white">
            Join
          </span>
        </a>
        <p class="mt-2 text-sm text-slate-500">필수 정보를 입력하고 가입을 완료하세요.</p>
      </div>

      <div class="px-6 py-6 space-y-4">

        <input id="userId" placeholder="아이디"
               class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm font-semibold
                 placeholder:text-slate-400 focus:border-teal-300 focus:ring-4 focus:ring-teal-100 outline-none"/>

        <input id="password" type="password" placeholder="비밀번호"
               class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm font-semibold
                 placeholder:text-slate-400 focus:border-sky-300 focus:ring-4 focus:ring-sky-100 outline-none"/>

        <input id="name" placeholder="이름"
               class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm font-semibold
                 placeholder:text-slate-400 focus:border-teal-300 focus:ring-4 focus:ring-teal-100 outline-none"/>

        <div class="flex gap-2">
          <input id="email" type="email" placeholder="이메일"
                 class="flex-1 rounded-xl border border-slate-200 px-4 py-3 text-sm font-semibold
                   placeholder:text-slate-400 focus:border-teal-300 focus:ring-4 focus:ring-teal-100 outline-none"/>
          <button onclick="sendAuthCode()"
                  class="rounded-xl bg-teal-500 px-4 text-sm font-bold text-white hover:bg-teal-600 transition">
            인증받기
          </button>
        </div>

        <div id="authCodeSection" class="hidden space-y-2">
          <div class="flex gap-2">
            <input id="authCode" placeholder="인증번호 6자리"
                   class="flex-1 rounded-xl border border-slate-200 px-4 py-3 text-sm font-semibold
                     placeholder:text-slate-400 focus:border-sky-300 focus:ring-4 focus:ring-sky-100 outline-none"/>
            <button onclick="verifyAuthCode()"
                    class="rounded-xl bg-sky-500 px-4 text-sm font-bold text-white hover:bg-sky-600 transition">
              확인
            </button>
          </div>
          <small id="authTimer" class="block text-xs font-bold text-rose-500"></small>
        </div>

        <input id="phone" placeholder="전화번호 (- 제외)"
               class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm font-semibold
                 placeholder:text-slate-400 focus:border-teal-300 focus:ring-4 focus:ring-teal-100 outline-none"/>

        <input id="birth" placeholder="생년월일 (8자리)"
               class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm font-semibold
                 placeholder:text-slate-400 focus:border-sky-300 focus:ring-4 focus:ring-sky-100 outline-none"/>

        <input id="address" placeholder="주소"
               class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm font-semibold
                 placeholder:text-slate-400 focus:border-teal-300 focus:ring-4 focus:ring-teal-100 outline-none"/>

        <button id="signupBtn" onclick="signup()" disabled
                class="w-full rounded-xl bg-gradient-to-r from-teal-500 to-sky-500 px-4 py-3 text-sm font-extrabold text-white
                 opacity-50 enabled:opacity-100 enabled:hover:from-teal-600 enabled:hover:to-sky-600 transition">
          가입하기
        </button>

        <div class="pt-2 text-center">
          <a href="#" onclick="history.back();" class="text-sm font-bold text-slate-600 hover:underline">
            이전으로 돌아가기
          </a>
        </div>
      </div>
    </div>

  </section>
</main>

<script src="/user/js/register.js"></script>
</body>
</html>
