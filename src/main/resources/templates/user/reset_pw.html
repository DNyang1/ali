<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>비밀번호 찾기 - ALI</title>
  <link rel="stylesheet" href="/user/css/auth_find.css"/>
</head>
<body>
<div class="auth-container">
  <h2 class="auth-title">비밀번호 찾기</h2>
  <p class="auth-desc">
    가입하신 아이디와 이메일 주소를 입력하시면<br>비밀번호 재설정 링크를 보내드립니다.
  </p>

  <div class="input-group">
    <input type="text" id="userId" placeholder="아이디">
  </div>
  <div class="input-group">
    <input type="email" id="email" placeholder="이메일 주소">
  </div>

  <button type="button" class="auth-btn" onclick="sendResetLink()">재설정 링크 받기</button>

  <div class="link-group">
    <a href="/user/login">로그인 화면으로 돌아가기</a>
  </div>
</div>

<script>
  function sendResetLink() {
    const userId = document.getElementById('userId').value;
    const email = document.getElementById('email').value;

    if(!userId || !email) {
      alert("아이디와 이메일을 모두 입력해주세요.");
      return;
    }

    fetch('/user/send_reset_link', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: userId, email: email })
    }).then(res => {
      if(res.ok) {
        alert("입력하신 이메일로 재설정 링크가 전송되었습니다. 메일함을 확인해주세요.");
        location.href = "/user/login";
      } else {
        alert("일치하는 사용자 정보가 없습니다.");
      }
    });
  }
</script>
</body>
</html>
