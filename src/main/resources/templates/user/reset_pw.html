<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>비밀번호 찾기</title>
</head>
<body>
<h2>비밀번호 재설정 링크 발송</h2>

<div>
  <p>가입하신 아이디와 이메일 주소를 입력하시면 비밀번호 재설정 링크를 보내드립니다.</p>
  <input type="text" id="userId" placeholder="아이디"><br>
  <input type="email" id="email" placeholder="이메일"><br>
  <button onclick="sendResetLink()">재설정 링크 받기</button>
</div>

<br>
<a href="/user/login">로그인 화면으로 돌아가기</a>

<script>
  function sendResetLink() {
    const userId = document.getElementById('userId').value;
    const email = document.getElementById('email').value;

    if(!userId || !email) {
      alert("아이디와 이메일을 모두 입력해주세요.");
      return;
    }

    // 1. 사용자에게 즉시 알림을 보여줌 (기업용 방식)
    alert("입력하신 이메일로 재설정 링크가 전송되었습니다. 메일함을 확인해주세요.");

    // 2. 대기 없이 즉시 로그인 페이지로 이동
    location.href = "/user/login";

    // 3. 서버 호출은 뒤에서 따로 수행 (백엔드가 @Async라면 0.1초 만에 요청 접수 완료)
    fetch('/user/send_reset_link', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: userId, email: email })
    }).then(response => {
      if (!response.ok) {
        console.error("발송 요청 중 서버 오류 발생");
      }
    });
  }
</script>
</body>
</html>
