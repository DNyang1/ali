<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 찾기 - ALI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">

<div class="pointer-events-none fixed inset-0">
  <div class="absolute -top-24 left-1/2 h-72 w-[520px] -translate-x-1/2 rounded-full bg-gradient-to-r from-teal-200/60 to-sky-200/60 blur-3xl"></div>
  <div class="absolute -bottom-24 left-1/3 h-72 w-[520px] -translate-x-1/2 rounded-full bg-gradient-to-r from-sky-200/40 to-teal-200/40 blur-3xl"></div>
</div>

<main class="relative mx-auto flex min-h-screen max-w-[1100px] items-center justify-center px-4 py-10">
  <section class="w-full max-w-md">

    <div class="rounded-2xl border border-slate-200 bg-white/90 shadow-sm backdrop-blur">
      <div class="border-b border-slate-100 px-6 py-6 text-center">
        <a href="/" class="inline-flex items-center justify-center gap-2">
          <span class="text-2xl font-black tracking-tight text-teal-600">ALI</span>
          <span class="rounded-full bg-gradient-to-r from-teal-500 to-sky-500 px-2 py-0.5 text-xs font-bold text-white">
              Reset
            </span>
        </a>
        <h1 class="mt-3 text-xl font-extrabold text-slate-900">비밀번호 찾기</h1>
        <p class="mt-1 text-sm text-slate-500">
          가입하신 아이디와 이메일 주소를 입력하시면<br>
          비밀번호 재설정 링크를 보내드립니다.
        </p>
      </div>

      <div class="px-6 py-6 space-y-4">

        <input type="text" id="userId" placeholder="아이디"
               class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-800
                        placeholder:text-slate-400 outline-none transition
                        focus:border-teal-300 focus:ring-4 focus:ring-teal-100"/>

        <input type="email" id="email" placeholder="이메일 주소"
               class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-800
                        placeholder:text-slate-400 outline-none transition
                        focus:border-sky-300 focus:ring-4 focus:ring-sky-100"/>

        <button type="button" onclick="sendResetLink()"
                class="w-full rounded-xl bg-gradient-to-r from-teal-500 to-sky-500 px-4 py-3
                         text-sm font-extrabold text-white shadow-sm transition
                         hover:from-teal-600 hover:to-sky-600 active:scale-[0.99]">
          재설정 링크 받기
        </button>

        <div class="pt-1 text-center">
          <a href="/user/login" class="text-sm font-bold text-slate-600 hover:text-slate-900 hover:underline">
            로그인 화면으로 돌아가기
          </a>
        </div>
      </div>
    </div>

    <p class="mt-4 text-center text-xs text-slate-400">
      이메일이 도착하지 않으면 스팸함을 확인해 주세요.
    </p>
  </section>
</main>

<script src="/user/js/reset_pw.js"></script>
</body>
</html>
