<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>비밀번호 찾기</title>
</head>
<body>
<h2>비밀번호 재설정 링크 발송</h2>

<div>
  <p>가입하신 아이디와 이메일 주소를 입력하시면 비밀번호 재설정 링크를 보내드립니다.</p>
  <input type="text" id="userId" placeholder="아이디"><br>
  <input type="email" id="email" placeholder="이메일"><br>
  <button onclick="sendResetLink()">재설정 링크 받기</button>
</div>

<br>
<a href="/user/login">로그인 화면으로 돌아가기</a>

<script>
  async function sendResetLink() {
    const userId = document.getElementById('userId').value;
    const email = document.getElementById('email').value;

    if(!userId || !email) {
      alert("아이디와 이메일을 모두 입력해주세요.");
      return;
    }

    // UserController의 @PostMapping("/send_reset_link") 호출
    const response = await fetch('/user/send_reset_link', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: userId, email: email })
    });

    if (response.ok) {
      alert("입력하신 이메일로 재설정 링크가 전송되었습니다. 메일함을 확인해주세요.");
      location.href = "/user/login";
    } else {
      alert("일치하는 사용자 정보가 없거나 발송에 실패했습니다.");
    }
  }
</script>
</body>
</html>
