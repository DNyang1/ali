<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 - ALI</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">
<div class="pointer-events-none fixed inset-0">
    <div class="absolute -top-24 left-1/2 h-72 w-[520px] -translate-x-1/2 rounded-full bg-gradient-to-r from-teal-200/60 to-sky-200/60 blur-3xl"></div>
    <div class="absolute -bottom-24 left-1/3 h-72 w-[520px] -translate-x-1/2 rounded-full bg-gradient-to-r from-sky-200/40 to-teal-200/40 blur-3xl"></div>
</div>

<main class="relative mx-auto flex min-h-screen max-w-[1100px] items-center justify-center px-4 py-10">
    <section class="w-full max-w-md">
        <div class="rounded-2xl border border-slate-200 bg-white/90 shadow-sm backdrop-blur">
            <div class="border-b border-slate-100 px-6 py-6 text-center">
                <a href="/" class="inline-flex items-center justify-center gap-2">
                    <span class="text-2xl font-black tracking-tight text-teal-600">ALI</span>
                    <span class="rounded-full bg-gradient-to-r from-teal-500 to-sky-500 px-2 py-0.5 text-xs font-bold text-white">
              Login
            </span>
                </a>
                <p class="mt-2 text-sm text-slate-500">아이디와 비밀번호로 로그인하세요.</p>
            </div>

            <div class="px-6 py-6">
                <form onsubmit="login(); return false;" class="space-y-4">
                    <div>
                        <label for="userId" class="mb-1 block text-xs font-semibold text-slate-600">아이디</label>
                        <input
                                type="text"
                                id="userId"
                                placeholder="아이디"
                                required
                                class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-800 outline-none transition
                       placeholder:font-medium placeholder:text-slate-400
                       focus:border-teal-300 focus:ring-4 focus:ring-teal-100"
                        />
                    </div>

                    <div>
                        <label for="password" class="mb-1 block text-xs font-semibold text-slate-600">비밀번호</label>
                        <input
                                type="password"
                                id="password"
                                placeholder="비밀번호"
                                required
                                class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-800 outline-none transition
                       placeholder:font-medium placeholder:text-slate-400
                       focus:border-sky-300 focus:ring-4 focus:ring-sky-100"
                        />
                    </div>

                    <button
                            type="submit"
                            class="w-full rounded-xl bg-gradient-to-r from-teal-500 to-sky-500 px-4 py-3 text-sm font-extrabold text-white
                     shadow-sm transition hover:from-teal-600 hover:to-sky-600 active:scale-[0.99]"
                    >
                        로그인
                    </button>
                </form>

                <div class="mt-5 flex flex-wrap items-center justify-center gap-x-3 gap-y-2 text-xs font-semibold text-slate-600">
                    <a href="/user/find_id" class="hover:text-teal-600 hover:underline">아이디 찾기</a>
                    <span class="text-slate-300">|</span>
                    <a href="/user/reset_pw" class="hover:text-sky-600 hover:underline">비밀번호를 잊으셨나요?</a>
                    <span class="text-slate-300">|</span>
                    <a href="/user/register" class="hover:text-teal-600 hover:underline">회원가입</a>
                </div>

                <div class="my-6 flex items-center gap-3">
                    <div class="h-px flex-1 bg-slate-200"></div>
                    <span class="text-xs font-bold text-slate-500">간편 로그인</span>
                    <div class="h-px flex-1 bg-slate-200"></div>
                </div>

                <div class="space-y-3">
                    <a
                            href="/oauth2/authorization/naver"
                            class="flex w-full items-center justify-center gap-2 rounded-xl
         bg-emerald-500 px-4 py-3 text-sm font-extrabold text-white
         hover:bg-emerald-600 transition shadow-sm"
                    >
    <span class="grid h-6 w-6 place-items-center rounded-lg bg-white/20 text-white font-black">
        N
    </span>
                        네이버로 시작하기
                    </a>


                    <a
                            href="/oauth2/authorization/kakao"
                            class="flex w-full items-center justify-center gap-2 rounded-xl border border-slate-200 bg-[#FEE500] px-4 py-3 text-sm font-extrabold text-[#191600]
                     hover:brightness-[0.98] transition"
                    >
                        <span class="grid h-6 w-6 place-items-center rounded-lg bg-black/10 text-[#191600]">K</span>
                        카카오로 시작하기
                    </a>

                    <a
                            href="/oauth2/authorization/google"
                            class="flex w-full items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-bold text-slate-800
                     hover:bg-slate-50 transition"
                    >
                        <span class="grid h-6 w-6 place-items-center rounded-lg bg-sky-100 text-sky-700">G</span>
                        구글로 시작하기
                    </a>
                </div>

                <div class="mt-6 text-center">
                    <a href="/" class="text-sm font-bold text-slate-600 hover:text-slate-900 hover:underline">
                        홈으로 가기
                    </a>
                </div>
            </div>
        </div>

        <p class="mt-4 text-center text-xs text-slate-400">
            ALI 스타일: teal ↔ sky 그라데이션 + slate 베이스
        </p>
    </section>
</main>

<script src="/user/js/login.js"></script>
</body>
</html>
