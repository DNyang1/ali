<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - ALI</title>
    <link rel="stylesheet" href="/user/css/register.css"/>
    <link rel="stylesheet" href="/user/css/login.css"/>
</head>
<body>
<div class="container login-container">
    <h2>ALI</h2>

    <form onsubmit="login(); return false;">
        <div class="input-group">
            <input type="text" id="userId" placeholder="아이디" required>
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="비밀번호" required>
        </div>

        <button type="submit" class="login-btn">로그인</button>
    </form>

    <div class="link-group">
        <a href="/user/find_id">아이디 찾기</a>
        <span class="bar">|</span>
        <a href="/user/reset_pw">비밀번호를 잊으셨나요?</a>
        <span class="bar">|</span>
        <a href="/user/register">회원가입</a>
    </div>

    <div class="divider">
        <span>간편 로그인</span>
    </div>

    <div class="social-login">
        <a href="/oauth2/authorization/naver" class="naver-btn">
            <span class="icon"></span> 네이버로 시작하기
        </a>
        <a href="/oauth2/authorization/kakao" class="kakao-btn">
            <span class="icon"></span> 카카오로 시작하기
        </a>
        <a href="/oauth2/authorization/google" class="google-btn">
            <span class="icon"></span> 구글로 시작하기
        </a>
    </div>

    <div class="bottom-home">
        <a href="/">홈으로 가기</a>
    </div>
</div>

<script src="/user/js/login.js"></script>
</body>
</html>
