<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="mypage/user/layout/base :: layout(~{::body}, ~{::head/link})">
<head>
    <meta charset="UTF-8">
    <title>정보 수정 - ALI</title>
    <link rel="stylesheet" href="/user/css/update.css"/>
</head>
<body>
<div class="setting-container">
    <h1 class="page-title">회원 정보 수정</h1>

    <div class="menu-box update-box">
        <h3 class="box-title">프로필 편집</h3>

        <div class="profile-edit-section">
            <div class="image-wrapper">
                <img id="profilePreview"
                     th:src="${session.loginUser.profileImg != null ? session.loginUser.profileImg : '/images/default.png'}"
                     th:style="${session.loginUser.profileImg == null ? 'display:none;' : 'display:block;'}">
            </div>
            <div class="image-controls">
                <label for="profileFile" class="btn btn-outline small">사진 변경</label>
                <input type="file" id="profileFile" accept="image/*" onchange="previewImage(this)" style="display: none;">
                <button type="button" class="btn btn-delete small" onclick="deleteProfileImage()">이미지 제거</button>
            </div>
        </div>

        <hr class="divider">

        <div class="form-section">
            <div class="input-row">
                <label>아이디</label>
                <div class="input-group disabled">
                    <input type="text" id="userId" th:value="${session.loginUser.userId}" readonly>
                </div>
            </div>

            <div class="input-row">
                <label>이름</label>
                <div class="input-group">
                    <input type="text" id="name" th:value="${session.loginUser.name}" placeholder="이름을 입력하세요">
                </div>
            </div>

            <div class="input-row">
                <label>이메일</label>
                <div class="input-group">
                    <input type="email" id="email" th:value="${session.loginUser.email}" placeholder="이메일 주소">
                </div>
            </div>

            <div class="input-row">
                <label>전화번호</label>
                <div class="input-group">
                    <input type="text" id="phone" th:value="${session.loginUser.phone}" placeholder="전화번호 입력">
                </div>
            </div>

            <div class="input-row">
                <label>주소</label>
                <div class="input-group">
                    <input type="text" id="address" th:value="${session.loginUser.address}" placeholder="주소 입력">
                </div>
            </div>
        </div>

        <div class="action-buttons center">
            <button onclick="updateInfo()" class="btn btn-primary large">수정 완료</button>
            <button onclick="history.back()" class="btn btn-outline large">취소</button>
        </div>
    </div>
</div>

<script src="/user/js/update.js"></script>
</body>
</html>
