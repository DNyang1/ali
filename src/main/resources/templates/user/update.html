<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="mypage/user/layout/base :: layout(~{::content}, null)">

    <th:block th:fragment="content">

        <section class="space-y-6">

            <section>
                <h1 class="text-2xl font-bold text-slate-900">회원정보 수정</h1>
                <p class="mt-1 text-sm text-slate-500">프로필과 기본 정보를 수정하세요.</p>
            </section>

            <section class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">

                <div class="border-b border-slate-100 bg-emerald-50/60 px-6 py-6">
                    <div class="flex flex-col gap-6 sm:flex-row sm:items-center sm:justify-between">

                        <div class="flex items-center gap-5">
                            <img id="profilePreview"
                                 th:src="${(session.loginUser != null and session.loginUser.profileImg != null)
                        ? session.loginUser.profileImg
                        : '/images/default.png'}"
                                 class="h-28 w-28 rounded-xl object-cover border border-slate-200 shadow-sm">

                            <div class="min-w-0">
                                <div class="flex items-center gap-2">
                                    <div class="truncate text-base font-bold text-slate-900"
                                         th:text="${session.loginUser.name}">홍길동</div>
                                    <span class="rounded-full bg-emerald-100 px-2 py-0.5 text-xs font-bold text-emerald-700">USER</span>
                                </div>

                                <dl class="mt-3 grid grid-cols-1 gap-x-6 gap-y-2 text-sm sm:grid-cols-3">
                                    <div class="flex items-center gap-2">
                                        <dt class="text-xs font-semibold text-slate-500">아이디</dt>
                                        <dd class="font-semibold text-slate-700"
                                            th:text="${session.loginUser.userId}"></dd>
                                    </div>
                                    <div class="flex items-center gap-2 min-w-0">
                                        <dt class="text-xs font-semibold text-slate-500">이메일</dt>
                                        <dd class="truncate font-semibold text-slate-700"
                                            th:text="${session.loginUser.email}"></dd>
                                    </div>
                                </dl>
                            </div>
                        </div>

                        <div class="flex flex-wrap gap-2">
                            <label for="profileFile"
                                   class="inline-flex cursor-pointer items-center justify-center rounded-xl
                        bg-gradient-to-r from-brand-500 to-accent-500 px-4 py-2
                        text-sm font-bold text-white hover:from-brand-600 hover:to-accent-600 shadow-sm">
                                사진 변경
                            </label>

                            <input type="file" id="profileFile" accept="image/*" class="hidden"
                                   onchange="previewImage(this)">

                            <button type="button" onclick="deleteProfileImage()"
                                    class="inline-flex items-center justify-center rounded-xl
                         border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700
                         hover:bg-slate-50 shadow-sm">
                                이미지 제거
                            </button>
                        </div>
                    </div>
                </div>

                <div class="px-6 py-7 grid grid-cols-1 gap-5">

                    <div>
                        <label class="text-xs font-semibold text-slate-500">아이디</label>
                        <input readonly th:value="${session.loginUser.userId}"
                               class="mt-1 w-full rounded-xl bg-slate-100 border border-slate-200 px-4 py-2.5 text-sm">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label class="text-xs font-semibold text-slate-500">이름</label>
                            <input id="name" th:value="${session.loginUser.name}"
                                   class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm focus:ring-4 focus:ring-brand/20 focus:border-brand">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-slate-500">이메일</label>
                            <input id="email" th:value="${session.loginUser.email}"
                                   class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm focus:ring-4 focus:ring-brand/20 focus:border-brand">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label class="text-xs font-semibold text-slate-500">전화번호</label>
                            <input id="phone" th:value="${session.loginUser.phone}"
                                   class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm focus:ring-4 focus:ring-brand/20 focus:border-brand">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-slate-500">주소</label>
                            <input id="address" th:value="${session.loginUser.address}"
                                   class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm focus:ring-4 focus:ring-brand/20 focus:border-brand">
                        </div>
                    </div>

                    <div class="flex justify-end gap-2 pt-4">
                        <button onclick="history.back()"
                                class="rounded-xl border border-slate-200 bg-white px-6 py-2.5 text-sm font-bold text-slate-700 hover:bg-slate-50">
                            취소
                        </button>
                        <button onclick="updateInfo()"
                                class="rounded-xl bg-gradient-to-r from-brand-500 to-accent-500 px-6 py-2.5 text-sm font-bold text-white hover:from-brand-600 hover:to-accent-600">
                            수정 완료
                        </button>
                    </div>
                </div>
            </section>

            <script src="/user/js/update.js"></script>

        </section>

    </th:block>
</th:block>
