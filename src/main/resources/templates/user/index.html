<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>메인 페이지</title>
  <style>
    .container { text-align: center; margin-top: 50px; }
    .btn { padding: 10px 20px; text-decoration: none; background: #007bff; color: white; border-radius: 5px; margin: 5px; }
    .logout-btn { background: #dc3545; }
  </style>
</head>
<body>
<div class="container">
  <h1>메인 페이지</h1>
  <hr>

  <div th:if="${session.loginUser == null}">
    <p>로그인이 필요합니다.</p>
    <a th:href="@{/user/login}" class="btn">로그인</a>
    <a th:href="@{/user/register}" class="btn">회원가입</a>
  </div>

  <div th:if="${session.loginUser != null}">
    <p><strong><span th:text="${session.loginUser.name}">사용자</span></strong>님, 환영합니다!</p>
    <p>아이디: <span th:text="${session.loginUser.userId}">ID</span></p>
    <a th:href="@{/user/switch-role}" class="btn" style="background-color: #6c757d;">판매자 모드 전환</a>

    <a th:href="@{/user/update}" class="btn">정보 수정</a>
    <a th:href="@{/user/logout}" class="btn logout-btn">로그아웃</a>
  </div>
</div>
</body>
</html>
