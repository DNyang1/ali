<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="stylesheet" href="/user/css/index.css"/>
  <meta charset="UTF-8">
  <title>메인 페이지</title>
</head>
<body>
<div class="container">
  <h1>메인 페이지</h1>
  <hr>

  <div th:if="${session.loginUser == null}">
    <p>로그인이 필요합니다.</p>
    <a th:href="@{/user/login}" class="btn">로그인</a>
    <a th:href="@{/user/register}" class="btn">회원가입</a>
  </div>

  <div th:if="${session.loginUser != null}">
    <p><strong><span th:text="${session.loginUser.name}">사용자</span></strong>님, 환영합니다!</p>

    <a th:href="@{/chat/messages}" class="btn" style="background-color: #ff8a00;">채팅</a>

    <a th:href="@{/user/mypage}" class="btn" style="background-color: #4A90E2;">마이페이지</a>

    <a th:href="@{/user/switch-role}" class="btn" style="background-color: #6c757d;">판매자 모드 전환</a>

    <a th:href="@{/user/logout}" class="btn logout-btn">로그아웃</a>
    <a th:href="@{/cart/cart.html}" class="btn">장바구니 테스트</a>
  </div>
</div>
</body>
</html>
