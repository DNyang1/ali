<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="mypage/user/layout/base :: layout(~{::body}, ~{::head/link})">
<head>
    <meta charset="UTF-8">
    <title>계정설정</title>
    <link rel="stylesheet" href="/user/css/setting.css"/>
</head>
<body>
<div class="setting-container">
    <h1 class="page-title">계정설정</h1>

    <div class="menu-box">
        <h3 class="box-title">나의 기본 정보</h3>

        <div class="info-content">
            <div class="profile-section">
                <img th:src="${user.profileImg != null ? user.profileImg : '/images/default.png'}"
                     alt="프로필 사진" class="profile-img-setting">
                <p class="profile-label">프로필 이미지</p>
            </div>

            <div class="text-info-section">
                <div class="info-row">
                    <span class="label">아이디</span>
                    <span class="value" th:text="${user.userId}"></span>
                </div>
                <div class="info-row">
                    <span class="label">이름</span>
                    <span class="value" th:text="${user.name}"></span>
                </div>
                <div class="info-row">
                    <span class="label">이메일</span>
                    <span class="value" th:text="${user.email}"></span>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <a th:href="@{/user/update}" class="btn btn-primary">회원정보 수정</a>
            <a th:href="@{/user/update_password}" class="btn btn-outline">비밀번호 변경</a>
        </div>
    </div>
</div>
</body>
</html>
