<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="mypage/user/layout/base :: layout(~{::content}, null)">

    <th:block th:fragment="content">

        <section class="space-y-6">

            <section>
                <h1 class="text-2xl font-bold text-slate-900">비밀번호 변경</h1>
                <p class="mt-1 text-sm text-slate-500">
                    보안을 위해 주기적으로 비밀번호를 변경해 주세요.
                </p>
            </section>

            <section class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">

                <div class="border-b border-slate-100 bg-emerald-50/60 px-6 py-6">
                    <div class="flex items-start gap-3">
                        <div class="mt-0.5 inline-flex h-8 w-8 items-center justify-center rounded-xl bg-emerald-100 text-emerald-700 font-extrabold">
                            !
                        </div>
                        <div>
                            <p class="text-sm font-semibold text-slate-700">
                                8~16자의 영문 대소문자, 숫자, 특수문자를 사용하세요.
                            </p>
                            <p class="mt-1 text-xs text-slate-500">
                                안전한 비밀번호로 계정을 보호할 수 있어요.
                            </p>
                        </div>
                    </div>
                </div>

                <form id="pwForm" class="px-6 py-7 space-y-6">

                    <div>
                        <label for="currentPassword" class="text-xs font-semibold text-slate-500">현재 비밀번호</label>
                        <input type="password" id="currentPassword" placeholder="현재 비밀번호를 입력하세요" required
                               class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm
                          outline-none focus:border-emerald-300 focus:ring-4 focus:ring-emerald-100">
                    </div>

                    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
                        <div>
                            <label for="newPassword" class="text-xs font-semibold text-slate-500">새 비밀번호</label>
                            <input type="password" id="newPassword" placeholder="새 비밀번호 입력" required
                                   class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm
                            outline-none focus:border-emerald-300 focus:ring-4 focus:ring-emerald-100">
                        </div>

                        <div>
                            <label for="confirmPassword" class="text-xs font-semibold text-slate-500">새 비밀번호 확인</label>
                            <input type="password" id="confirmPassword" placeholder="새 비밀번호 다시 입력" required
                                   class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm
                            outline-none focus:border-emerald-300 focus:ring-4 focus:ring-emerald-100">
                        </div>
                    </div>

                    <div class="flex flex-col gap-2 pt-2 sm:flex-row sm:justify-end">
                        <button type="button" onclick="history.back()"
                                class="inline-flex justify-center rounded-xl border border-slate-200 bg-white px-6 py-2.5 text-sm font-bold text-slate-700 hover:bg-slate-50">
                            취소
                        </button>

                        <button type="button" onclick="submitPassword()"
                                class="inline-flex justify-center rounded-xl bg-gradient-to-r from-brand-500 to-accent-500 px-6 py-2.5 text-sm font-bold text-white hover:from-brand-600 hover:to-accent-600">
                            변경하기
                        </button>
                    </div>

                </form>
            </section>

            <script src="/user/js/update_password.js"></script>

        </section>

    </th:block>
</th:block>
