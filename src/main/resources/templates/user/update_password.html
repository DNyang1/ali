<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="mypage/user/layout/base :: layout(~{::body}, ~{::head/link})">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경 - ALI</title>
    <link rel="stylesheet" href="/user/css/update.css"/>
</head>
<body>
<div class="update-container">
    <h1 class="page-title">비밀번호 변경</h1>

    <div class="update-box">
        <h3 class="box-title">보안을 위해 주기적으로 비밀번호를 변경해 주세요.</h3>

        <form id="pwForm" class="form-section">
            <div class="input-row">
                <label for="currentPassword">현재 비밀번호</label>
                <div class="input-group">
                    <input type="password" id="currentPassword" placeholder="현재 비밀번호를 입력하세요" required>
                </div>
            </div>

            <hr class="divider">

            <div class="input-row">
                <label for="newPassword">새 비밀번호</label>
                <div class="input-group">
                    <input type="password" id="newPassword" placeholder="새 비밀번호 입력" required>
                </div>
            </div>

            <div class="input-row">
                <label for="confirmPassword">새 비밀번호 확인</label>
                <div class="input-group">
                    <input type="password" id="confirmPassword" placeholder="새 비밀번호 다시 입력" required>
                </div>
            </div>

            <p class="pw-info">
                * 8~16자의 영문 대소문자, 숫자, 특수문자를 사용하세요.
            </p>

            <div class="btn-group">
                <button type="button" onclick="submitPassword()" class="btn btn-primary large">변경하기</button>
                <button type="button" onclick="history.back()" class="btn btn-outline large">취소</button>
            </div>
        </form>
    </div>
</div>

<script src="/user/js/update_password.js"></script>
</body>
</html>
