<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>장바구니</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 40px;
        }

        .page {
            max-width: 900px;
            margin: 0 auto;
        }

        h2 {
            margin-bottom: 15px;
        }

        .card {
            background: white;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        button {
            cursor: pointer;
            padding: 6px 12px;
        }

        .actions {
            text-align: right;
            margin-top: 20px;
        }

        /* 개발용 패널 */
        .dev-panel {
            border: 1px dashed #999;
            background: #fafafa;
            padding: 15px;
        }

        .dev-panel input {
            margin-right: 5px;
        }
    </style>
</head>
<body>

<div class="page">

    <!-- 🛒 장바구니 -->
    <section class="card">
        <h2>🛒 내 장바구니</h2>

        <div id="cart-items"></div>

        <div class="actions">
            <a href="/checkout/checkout.html">
                <button>결제하기</button>
            </a>
        </div>
    </section>

    <!-- ⚙ 개발용 패널 -->
    <section class="dev-panel">
        <h3>⚙ 개발용: 임시 상품 추가</h3>

        <input type="text" id="productId" placeholder="productId">
        <input type="text" id="skuId" placeholder="skuId">
        <input type="number" id="quantity" value="1" min="1">
        <button onclick="addItem()">추가</button>
    </section>

</div>

<script>
    function loadCart() {
        fetch('/cart')
            .then(res => res.json())
            .then(renderCart);
    }

    function renderCart(cart) {
        const container = document.getElementById('cart-items');
        container.innerHTML = '';

        if (!cart.items || cart.items.length === 0) {
            container.innerHTML = '<p>장바구니가 비어 있습니다.</p>';
            return;
        }

        cart.items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'cart-item';

            div.innerHTML = `
                <span>
                    상품ID: ${item.productId} /
                    SKU: ${item.skuId} /
                    수량: ${item.quantity}
                </span>
                <button onclick="deleteItem('${item.cartItemId}')">삭제</button>
            `;
            container.appendChild(div);
        });
    }

    function addItem() {
        fetch('/cart/items', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                productId: document.getElementById('productId').value,
                skuId: document.getElementById('skuId').value,
                quantity: document.getElementById('quantity').value
            })
        }).then(loadCart);
    }

    function deleteItem(cartItemId) {
        fetch(`/cart/items/${cartItemId}`, { method: 'DELETE' })
            .then(loadCart);
    }

    loadCart();
</script>

</body>
</html>
