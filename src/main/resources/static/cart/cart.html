<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>장바구니</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        h2 {
            margin-bottom: 10px;
        }

        .cart-container {
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 40px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        button {
            cursor: pointer;
        }

        /* 개발용 패널 */
        .dev-panel {
            border: 1px dashed #999;
            padding: 15px;
            background-color: #fafafa;
        }

        .dev-panel h3 {
            margin-top: 0;
            color: #666;
        }

        .dev-panel input {
            margin-right: 5px;
        }
    </style>
</head>
<body>

<!-- ===================== -->
<!-- 1️⃣ 실서비스 장바구니 영역 -->
<!-- ===================== -->
<section class="cart-container">
    <h2>🛒 내 장바구니</h2>

    <div id="cart-items">
        <!-- JS로 렌더링 -->
    </div>
</section>

<!-- ===================== -->
<!-- 2️⃣ 개발용 임시 기능 영역 -->
<!-- ===================== -->
<section class="dev-panel">
    <h3>⚙ 개발용: 임시 상품 추가 (나중에 삭제)</h3>

    <input type="text" id="productId" placeholder="productId">
    <input type="number" id="quantity" placeholder="수량" value="1" min="1">
    <button onclick="addItem()">장바구니에 추가</button>
</section>

<script>
    // =========================
    // 장바구니 조회
    // =========================
    function loadCart() {
        fetch('/cart')
            .then(res => res.json())
            .then(data => renderCart(data));
    }

    function renderCart(cart) {
        const container = document.getElementById('cart-items');
        container.innerHTML = '';

        if (!cart.items || cart.items.length === 0) {
            container.innerHTML = '<p>장바구니가 비어 있습니다.</p>';
            return;
        }

        cart.items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'cart-item';

            div.innerHTML = `
                <span>
                    상품ID: ${item.productId} / 수량: ${item.quantity}
                </span>
                <button onclick="deleteItem('${item.cartItemId}')">
                    삭제
                </button>
            `;

            container.appendChild(div);
        });
    }

    // =========================
    // 임시 상품 추가 (개발용)
    // =========================
    function addItem() {
        const productId = document.getElementById('productId').value;
        const quantity = document.getElementById('quantity').value;

        fetch('/cart/items', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                productId: productId,
                quantity: quantity
            })
        }).then(() => {
            loadCart();
        });
    }

    // =========================
    // 아이템 삭제
    // =========================
    function deleteItem(cartItemId) {
        fetch(`/cart/items/${cartItemId}`, {
            method: 'DELETE'
        }).then(() => {
            loadCart();
        });
    }

    // 초기 로딩
    loadCart();
</script>

</body>
</html>
