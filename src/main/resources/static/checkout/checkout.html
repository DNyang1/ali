<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>결제</title>

    <style>
        /* ===== 전역 최소 ===== */
        body {
            margin: 0;
            padding: 40px 0;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        /* ===== 레이아웃 ===== */
        .checkout-page {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 16px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 6px 24px rgba(0,0,0,.08);
        }

        h2 {
            margin: 0 0 18px;
            font-size: 20px;
        }

        /* ===== 주문 상품 ===== */
        .item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .item:last-child {
            border-bottom: none;
        }

        /* ===== 배송지 목록 ===== */
        .address-card {
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            font-size: 14px;
        }

        .address-card.active {
            border-color: #ff6a00;
            background: #fff7f0;
        }

        .address-card strong {
            display: inline-block;
            margin-bottom: 4px;
        }

        /* ===== 배송지 입력 폼 ===== */
        .address-form {
            margin-top: 16px;
            padding: 16px;
            border: 1px solid #eee;
            border-radius: 12px;
            background: #fafafa;
        }

        .address-form.hidden {
            display: none;
        }

        .address-form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row input {
            flex: 1;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .form-actions button {
            padding: 8px 14px;
            cursor: pointer;
        }

        /* ===== 결제 요약 ===== */
        .summary {
            text-align: right;
        }

        .summary h1 {
            margin: 10px 0 20px;
        }

        .summary button {
            width: 100%;
            background: linear-gradient(135deg,#ff6a00,#ff8a00);
            border: none;
            color: #fff;
            padding: 14px;
            border-radius: 26px;
            font-size: 16px;
            cursor: pointer;
        }

        .back-btn {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="checkout-page">

    <!-- 왼쪽 영역 -->
    <div>

        <!-- 배송지 -->
        <div class="card">
            <h2>🚚 배송지 선택</h2>

            <div id="address-list">
                <p>배송지를 불러오는 중...</p>
            </div>

            <button onclick="toggleAddressForm()">+ 새 배송지 추가</button>

            <!-- 배송지 입력 폼 -->
            <div id="address-form" class="address-form hidden">
                <div class="form-row">
                    <input type="text" id="rName" placeholder="수령인 이름">
                    <input type="text" id="rPhone" placeholder="연락처">
                </div>

                <input type="text" id="zipcode" placeholder="우편번호">
                <input type="text" id="address1" placeholder="주소">
                <input type="text" id="address2" placeholder="상세주소">

                <div class="form-actions">
                    <button onclick="toggleAddressForm()">취소</button>
                    <button onclick="submitAddress()">저장</button>
                </div>
            </div>
        </div>

        <!-- 주문 상품 -->
        <div class="card" style="margin-top:24px;">
            <h2>🧾 주문 상품</h2>
            <div id="preview-items"></div>
        </div>

    </div>

    <!-- 오른쪽 결제 요약 -->
    <div class="card summary">
        <h2>💳 결제 요약</h2>
        <div>총 결제 금액</div>
        <h1><span id="total-amount">0</span> 원</h1>

        <button class="back-btn" onclick="history.back()">장바구니로</button>
        <button onclick="order()">결제하기</button>
    </div>

</div>

<script>
    /* =======================
       주문 미리보기
       ======================= */
    function loadPreview() {
        fetch('/orders/preview')
            .then(res => res.json())
            .then(renderPreview);
    }

    function renderPreview(data) {
        const container = document.getElementById('preview-items');
        container.innerHTML = '';

        if (!data.items || data.items.length === 0) {
            container.innerHTML = '<p>결제할 상품이 없습니다.</p>';
            return;
        }

        data.items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'item';

            div.innerHTML = `
            <span>
                ${item.productName}
                (SKU: ${item.skuId}) × ${item.quantity}
            </span>
            <span>${item.lineAmount} 원</span>
        `;
            container.appendChild(div);
        });

        document.getElementById('total-amount').innerText = data.totalAmount;
    }

    /* =======================
       주문 생성
       ======================= */
    function order() {
        if (!selectedAddressId) {
            alert('배송지를 선택해주세요.');
            return;
        }

        fetch('/orders', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                alert('주문 생성 완료! 주문ID: ' + data.orderId);
            });
    }

    /* =======================
       배송지
       ======================= */
    let selectedAddressId = null;

    function loadAddresses() {
        fetch('/address')
            .then(res => res.json())
            .then(renderAddresses);
    }

    function renderAddresses(addresses) {
        const container = document.getElementById('address-list');
        container.innerHTML = '';

        if (!addresses || addresses.length === 0) {
            container.innerHTML = '<p>등록된 배송지가 없습니다.</p>';
            return;
        }

        addresses.forEach(addr => {
            const div = document.createElement('div');
            div.className = 'address-card';

            if (addr.isDefault) {
                div.classList.add('active');
                selectedAddressId = addr.id;
            }

            div.onclick = () => selectAddress(div, addr.id);

            div.innerHTML = `
            <strong>${addr.rName || '수령인 미지정'}</strong>
            (${addr.rPhone || '-'})<br>
            [${addr.zipcode}] ${addr.address1} ${addr.address2 || ''}
            ${addr.isDefault ? '<div style="color:#ff6a00;">기본 배송지</div>' : ''}
        `;
            container.appendChild(div);
        });
    }

    function selectAddress(el, id) {
        document.querySelectorAll('.address-card').forEach(a => a.classList.remove('active'));
        el.classList.add('active');
        selectedAddressId = id;
    }

    /* =======================
       배송지 입력 폼
       ======================= */
    function toggleAddressForm() {
        document.getElementById('address-form')
            .classList.toggle('hidden');
    }

    function submitAddress() {
        const rName = document.getElementById('rName').value;
        const rPhone = document.getElementById('rPhone').value;
        const zipcode = document.getElementById('zipcode').value;
        const address1 = document.getElementById('address1').value;
        const address2 = document.getElementById('address2').value;

        if (!rName || !address1) {
            alert('수령인과 주소는 필수입니다.');
            return;
        }

        fetch('/address', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                rName,
                rPhone,
                zipcode,
                address1,
                address2,
                isDefault: false
            })
        }).then(() => {
            alert('배송지 추가 완료');
            toggleAddressForm();
            loadAddresses();
        });
    }

    /* 초기 로딩 */
    loadPreview();
    loadAddresses();
</script>

</body>
</html>
